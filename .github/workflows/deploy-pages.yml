name: Deploy MkDocs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material
      - name: Build site
        run: mkdocs build --strict
      - name: Build Pagefind search index
        # Scans the built HTML in site/ and writes the sharded index +
        # search UI bundle into site/pagefind/, deployed alongside the site.
        run: npx -y pagefind@^1 --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
