name: Deploy MkDocs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A build takes ~7 min (mkdocs ~2.5 + pagefind ~3.5 + upload ~0.5), and pushes
# land every couple of hours, so cancelling the in-flight run buys nothing and
# loses the whole deploy. It used to be `cancel-in-progress: true`, and superseded
# runs died inside the Pagefind step — the longest one — before the artifact was
# even uploaded: 8 consecutive runs on 2026-11-14 died that way and the site
# stayed frozen at the 2026-11-13 deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard cap. A killed Pagefind step used to leave the job hanging on the
    # runner for 40-50 min after its last step finished (run 622: steps done
    # 14:33, job "completed" 15:17), and that zombie held the single `pages`
    # slot, so every later push queued up behind it and got cancelled in turn.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install MkDocs
        # Pinned. `pip install mkdocs mkdocs-material` floated to whatever was
        # newest on PyPI, so a release could change `--strict` behaviour (or a
        # theme asset path) between two runs that should have been identical.
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.6"
      - name: Build site
        run: mkdocs build --strict
      - name: Build Pagefind search index
        # Scans the built HTML in site/ and writes the sharded index +
        # search UI bundle into site/pagefind/, deployed alongside the site.
        #
        # The indexed scope is deliberately bounded. Pagefind's peak RSS grows at
        # ~2-3 MB per page, and the full corpus (~9.9k pages) needs ~19 GB — more
        # than the 16 GB `ubuntu-latest` runner, so indexing everything got the
        # job OOM-killed about a minute in (which GitHub surfaces only as
        # "The operation was canceled."). That is what froze the site from
        # 2026-11-14 to 2026-11-15.
        #
        # Scope: every section except the deep-read archive + the last three
        # months of deep reads = ~3.6k pages / ~7.6 GB / ~55 s measured locally.
        # Older deep reads stay published and browsable, they just do not appear
        # in full-text search. The month list rolls automatically, so coverage
        # does not silently age out.
        continue-on-error: true
        run: |
          months=$(for i in 0 1 2; do date -u -d "-$i month" +%Y-%m; done \
                   | sed 's|^|deep_reads/|; s|$|*|' | paste -sd, -)
          glob="{daily,journals,talks,conferences,benchmarks,autoresearch,proposals,synthesis,shootout,weekly,data,favorites,all_deep_reads,all_daily,all_journals,all_synthesis,all_shootout,all_talks,all_weekly,${months}}/**/*.html"
          echo "pagefind glob: $glob"
          npx -y "pagefind@1.6.0" --site site --glob "$glob"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
