# AI auto-research track — scoring & summary rubric.
#
# A THIRD interest profile, independent of config/interests.yaml (stats) and
# config/interests.benchmark.yaml (AI evaluation). The question here is not
# "is the measurement good" but "how far can an agent actually run the research
# loop on its own, and what is the evidence for that claim".

researcher: "陈星宇 (Chen Xingyu)"

positioning: |
  「AI 自动科研 / auto-research agent」对本人的定位是一个**方向追踪**：
  - 想看的是：一个 agent 到底把科研流程自动化到了哪一步——选题/假设生成、
    文献调研、实验设计与代码实现、结果分析、写作与投稿，哪几环真的闭环了，
    哪几环还是人在兜底；
  - 关心证据质量：是不是只在几个 toy 任务上跑通、有没有和新颖性/可复现性
    挂钩、baseline 是否公平、失败模式（错误累积、reward hacking、幻觉引用）
    有没有被量化；
  - 与统计的连接点：自动化实验的样本量与多重比较、LLM-as-judge 评研究质量、
    自动生成假设的可检验性、把"科研产出"当 estimand 时的测量效度。

primary_interests:
  - end-to-end research agents (AI Scientist, Agent Laboratory, research pipelines)
  - idea / hypothesis generation and novelty search
  - automated experiment design, code execution and result analysis
  - literature review / retrieval agents over scientific corpora
  - evaluation of research agents (benchmarks, human studies, reproducibility)
  - self-driving labs and closed-loop scientific discovery
  - failure modes: error accumulation, hallucinated citations, reward hacking

secondary_interests:
  - automated peer review / paper writing agents
  - human-AI collaboration in research (scientist-in-the-loop)
  - agent memory / long-horizon state for multi-day research runs
  - cost / compute accounting for autonomous research
  - AI4Science applications where the agent is the contribution

out_of_scope:
  - plain AutoML / hyper-parameter search with no research-loop claim
  - 'we used an LLM to help write a paper' (writing assistance only)
  - agent papers on unrelated tasks (web, GUI, coding) with no research framing
  - position papers with no system and no evidence

summary_style: |
  - 4-6 句中文：先写它自动化了科研的哪些环节（输入→输出闭环），再写系统构成
    （几个 agent、用什么模型、有没有代码执行/检索/评审），最后写证据（任务数、
    baseline、人工评估、成本）。
  - 明确区分「demo 级」与「真的端到端」：如果人在每个环节都要介入，要说清楚。
  - 末尾一句"为什么值得看"：具体到自动化程度或证据缺口，不要只说"与 auto-research 相关"。

# Display / ingest thresholds for this track.
score_threshold_show: 4
score_threshold_highlight: 8
# Deep reads stay opt-in for this track too.
score_threshold_deepread: 9
