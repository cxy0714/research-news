- id: ocis-2022-05-10-tim-morrison-harrison-li
  url: https://youtu.be/JcyOiBUt8HM
  title: '- Talk 1 : Optimality in multivariate tie-breaker designs'
  speaker: Tim Morrison ; Harrison Li
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-05-10'
  topic: causal_inference
  language: en
  abstract: 'Tie-breaker designs (TBDs), in which subjects with extreme values are
    assigned treatment deterministically and those in the middle are randomized, are
    intermediate between regression discontinuity designs (RDDs) and randomized controlled
    trials (RCTs). TBDs thus provide a convenient mechanism by which to trade off
    between the treatment benefit of an RDD and the statistical efficiency gains of
    an RCT. We study a model where the expected response is one multivariate regression
    for treated subjects and another one for control subjects. For a given set of
    subject data we show how to use convex optimization to choose treatment probabilities
    that optimize a prospective D-optimality condition (expected information gain).
    We can incorporate economically motivated linear constraints on those treatment
    probabilities as well as monotonicity constraints that have a strong ethical motivation.
    Our condition can be used in two scenarios: known covariates with random treatments,
    and random covariates with random treatments.'
  slides: https://drive.google.com/file/d/1e6hbZvnjX7cYUeFHOPIPCMkBHIRZ9TI6/view?usp=sharing
  season: spring-2022
- id: ocis-2022-10-25-rahul-singh
  url: https://youtu.be/o1lYQc-dWSU
  title: '- Talk 1 Title: Causal Inference with Corrupted Data: Measurement Error,
    Missing Values, Discretization, and Differential Privacy - Talk 1 Abstract: The
    2020 US Census will be published with differential privacy, implemented by injecting
    synthetic noise into the data. Controversy has ensued, with debates that center
    on the painful trade-off between the privacy of respondents and the precision
    of economic analysis. Is this trade-off inevitable? To answer this question, we
    formulate a semiparametric model of causal inference with high dimensional data
    that may be noisy, missing, discretized, or privatized. We propose a new end-to-end
    procedure for data cleaning, estimation, and inference with data cleaning-adjusted
    confidence intervals. We prove consistency, Gaussian approximation, and semiparametric
    efficiency by finite sample arguments. The rate of Gaussian approximation is n−1/2
    for semiparametric estimands such as average treatment effect, and it degrades
    gracefully for nonparametric estimands such as heterogeneous treatment effect.
    Our key assumption is that the true covariates are approximately low rank, which
    we interpret as approximate repeated measurements and validate in the Census.
    In our analysis, we provide nonasymptotic theoretical contributions to matrix
    completion, statistical learning, and semiparametric statistics. We verify the
    coverage of the data cleaning-adjusted confidence intervals in simulations. Finally,
    we conduct a semi-synthetic exercise calibrated to privacy levels mandated for
    the 2020 US Census.'
  speaker: Rahul Singh
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-10-25'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1CBN8yy_22DSynHsCmb1qZNgDOlcLfKY3/view?usp=sharing
  season: fall-2022
  papers:
  - '2210.01798'
- id: ocis-2023-10-03-caleb-miles-discussant-standard-form-jam
  url: https://youtu.be/GKwmVJtVJRk
  title: Two fundamental problems in causal mediation analysis
  speaker: Caleb Miles, - Discussant [standard form]:, James Robins, Thomas Richardson
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-10-03'
  topic: causal_inference
  language: en
  abstract: 'Scientists are often interested in understanding mediating mechanisms
    that can help explain causal effects. A vast body of literature on mediation analysis
    has accumulated since two foundational articles (Robins and Greenland, 1992; Pearl,
    2001) formalized mediation in the language of causality. However, causal mediation
    analysis poses many fundamental, interesting, and unresolved difficulties in its
    causal interpretation, nonparametric identification assumptions (which are much
    stronger than most typical causal assumptions), and statistical inference. I will
    discuss some of my work in two of these categories: (i) the interpretation of
    alternative estimands that have been proposed to circumvent the standard identification
    assumptions, and (ii) the implicit assumptions embedded in the standard mediation
    identification assumptions and their shortcomings in handling the inherent time-varying
    nature of mediators.'
  slides: https://drive.google.com/file/d/1pTsX6hg0cmDZS6L1Gpg_IA4-W9oV7YGi/view?usp=sharing
  season: fall-2023
- id: ocis-2023-11-28-yuqi-gu-d-iscussant-qingyuan-zhao
  url: https://youtu.be/ZXV5KE6g3FI
  title: Identifiable Deep Generative Models for Rich Data Types with Discrete Latent
    Layers
  speaker: 'Yuqi Gu, - D, iscussant: Qingyuan Zhao'
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-11-28'
  topic: causal_inference
  language: en
  abstract: We propose a class of identifiable deep generative models for very flexible
    data types. The key features of the proposed models include (a) discrete latent
    layers and (b) a shrinking pyramid- or ladder-shaped deep architecture. We establish
    model identifiability by developing transparent conditions on the sparsity structure
    of the deep generative graph. The proposed identifiability conditions can ensure
    estimation consistency in both the Bayesian and frequentist senses. As an illustration,
    we consider the two-latent-layer model and propose shrinkage estimation methods
    to recover the latent structure and model parameters. Simulation results corroborate
    the identifiability theory and also demonstrates the nice empirical performance
    of our estimation algorithm. Applications of the methodology to a DNA nucleotide
    sequence dataset and an educational test response time dataset both give interpretable
    results. The proposed framework provides a recipe for identifiable, interpretable,
    and reliable deep generative modeling. In the future, it would be interesting
    to explore the implications on causal structure discovery and causal representation
    learning of the proposed identifiability results.
  slides: https://drive.google.com/file/d/1u6M60UjCvaSK24S8BZ8Hbe1QjSJtUS8X/view?usp=sharing
  season: fall-2023
- id: ocis-2024-03-19-sara-magliacane
  url: https://youtu.be/vPpfExqOdCE
  title: 'BISCUIT: Causal Representation Learning from Binary Interactions'
  speaker: Sara Magliacane
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-03-19'
  topic: causal_inference
  language: en
  discussant: Sébastien Lachapelle
  abstract: Identifying the causal variables of an environment and how to intervene
    on them is of core value in applications such as robotics and embodied AI. While
    an agent can commonly interact with the environment and may implicitly perturb
    the behavior of some of these causal variables, often the targets it affects remain
    unknown. In this talk, we show that causal variables can still be identified for
    many common setups, e.g., additive Gaussian noise models, if the agent's interactions
    with a causal variable can be described by an unknown binary variable. This happens
    when each causal variable has two different mechanisms, e.g., an observational
    and an interventional one. Using this identifiability result, we propose BISCUIT,
    a method for simultaneously learning causal variables and their corresponding
    binary interaction variables. On three robotic-inspired datasets, BISCUIT accurately
    identifies causal variables and can even be scaled to complex, realistic environments
    for embodied AI.
  slides: https://drive.google.com/file/d/1nllryOY_DUveYyQSViBobu3-5Ewi4SAR/view?usp=sharing
  season: winter-2024
- id: ocis-2024-05-07-raaz-dwivedi
  url: https://youtu.be/QDTTR7JH3DM
  title: Integrating Double Robustness into Causal Latent Factor Models
  speaker: Raaz Dwivedi
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-05-07'
  topic: causal_inference
  language: en
  discussant: James Robins
  abstract: Latent factor models are widely utilized for causal inference in panel
    data, involving multiple measurements across various units. Popular inference
    methods include matrix completion for estimating the average treatment effect
    (ATE) and the nearest neighbor approach for individual treatment effects (ITE).
    However, these methods respectively underperform with non-low-rank outcomes or
    when faced with diverse units in the data. To tackle these challenges, we integrate
    double robustness principles with factor models, introducing estimators designed
    to be resilient against such issues. We present a doubly robust matrix completion
    strategy for ATE, capable of ensuring consistency despite unobserved confounding,
    either with low-rank outcome matrices or propensity matrices, and providing superior
    error/confidence intervals when both matrices are low-rank. Next, we propose a
    doubly robust nearest neighbor method for ITE, designed to achieve consistent
    estimates in the presence of either similar units or measurements, with improved
    error/confidence intervals when both conditions are met.
  slides: https://drive.google.com/file/d/1FzZ-nxIjj5wsxLKYPedLlh65lXj1simL/view?usp=sharing
  season: spring-2024
  papers:
  - '2402.11652'
