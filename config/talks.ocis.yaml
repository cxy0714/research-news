- id: ocis-2021-10-05-eleanor-sanderson
  url: https://youtu.be/Cx5AZN8Q_Zs
  title: '- Estimation of causal effects of an exposure at multiple time points through
    Multivariable Mendelian randomization'
  speaker: Eleanor Sanderson
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-10-05'
  topic: causal_inference
  language: en
  discussant: Stephen Burgess
  abstract: Mendelian Randomisation (MR) is a powerful tool in epidemiology which
    can be used to estimate the causal effect of an exposure on an outcome in the
    presence of unobserved confounding, by utilising genetic variants as instrumental
    variables (IVs) for the exposure. The effects obtained from MR studies are often
    interpreted as the lifetime effect of the exposure in question. However, the causal
    effects of many exposures are thought to vary throughout an individual’s lifetime
    and there may be periods that are more important for a particular outcome. Multivariable
    MR (MVMR) is an extension of MR that allows for multiple, potentially highly related,
    exposures to be included in an MR estimation. We discuss the estimation and interpretation
    of MVMR models, including how the instrumental variable assumptions apply to models
    with multiple exposures. We then go on to explore the use of MVMR to estimate
    the effect of a single exposure at different time points in an individual’s lifetime
    on an outcome. We show that the direct effect of different time periods can be
    estimated through MVMR when the association between the genetic variants used
    as instruments and those time periods varies, however careful interpretation of
    the results obtained is important. Finally, we illustrate this approach through
    estimation of the causal effects of childhood and adult BMI on a range of different
    outcomes.
  slides: https://docs.google.com/presentation/d/1MRvKMQmUDfPri1Uixi1nhw1fDYXx6oHR/edit?usp=sharing&ouid=103522914004166230828&rtpof=true&sd=true
  season: fall-2021
- id: ocis-2021-09-07-joseph-antonelli
  url: https://youtu.be/UFULFk98IOo
  title: Heterogeneous causal effects of neighborhood policing in New York City with
    staggered adoption of the policy
  speaker: Joseph Antonelli
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-09-07'
  topic: causal_inference
  language: en
  discussant: Matthew Cefalu
  abstract: Communities often self select into implementing a regulatory policy, and
    adopt the policy at different time points. In New York City, neighborhood policing
    was adopted at the police precinct level over the years 2015-2018, and it is of
    interest to both (1) evaluate the impact of the policy, and (2) understand what
    types of communities are most impacted by the policy, raising questions of heterogeneous
    treatment effects. We develop novel statistical approaches that are robust to
    unmeasured confounding bias to study the causal effect of policies implemented
    at the community level. Using techniques from high-dimensional Bayesian time-series
    modeling, we estimate treatment effects by predicting counterfactual values of
    what would have happened in the absence of neighborhood policing. We couple the
    posterior predictive distribution of the treatment effect with flexible modeling
    to identify how the impact of the policy varies across time and community characteristics.
    Using pre-treatment data from New York City, we show our approach produces unbiased
    estimates of treatment effects with valid measures of uncertainty. Lastly, we
    find that neighborhood policing decreases discretionary arrests, but has little
    effect on crime or racial disparities in arrest rates.
  slides: https://drive.google.com/file/d/1SQpKAaQvbTGBEh213udmGrP0S_TX7hqL/view?usp=sharing
  season: fall-2021
  papers:
  - '2006.07681'
- id: ocis-2021-08-31-susan-athey-and-stefan-wager
  url: https://youtu.be/YBbnCDRCcAI
  title: Estimating heterogeneous treatment effects in R
  speaker: Susan Athey and Stefan Wager
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-08-31'
  topic: causal_inference
  language: en
  abstract: This tutorial will survey recent advances in machine learning based estimation
    of conditional average treatment effects under unconfoundedness. We will also
    discuss methods for validating and interpreting estimates of treatment heterogeneity.
    Methods will be illustrated using numerical examples in R.
