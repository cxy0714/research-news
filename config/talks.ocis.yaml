- id: ocis-2023-12-12-mats-stensrud-aaron-sarvet
  url: https://youtu.be/bEhAMREAEbo
  title: Interpretational errors in causal inference and how to avoid them
  speaker: Mats Stensrud, Aaron Sarvet
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-12-12'
  topic: causal_inference
  language: en
  discussant: 'Kerollos Wanis and Vanessa Didelez . Q&A moderators: Lan Wen'
  slides: https://drive.google.com/file/d/1NOkFQaB1bC5HCmpGV7gVC635TlhdJoQG/view?usp=drive_link
  abstract: Pioneering works in causal inference were explicitly grounded in practical
    disciplines, aiming at formalizing real questions with mathematical definitions.
    Now, causal inference methods provide an architecture that profoundly regulates
    what practical questions get asked and how they get answered. Here we consider
    subtly different approaches for causal inference research, and their implications
    for theory development and practice. In this process, we formalize an interpretational
    error that is increasingly apparent in the causal literature, which we coin "identity
    slippage". This formalization can be used for error detection whenever policy
    decisions depend on the accurate interpretation of statistical results, which
    is nearly always the case. Therefore, broad awareness of identity slippage will
    aid in the successful translation of data into public good. As an illustration,
    we describe how this error appears in the methodological literature on mediation
    analysis, and how the error has propagated to applied disciplines.
  season: fall-2023
- id: ocis-2023-12-05-erica-moodie
  url: https://youtu.be/wgJZKwCtxHs
  title: Flexible modeling of adaptive treatment strategies for censored outcomes
  speaker: Erica Moodie
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-12-05'
  topic: causal_inference
  language: en
  discussant: Yu Cheng , Peter Thall
  slides: https://drive.google.com/file/d/1Ispze3Z0pFVpOfS4f-Eoa60FfDR_K_bF/view?usp=sharing
  abstract: To achieve the goal of providing the optimal care to each patients, physicians
    must customize treatments. Making decisions at multiple stages as a disease progresses
    can be formalized as an adaptive treatment strategy (ATS). To be able to recommend
    an optimal treatment, an understanding of the causal effect of treatment is required.
    In this talk, I will discuss an extension of a general Bayesian machine learning
    framework for the popular estimation approach of Q-learning, adapted to censored
    outcomes using Bayesian additive regression trees (BART) for each stage under
    an accelerated failure time modeling framework. The developments are motivated
    by and applied to an analysis aimed at estimating optimal immunosuppressant treatment
    strategies to maximize the disease-free survival time in a cohort of patients
    who underwent allogeneic hematopoietic cell transplant to treat myeloid leukemia.
    Joint work with Xiao Li, Brent R Logan, and S M Ferdous Hossain.
  season: fall-2023
- id: ocis-2023-11-28-yuqi-gu
  url: https://youtu.be/ZXV5KE6g3FI
  title: Identifiable Deep Generative Models for Rich Data Types with Discrete Latent
    Layers
  speaker: Yuqi Gu
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-11-28'
  topic: causal_inference
  language: en
  discussant: Qingyuan Zhao
  slides: https://drive.google.com/file/d/1u6M60UjCvaSK24S8BZ8Hbe1QjSJtUS8X/view?usp=sharing
- id: ocis-2023-11-14-maya-mathur
  url: https://youtu.be/UCT47LTtUj4
  title: A common-cause principle for eliminating selection bias in causal estimands
    through covariate adjustment
  speaker: Maya Mathur
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-11-14'
  topic: causal_inference
  language: en
  discussant: Eric Tchetgen Tchetgen and Nan Laird [new format]
  abstract: Average treatment effects (ATEs) may be subject to selection bias when
    they are estimated among only a non-representative subset of the target population.
    Selection bias can sometimes be eliminated by conditioning on a “sufficient adjustment
    set” of covariates, even for some forms of missingness not at random (MNAR). Without
    requiring full specification of the causal structure, we consider sufficient adjustment
    sets to allow nonparametric identification of conditional ATEs in the target population.
    Covariates in the sufficient set may be collected among only the selected sample.
    We establish that if a sufficient set exists, then the set consisting of common
    causes of the outcome and selection, excluding the exposure and its descendants,
    also suffices. We establish simple graphical criteria for when a sufficient set
    will not exist, which could help indicate whether this is plausible for a given
    study. Simulations considering selection due to missing data indicated that sufficiently-adjusted
    complete-case analysis (CCA) can considerably outperform multiple imputation under
    MNAR and, if the sample size is not large, sometimes even under missingness at
    random. Analogous to the common-cause principle for confounding, these sufficiency
    results clarify when and how selection bias can be eliminated through covariate
    adjustment.
  season: fall-2023
- id: ocis-2023-11-07-anish-agarwal
  url: https://youtu.be/MLvmxbLnZT8
  title: On Causal Inference with Temporal and Spatial Spillovers in Panel Data
  speaker: Anish Agarwal
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-11-07'
  topic: causal_inference
  language: en
  papers:
  - '2210.11003'
  discussant: Iavor Bojinov and Ashesh Rambachan
  slides: https://drive.google.com/file/d/1Bz2JjkcxWHf8X0Nh-YI0BHOEdOQq0eFo/view?usp=sharing
  abstract: 'Panel data is a ubiquitous setting where one collects multiple measurements
    over time of a collection of heterogeneous units (e.g., individuals, firms, geographic
    entities). Two pervasive challenges in doing causal inference in such settings
    are: (1) temporal spillovers - interventions in the past affect current outcomes;
    (2) spatial spillovers - interventions a unit receives affects the outcomes of
    its neighboring units. We develop a causal framework to tackle these two challenges.
    We do so by proposing a novel latent factor model that allows one to share information
    across units, measurements, and interventions, and incorporates both types of
    spillovers. The model subsumes linear time-varying dynamical systems and autoregressive
    processes as a special case, and previously studied models for spatial spillovers.
    We show how a variety of causal parameters are identified and estimated despite
    unobserved confounding.'
  season: fall-2023
- id: ocis-2023-10-31-richard-guo
  url: https://youtu.be/C0ixUOh6T2I
  title: Confounder selection via iterative graph expansion
  speaker: Richard Guo
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-10-31'
  topic: causal_inference
  language: en
  papers:
  - '2309.06053'
  discussant: Ilya Shpitser
  slides: https://drive.google.com/file/d/1yvksnc4y9y88gNLm0j4UEZh5nZkWAPTe/view?usp=sharing
  abstract: Confounder selection, namely choosing a set of covariates to control for
    confounding between a treatment and an outcome, is arguably the most important
    step in the design of observational studies. Previous methods, such as Pearl's
    celebrated back-door criterion, typically require pre-specifying a causal graph,
    which can often be difficult in practice. We propose an interactive procedure
    for confounder selection that does not require pre-specifying the graph or the
    set of observed variables. This procedure iteratively expands the causal graph
    by finding what we call "primary adjustment sets" for a pair of possibly confounded
    variables. This can be viewed as inverting a sequence of latent projections of
    the underlying causal graph. Structural information in the form of primary adjustment
    sets is elicited from the user, bit by bit, until either a set of covariates are
    found to control for confounding or it can be determined that no such set exists.
    We show that if the user correctly specifies the primary adjustment sets in every
    step, our procedure is both sound and complete.
  season: fall-2023
- id: ocis-2023-10-17-ricardo-silva
  url: https://youtu.be/y0KCHT9qy8c
  title: 'Intervention Generalization: A View from Factor Graph Models'
  speaker: Ricardo Silva
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-10-17'
  topic: causal_inference
  language: en
  papers:
  - '2306.04027'
  discussant: Anish Agarwal
  slides: https://drive.google.com/file/d/1pbkt2BOu-aUXtcWBLdGG6ZrmoY0_ISQp/view?usp=share_link
  abstract: One of the goals of causal inference is to generalize from past experiments
    and observational data to novel conditions. While it is in principle possible
    to eventually learn a mapping from a novel experimental condition to an outcome
    of interest, provided a sufficient variety of experiments is available in the
    training data, coping with a large combinatorial space of possible interventions
    is hard. Under a typical sparse experimental design, this mapping is ill-posed
    without relying on heavy regularization or prior distributions. Such assumptions
    may or may not be reliable, and can be hard to defend or test. In this paper,
    we take a close look at how to warrant a leap from past experiments to novel conditions
    based on minimal assumptions about the factorization of the distribution of the
    manipulated system, communicated in the well-understood language of factor graph
    models. A postulated interventional factor model (IFM) may not always be informative,
    but it conveniently abstracts away a need for explicit unmeasured confounding
    and feedback mechanisms, leading to directly testable claims. We derive necessary
    and sufficient conditions for causal effect identifiability with IFMs using data
    from a collection of experimental settings, and implement practical algorithms
    for generalizing expected outcomes to novel conditions never observed in the data.
    This is joint work with Gecia Bravo-Hermsdorff, David S. Watson, Jialin Yu and
    Jakob Zeitler.
  season: fall-2023
- id: ocis-2023-10-10-ruoqi-yu-peng-ding
  url: https://youtu.be/OObh7pMyDW4
  title: How to learn more from observational factorial studies
  speaker: Ruoqi Yu, Peng Ding
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-10-10'
  topic: causal_inference
  language: en
  discussant: José Zubizarreta and Luke Keele [new format]
  abstract: Many scientific questions in biomedical research, environmental sciences,
    and psychology involve understanding the impact of multiple factors on an outcome
    of interest. Randomized factorial experiments are a popular tool for evaluating
    the causal effects of multiple factors and their interactions simultaneously.
    However, randomization is often infeasible in many empirical studies, and drawing
    reliable causal inferences for multiple factors in observational studies remains
    challenging. As the number of treatment combinations grows exponentially with
    the number of factors, some treatment combinations can be rare or even missing
    in the data due to chance, posing additional difficulties in factorial effects
    estimation. To address these challenges, we propose a novel weighting approach
    tailored for observational studies with multiple factors. Our approach uses weighted
    observational data to approximate a randomized factorial experiment, enabling
    us to estimate the effects of multiple factors and their interactions simultaneously
    using the same set of weights. Our investigations reveal a crucial nuance that
    achieving balance among observed covariates, as conventionally practiced with
    single-factor scenarios, is necessary but insufficient for unbiased estimation
    of the factorial effects of interest. Notably, our findings suggest that balancing
    the treatments for each contrast is also essential in multi-factor settings. Moreover,
    we discuss how to extend the proposed weighting method when some treatment combinations
    are missing in the data. Finally, we study the asymptotic behavior of the new
    weighting estimators and propose a consistent variance estimator, allowing researchers
    to conduct inferences for the factorial effects in observational studies. Our
    approach is applicable to various observational studies, providing a valuable
    tool for investigators interested in estimating the causal effects of multiple
    factors.
  season: fall-2023
- id: ocis-2023-10-03-caleb-miles
  url: https://youtu.be/GKwmVJtVJRk
  title: 'Two fundamental problems in causal mediation analysis Discussant [standard
    form]: James Robins (Harvard University) and Thomas Richardson (University of
    Washington)'
  speaker: Caleb Miles
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-10-03'
  topic: causal_inference
