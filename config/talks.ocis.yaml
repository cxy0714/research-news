- id: ocis-2023-09-26-michael-hudgens-chanhwa-lee
  url: https://youtu.be/3Q8yttwn_WI
  title: Efficient Nonparametric Estimation of Stochastic Policy Effects with Clustered
    Interference
  speaker: Michael Hudgens, Chanhwa Lee
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-09-26'
  topic: causal_inference
  language: en
  papers:
  - '2212.10959'
  slides: https://drive.google.com/file/d/1hMvVtFfVzv1yI5BZg1BuozVn83sawvlU/view?usp=sharing
  abstract: Interference occurs when a unit's treatment (or exposure) affects another
    unit's outcome. In some settings, units may be grouped into clusters such that
    it is reasonable to assume that interference, if present, only occurs between
    individuals in the same cluster, i.e., there is clustered interference. Various
    causal estimands have been proposed to quantify treatment effects under clustered
    interference from observational data, but these estimands either entail treatment
    policies lacking real-world relevance or are based on parametric propensity score
    models. Here, we propose new causal estimands based on modification of the propensity
    score distribution which may be more relevant in many contexts and are not based
    on parametric models. Nonparametric sample splitting estimators of the new estimands
    are constructed, which allow for flexible data-adaptive estimation of nuisance
    functions and are consistent, asymptotically normal, and efficient, converging
    at the usual parametric rate. Simulations show the finite sample performance of
    the proposed estimators. The proposed methods are applied to evaluate the effect
    of water, sanitation, and hygiene facilities on diarrhea among children in Senegal.
  season: fall-2023
- id: ocis-2023-09-19-andrew-gelman
  url: https://youtu.be/Sya-s-wibnw
  title: Better Than Difference in Differences
  speaker: Andrew Gelman
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-09-19'
  topic: causal_inference
  language: en
  slides: http://www.stat.columbia.edu/~gelman/research/published/chickens.pdf
  abstract: 'It is not always clear how to adjust for control data in causal inference,
    balancing the goals of reducing bias and variance. We show how, in a setting with
    repeated experiments, Bayesian hierarchical modeling yields an adaptive procedure
    that uses the data to determine how much adjustment to perform. The result is
    a novel analysis with increased statistical efficiency compared with the default
    analysis based on difference estimates. The increased efficiency can have real-world
    consequences in terms of the conclusions that can be drawn from the experiments.
    An open question is how to apply these ideas in the context of a single experiment
    or observational study, in which case the optimal adjustment cannot be estimated
    from the data; still, the principle holds that difference-in-differences can be
    extremely wasteful of data. The talk follows up on Andrew Gelman and Matthijs
    Vákár (2021), Slamming the sham: A Bayesian model for adaptive adjustment with
    noisy control data'
  season: fall-2023
- id: ocis-2023-05-09-yuhao-wang
  url: https://youtu.be/HJCIQthynP0
  title: Root-n-consistent estimators for average treatment effect with minimal sparsity
  speaker: Yuhao Wang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-05-09'
  topic: causal_inference
  language: en
  papers:
  - '2011.08661'
  discussant: Rajarshi Mukherjee
  slides: https://drive.google.com/file/d/1mWfabrkmsXLAPg8ivqhynutlhKhF4qzT/view?usp=share_link
  abstract: This talk is about root-n-consistent estimation of average treatment effects
    with high dimensional confounders under minimal sparsity conditions. The entire
    talk is splitted into two parts. In part I, we introduce a debiased inverse propensity
    score weighting (DIPW) scheme for average treatment effect estimation that delivers
    root-n-consistent estimates when the propensity score follows a sparse logistic
    regression model; and the outcome regression functions are permitted to be arbitrarily
    complex. We further demonstrate how confidence intervals centred on our estimates
    may be constructed. Our theoretical results quantify the price to pay for permitting
    the regression functions to be unestimable, which shows up as an inflation of
    the variance of the estimator compared to the semiparametric efficient variance
    by a constant factor, under mild conditions. We also show that when outcome regressions
    can be estimated faster than a slow o(1 / log n) rate. Finally, we show how propensity
    score models with more general link functions may be handled within our framework.
    This is based on a joint work with Professor Rajen Shah from the University of
    Cambridge. In part II, we introduce an extension of DIPW estimator, which we call
    double calibration (DCal) estimator. By calibrating both the outcome regression
    model and the propensity model, DCal is guaranteed to deliver root-n-consistent
    estimation when either the propensity score model or the outcome regression model
    follows a sparse generalized linear model, and the other nuisance function can
    be arbitrarily complex. In other words, DCal is agnostic to the identity of the
    sparse nuisance function. We further discuss some extensions to semiparametric
    estimation of a single regression coefficient in high dimensional partially linear
    models. This is based on a joint work with Professor Lin Liu from Shanghai Jiao
    Tong University.
  season: spring-2023
- id: ocis-2023-05-02-m-van-ommen
  url: https://youtu.be/2B_-z9wNfXg
  title: Graphical Representations for Algebraic Constraints of Linear Structural
    Equations Models
  speaker: M. van Ommen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-05-02'
  topic: causal_inference
  language: en
  discussant: Rohit Bhattacharya
  slides: https://drive.google.com/file/d/1t56dfjXzLlLOrFDGOv1NffJ-x5Tn2u6g/view?usp=share_link
  abstract: For any directed acyclic graph, the set of observational distributions
    realizable by that graph can be described in terms of conditional independence
    constraints. When latent confounders are considered, conditional independence
    constraints no longer suffice for this purpose. We study linear structural equation
    models, where the constraints take the form of polynomial (in)equalities on the
    observed covariance matrix. However, these polynomials can be exponentially large,
    making them impractical for many purposes. We present a graphical notation for
    many of these polynomial constraints.
  season: spring-2023
- id: ocis-2023-04-18-philipp-bach-sven-klaassen
  url: https://youtu.be/ErecsyKEq74
  title: ( Tutorial) DoubleML - A state-of-the-art framework for double machine learning
    in Python and R
  speaker: Philipp Bach, Sven Klaassen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-04-18'
  topic: causal_inference
  language: en
  papers:
  - '2103.09603'
  slides: https://drive.google.com/file/d/1MJKgkG_hV5-c41NIZfq5PF7fDW3L5NH5/view?usp=share_link
  abstract: 'The Python and R packages DoubleML implement the double/debiased machine
    learning framework of Chernozhukov et al. (2018) for causal machine learning.
    This talk serves as an introduction to the double machine learning framework and
    as a tutorial for the implementation in Python and R. The double machine learning
    framework consists of three key ingredients: Neyman orthogonality, high-quality
    machine learning estimation and sample splitting. In DoubleML, estimation of nuisance
    components can be performed by various state-of-the-art machine learning methods
    that are available in the mlr3 ecosystem for R and scikit-learn for Python, respectively.
    The package allows users to perform inference in a variety of causal models, including
    partially linear and interactive regression models and their extensions to instrumental
    variable estimation. The object-oriented implementation of DoubleML enables a
    high flexibility for the model specification and makes it easily extendable. We
    demonstrate how users of DoubleML can perform valid inference based on machine
    learning methods in code examples with simulated and real data. Moreover, we offer
    an outlook on current and future extensions of the package, including for example
    quantile treatment effects and conditional average treatment effects.'
  season: spring-2023
- id: ocis-2023-04-11-niels-richard-hansen
  url: https://youtu.be/BgEE1_7Id1U
  title: Cyclic graphical models and causal learning
  speaker: Niels Richard Hansen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-04-11'
  topic: causal_inference
  language: en
  discussant: Patrick Forré
  slides: https://drive.google.com/file/d/13yUdg8Xn8hgqm4mAU3U0cLOst9DpnMCT/view?usp=sharing
  abstract: 'Directed Graphs (DGs) can be used both formally and informally to represent
    and communicate causal relations. The formal mathematical theory is particularly
    well developed for Directed Acyclic Graphs (DAGs) to support structural causal
    models, do-calculus, identification theory and causal learning. It is natural
    to interpret DGs with cycles as allowing for feedback mechanisms, but this can
    be formalized by different incompatible mathematical theories. In the first part
    of the talk I will survey two competing theories: equilibrium models and dynamic
    models. In the second part of the talk I will focus on so-called local independence
    models induced by dynamic models, and their graphical representation via DGs and
    Directed Mixed Graphs (DMGs). I will show how equivalence classes of DMGs can
    be represented in terms of maximal elements, which, in turn, can be learned from
    data via conditional local independence testing. The theory will be illustrated
    by an application to neuron spike data for multiple neurons.'
  season: spring-2023
- id: ocis-2023-04-04-interview-with-philip-dawid
  url: https://youtu.be/0uFmoytcjHU
  title: 'Interviewer: Vanessa Didelez'
  speaker: Interview with Philip Dawid
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-04-04'
  topic: causal_inference
  language: en
  season: spring-2023
- id: ocis-2023-03-28-robin-evans
  url: https://youtu.be/Ez861340pp4
  title: Parameterizing and Simulating from Causal Models
  speaker: Robin Evans
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-03-28'
  topic: causal_inference
  language: en
  discussant: Larry Wasserman
  slides: https://drive.google.com/file/d/1OO197i1_eOE9kxXjn8tJgpS4ngpazDFR/view?usp=share_link
  abstract: 'Many statistical problems in causal inference involve a probability distribution
    other than the one from which data are actually observed; as an additional complication,
    the object of interest is often a marginal quantity of this other probability
    distribution. This creates many practical complications for statistical inference,
    even where the problem is non-parametrically identified. In particular, it is
    difficult to perform likelihood-based inference, or even to simulate from the
    model in a general way. We introduce the frugal parameterization, which places
    the causal effect of interest at its centre, and then builds the rest of the model
    around it. We do this in a way that provides a recipe for constructing a regular,
    non-redundant parameterization using causal quantities of interest. In the case
    of discrete variables we can use odds ratios to complete the parameterization,
    while in the continuous case copulas are the natural choice. Our methods allow
    us to construct and simulate from models with parametrically specified causal
    distributions, and fit them using likelihood-based methods, including fully Bayesian
    approaches. Our proposal includes parameterizations for the average causal effect
    and effect of treatment on the treated, as well as other common quantities of
    interest. I will also discuss some other applications of the frugal parameterization,
    including to survival analysis, parameterizing nested Markov models, and ‘Many
    Data’: combining randomized and observational datasets in a single parametric
    model. This is joint work with Vanessa Didelez .'
  season: winter-2023
- id: ocis-2023-03-21-jessica-young
  url: https://youtu.be/vgNznhe4ofQ
  title: Causal inference with competing events
  speaker: Jessica Young
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-03-21'
  topic: causal_inference
  language: en
  discussant: 'Jacqueline Rudolph , Q&A moderator: Mats Stensrud'
  slides: https://drive.google.com/file/d/1SqwXejTPzlVes5FSa-z9r-4pDb_kL0-N/view?usp=share_link
  abstract: A competing (risk) event is any event that makes it impossible for the
    event of interest in a study to occur. For example, cardiovascular disease death
    is a competing event for prostate cancer death because an individual cannot die
    of prostate cancer once he has died of cardiovascular disease. Various statistical
    estimands have been posed in the classical competing risks literature, most prominently
    the cause-specific cumulative incidence, the marginal cumulative incidence, the
    cause-specific hazard, and the subdistribution hazard. Here we will discuss the
    interpretation of counterfactual contrasts in each of these estimands under different
    treatments and consider possible limitations in their interpretation when a causal
    treatment effect on the event of interest is the goal and treatment may affect
    future event processes. In turn, we argue that choosing a target causal effect
    in this setting fundamentally boils down to whether or not we choose to be satisfied
    estimating total effects, that capture all mechanisms by which treatment affects
    the event of interest, including via effects on competing events. When we deem
    the total effect insufficient to answer our underlying question, we consider alternative
    targets of inference that capture treatment mechanism for competing event settings,
    with emphasis on the recently proposed separable effects.
  season: winter-2023
- id: ocis-2023-03-14-student-talks
  url: https://youtu.be/j_nKU3hU-wc
  title: Variance-based sensitivity analysis for weighting estimators results in more
    informative bounds
  speaker: Student talks
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-03-14'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1dD7DSyRkckUSHRMe0KuSOFXlvyZcPBU3/view?usp=share_link
- id: ocis-2023-02-28-christina-yu
  url: https://youtu.be/pskRH11mADI
  title: Exploiting Neighborhood Interference with Low Order Interactions under Unit
    Randomized Design
  speaker: Christina Yu
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-02-28'
  topic: causal_inference
  language: en
  discussant: 'Chencheng Cai - Q&A moderator: Mayleen Cortez and Matt Eichhorn'
  slides: https://drive.google.com/file/d/1gtePOA1lwd2xbm1o0gElbWWSA3TYvew5/view?usp=share_link
  abstract: Network interference, where the outcome of an individual is affected by
    the treatment assignment of those in their social network, is pervasive in many
    real-world settings. However, it poses a challenge to estimating causal effects.
    We consider the task of estimating the total treatment effect (TTE), or the difference
    between the average outcomes of the population when everyone is treated versus
    when no one is, under network interference. Under a Bernoulli randomized design,
    we utilize knowledge of the network structure to provide an unbiased estimator
    for the TTE when network interference effects are constrained to low order interactions
    among neighbors of an individual. We make no assumptions on the graph other than
    bounded degree, allowing for well-connected networks that may not be easily clustered.
    We derive a bound on the variance of our estimator and show in simulated experiments
    that it performs well compared with standard estimators for the TTE. We also derive
    a minimax lower bound on the mean squared error of our estimator which suggests
    that the difficulty of estimation can be characterized by the degree of interactions
    in the potential outcomes model. We also prove that our estimator is asymptotically
    normal under boundedness conditions on the network degree and potential outcomes
    model. Central to our contribution is a new framework for balancing between model
    flexibility and statistical complexity as captured by this low order interactions
    structure.
  season: winter-2023
- id: ocis-2023-02-21-ingeborg-waernbaum
  url: https://youtu.be/u_TmBqJjEiA
  title: Selection bias and multiple inclusion criteria in observational studies
  speaker: Ingeborg Waernbaum
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-02-21'
  topic: causal_inference
  language: en
  discussant: 'Maya Mathur , Q&A moderator: Stina Zetterström'
  slides: https://drive.google.com/file/d/1bzK4X5GOsZpFmDHSw6F1NvQQxjud6FUi/view?usp=share_link
  abstract: Selection bias can be a result of applying inclusion/exclusion criteria
    when selecting the study population in an observational study. The bias can threaten
    the validity of the study and sensitivity analysis for assessing the effect of
    the selection is desired. Bounds for selection bias based on values of sensitivity
    parameters were previously proposed by Smith and VanderWeele (SV). The sensitivity
    parameters describe aspects of the joint distribution of the outcome, selection
    and a vector of unmeasured variables, for each treatment group respectively. In
    this work we extend the sensitivity analysis and give additional guidance for
    practitioners to construct i) the sensitivity parameters for multiple selection
    variables, and ii) an alternative assumption free bound, producing only feasible
    values. In addition to a tutorial for the bounds and an R package, we derive additional
    properties for the SV bound. We show that the sensitivity parameters are variation
    independent and derive feasible regions for them. Furthermore, a sharp bound is
    defined as a bound where it is a priori known that the bias can be equal to the
    value of the bound, given the values of the selected sensitivity parameters. Conditions
    for the SV bound to be sharp are provided that can be check with the observed
    data. We illustrate both the R package and the properties of the bound with a
    simulated dataset that emulates a study where the effect of zika virus on microcephaly
    in Brazil is investigated. These are joint work with Stina Zetterström, Department
    of Statistics, Uppsala University.
  season: winter-2023
- id: ocis-2023-02-14-stijn-vansteelandt
  url: https://youtu.be/DkyNCJLWqUg
  title: Assumption-lean Causal Modeling
  speaker: Stijn Vansteelandt
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-02-14'
  topic: causal_inference
  language: en
  discussant: Elizabeth Ogburn
  slides: https://drive.google.com/file/d/1ZUmcWx0dNDGtNsEA7bvEuxjZLHKzYz9e/view?usp=share_link
  abstract: Causal inference research has shifted from being primarily descriptive
    (describing the data-generating mechanism using statistical models) to being primarily
    prescriptive (evaluating the effects of specific interventions). The focus has
    thereby moved from being centered on statistical models to being centered on causal
    estimands. This evolution has been driven by the increasing need for practical
    solutions to real-world problems, such as designing effective interventions, making
    policy decisions, and identifying effective treatment strategies. It has brought
    enormous progress, not solely in terms of delivering more useful answers to the
    scientific questions at stake, but also in providing a more hygienic inference
    that targets a well-understood causal estimand. However, many causal questions
    are not readily translated into the effects of specific interventions, and even
    if they can, scientists may be reliant on help from an expert statistician to
    make that translation, may not find the considered interventions feasible or of
    immediate interest, or may find too little information in the data about the considered
    estimand. In this talk, I will reflect on this and argue that hygienic causal
    inference thinking therefore comes with a price. I will next propose a compromise
    solution at the intersection of descriptive and prescriptive causal inference.
    It borrows the flexibility of statistical modeling, while tying model parameters
    to causal estimands in order to ensure that we understand what is being estimated
    and obtain valid (data-adaptive) inference for it, even when the model is wrong.
    Examples on structural (nested) mean models, instrumental variables estimation,
    target trials, … will be used to provide insight.
  season: winter-2023
- id: ocis-2023-02-07-lauren-dang
  url: https://youtu.be/KilwkNczs0U
  title: 'Integration of Observational and Randomized Controlled Trial Data: Approaches,
    Challenges, A Novel Estimator, and Application to the LEADER Cardiovascular Outcomes
    Trial'
  speaker: Lauren Dang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-02-07'
  topic: causal_inference
  language: en
  papers:
  - '2210.05802'
  slides: https://docs.google.com/presentation/d/1cNp6fIUhK0-JjMvDU4iKI0lshc14qkBTE48Bu47Yefo/edit?usp=sharing
  discussant: Robin Evans
  abstract: Although the randomized controlled trial (RCT) is the gold standard for
    evidence generation, conducting an adequately powered RCT is not always feasible
    or desirable. A traditional RCT may be impracticable for very rare diseases, and
    excessive randomization to control may be considered unethical for severe diseases
    without effective treatments or for certain pediatric drug approvals. In such
    cases, we may wish to integrate data from a small RCT with real-world data (RWD)
    to increase power but at the risk of introducing bias. A growing number of “data
    fusion” methods seek to estimate the bias from incorporating RWD to determine
    whether to include RWD or how to weight the RWD in a combined analysis. This talk
    will use a roadmap for causal inference to explore the challenges of integrating
    observational and RCT data, including considerations for designing such a hybrid
    trial. We will discuss different approaches to data fusion, including a novel
    estimator that uses cross-validated targeted maximum likelihood estimation (CV-TMLE)
    to data-adaptively select and analyze the optimal experiment - RCT only (if no
    unbiased external data exists) or RCT with external data. Finally, we will discuss
    an example of distinguishing biased versus unbiased extra controls by region in
    an analysis of the effect of liraglutide on change in hemoglobin A1c from the
    LEADER trial.
  season: winter-2023
- id: ocis-2023-01-17-moritz-hardt-max-planck-institute-for-in
  url: https://youtu.be/dShLLhc48yw
  title: From prediction to power
  speaker: Moritz Hardt, Max Planck Institute for Intelligent Systems)
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-01-17'
  topic: causal_inference
  language: en
  discussant: Michael P. Kim
  slides: https://docs.google.com/presentation/d/1478yiG_0OWEa_9HxWpvJlhy1gvd7wCvm5UI3AMorVkM/edit?usp=sharing
  abstract: A recent formal framework, called performative prediction, draws attention
    to the fundamental difference between learning from a population and steering
    a population through predictions. Against this backdrop, we'll examine the role
    of prediction in questions of power in digital markets. Building on performative
    prediction, I'll introduce the notion of performative power that measures the
    ability of a firm operating an algorithmic system to benefit from steering. Traditional
    economic tools struggle with identifying anti-competitive patterns in digital
    markets not least due to the complexity of market definition. In contrast, performative
    power is a causal notion identifiable with little knowledge of the market, its
    internals, participants, products, or prices. Low performative power implies that
    a firm can do no better than to optimize their objective on current data. In contrast,
    firms of high performative power stand to benefit from steering the population
    towards more profitable behavior. In a simple theoretical model, we can see that
    monopolies maximize performative power, a firm's ability to personalize increases
    performative power, while competition and outside options decrease performative
    power. On the empirical side, I'll discuss observational causal designs to identify
    performative power from discontinuities in how digital platforms display content.
    This allows to repurpose causal effects from various studies about digital platforms
    as lower bounds on performative power. Finally, I'll situate performative power
    in the context of European competition policy and antitrust enforcement in digital
    marketplaces. Based on a joint work with Meena Jagadeesan and Celestine Mendler-Dünner,
    as well as ongoing work with Gabriele Carovano and Celestine Mendler-Dünner.
  season: winter-2023
- id: ocis-2023-01-10-ilya-shpitser
  url: https://youtu.be/6Yn4efwBIGQ
  title: 'Fairness By Causal Mediation Analysis: Criteria, Algorithms, and Open Problems'
  speaker: Ilya Shpitser
  venue: OCIS (Online Causal Inference Seminar)
  date: '2023-01-10'
  topic: causal_inference
  language: en
  discussant: Ricardo Silva
  slides: https://drive.google.com/file/d/1mE7W-NWtIQH-HfpkvSFMdWn4LeZnVb4R/view?usp=share_link
  abstract: Systematic discriminatory biases present in our society influence the
    way data is collected and stored, the way variables are defined, and the way scientific
    findings are put into practice as policy. Automated decision procedures and learning
    algorithms applied to such data may serve to perpetuate existing injustice or
    unfairness in our society. We consider how to solve prediction and policy learning
    problems in a way which ``breaks the cycle of injustice'' by correcting for the
    unfair dependence of outcomes, decisions, or both, on sensitive features (e.g.,
    variables that correspond to gender, race, disability, or other protected attributes).
    We use methods from causal inference and constrained optimization to learn outcome
    predictors and optimal policies in a way that addresses multiple potential biases
    which afflict data analysis in sensitive contexts. Our proposal comes equipped
    with the guarantee that solving prediction or decision problems on new instances
    will result in a joint distribution where the given fairness constraint is satisfied.
    We illustrate our approach with both synthetic data and real criminal justice
    data.
  season: winter-2023
- id: ocis-2022-12-06-jose-zubizarreta
  url: https://youtu.be/sPQsdggRtKs
  title: Bridging Matching, Regression, and Weighting as Mathematical Programs for
    Causal Inference
  speaker: Jose Zubizarreta
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-12-06'
  topic: causal_inference
  language: en
  discussant: Mike Baiocchi
  abstract: A fundamental principle in the design of observational studies is to approximate
    the randomized experiment that would have been conducted under controlled circumstances.
    Across the health and social sciences, statistical methods for covariate adjustment
    are used in pursuit of this principle. Basic methods are matching, regression,
    and weighting. In this talk, we will examine the connections between these methods
    through their underlying mathematical programs. We will study their strengths
    and weaknesses in terms of study design, computational tractability, and statistical
    efficiency. Overall, we will discuss the role of mathematical optimization for
    the design and analysis of studies of causal effects.
  season: fall-2022
- id: ocis-2022-11-29-wayne-lam
  url: https://youtu.be/odV0jgcApi0
  title: Greedy Relaxations of the Sparsest Permutation Algorithm
  speaker: Wayne Lam
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-11-29'
  topic: causal_inference
  language: en
  discussant: Alex Markham
  slides: https://drive.google.com/file/d/178rC7RUeYTxOcy4lb_KxQNn7krq3whpI/view?usp=share_link
  abstract: There has been an increasing interest in methods that exploit permutation
    reasoning to search for directed acyclic causal models, including the "Ordering
    Search" of Teyssier and Kohler (2005), and GSP of Solus, Wang and Uhler (2021).
    We extend the methods of the latter by a permutation-based operation, tuck, and
    develop a class of algorithms, namely GRaSP, that are efficient and pointwise
    consistent under increasingly weaker assumptions than faithfulness. The most relaxed
    form of GRaSP outperforms many state-of-the-art causal search algorithms in simulation,
    allowing efficient and accurate search even for dense graphs and graphs with more
    than 100 variables.
  season: fall-2022
- id: ocis-2022-11-22-julie-josse
  url: https://youtu.be/UV2UTX21UyU
  title: 'Causal inference for brain trauma: leveraging incomplete observational data
    and RCT'
  speaker: Julie Josse
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-11-22'
  topic: causal_inference
  language: en
  papers:
  - '2208.07614'
  discussant: Elizabeth Stuart
  slides: https://drive.google.com/file/d/1iEGoUqOOwIWPZG66wglXHkyh8JGFxpwI/view?usp=share_link
  abstract: The simultaneous availability of observational and experimental data for
    the same medical question about the effect of a treatment is an opportunity to
    combine their strengths and address their weaknesses. In this presentation, I
    will illustrate the methodological challenges we faced in answering a medical
    question about the effect of tranexamic acid administration on mortality in patients
    with traumatic brain injury in the context of critical care management. First,
    we had access to a large French observational registry on severely traumatized
    patients, but almost all variables were incomplete. We considered different sets
    of hypotheses under which causal inference is possible despite the missing attributes
    and discussed corresponding approaches to estimating the average treatment effect,
    including generalized propensity score methods and multiple imputation. Second,
    results from an international RCT were published that did not necessarily agree
    with those obtained from the observational study. This led us to investigate generalization
    problems where the trial data are considered a biased sample of a target population
    and we want to predict the treatment effect on the target population represented
    by the observational data. We focus on the Inverse Propensity of Sampling Weighting
    (IPSW) estimator and establish finite-sample and asymptotic results on different
    versions of this estimator. In addition, we have studied how including covariates
    that are unnecessary for identifiability can have an impact on the asymptotic
    variance. Finally, I will quickly mention solutions for dealing with sporadic
    missing values in both data sources in this generalization framework and systematic
    missing values when a variable is not available in one or both data sources.
  season: fall-2022
- id: ocis-2022-11-15-karthik-rajkumar
  url: https://youtu.be/yuYMHlAbkIY
  title: A causal test of the strength of weak ties
  speaker: Karthik Rajkumar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-11-15'
  topic: causal_inference
  language: en
  discussant: Dean Eckles
  slides: https://ide.mit.edu/wp-content/uploads/2022/09/abl4476.pdf
  abstract: We analyzed data from multiple large-scale randomized experiments on LinkedIn’s
    People You May Know algorithm, which recommends new connections to LinkedIn members,
    to test the extent to which weak ties increased job mobility in the world’s largest
    professional social network. The experiments randomly varied the prevalence of
    weak ties in the networks of over 20 million people over a 5-year period, during
    which 2 billion new ties and 600,000 new jobs were created. The results provided
    experimental causal evidence supporting the strength of weak ties and suggested
    three revisions to the theory. First, the strength of weak ties was nonlinear.
    Statistical analysis found an inverted U-shaped relationship between tie strength
    and job transmission such that weaker ties increased job transmission but only
    to a point, after which there were diminishing marginal returns to tie weakness.
    Second, weak ties measured by interaction intensity and the number of mutual connections
    displayed varying effects. Moderately weak ties (measured by mutual connections)
    and the weakest ties (measured by interaction intensity) created the most job
    mobility. Third, the strength of weak ties varied by industry. Whereas weak ties
    increased job mobility in more digital industries, strong ties increased job mobility
    in less digital industries.
  season: fall-2022
- id: ocis-2022-11-08-luke-miratrix
  url: https://youtu.be/tKoxMovw9uY
  title: A devil’s bargain? Repairing a Difference in Differences parallel trends
    assumption with an initial matching step
  speaker: Luke Miratrix
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-11-08'
  topic: causal_inference
  language: en
  discussant: Laura Hatfield
  slides: https://www.dropbox.com/s/df3ulovd1l3n713/DiD%20and%20matching%20OCIS.pdf?dl=0
  abstract: The Difference in Difference (DiD) estimator is a popular estimator built
    on the "parallel trends" assumption that the treatment group, absent treatment,
    would change "similarly" to the control group over time. To increase the plausibility
    of this assumption, a natural idea is to match treated and control units prior
    to a DiD analysis. In this paper, we characterize the bias of matching under a
    class of linear structural models with both observed and unobserved confounders
    that have time varying effects. Given this framework, we find that matching on
    baseline covariates generally reduces the bias associated with these covariates,
    when compared to the original DiD estimator. We further find that additionally
    matching on pre-treatment outcomes has both cost and benefit. First, matching
    on pre-treatment outcomes will partially balance unobserved confounders, which
    mitigates some bias. This reduction is proportional to the outcome's reliability,
    a measure of how coupled the outcomes are with the latent covariates. On the other
    hand, we find that matching on pre-treatment outcomes also undermines the second
    "difference" in a DiD estimate by forcing the treated and control group's pre-treatment
    outcomes to be equal. This injects bias into the final estimate, creating a bias-bias
    tradeoff. We extend our bias results to multivariate confounders with multiple
    pre-treatment periods and find similar results. We summarize our findings with
    heuristic guidelines on whether to match prior to a DiD analysis, along with a
    method for roughly estimating the reduction in bias. We illustrate our guidelines
    by reanalyzing a recent empirical study that used matching prior to a DiD analysis
    to explore the impact of principal turnover on student achievement.
  season: fall-2022
- id: ocis-2022-11-01-kun-zhang
  url: https://youtu.be/oBiGEfEPMH0
  title: Methodological advances in causal representation learning
  speaker: Kun Zhang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-11-01'
  topic: causal_inference
  language: en
  discussant: Victor Veitch
  slides: https://drive.google.com/file/d/1GvKZNasGozJdTNUcGwPRv9EYVUSwx0KX/view?usp=share_link
  abstract: 'Causal representation learning aims to reveal the underlying high-level
    hidden causal variables and their relations. It can be seen as a special case
    of causal discovery, whose goal is to recover the underlying causal structure
    or causal model from observational data. The modularity property of a causal system
    implies properties of minimal changes and independent changes of causal representations,
    and how such properties make it possible to recover the underlying causal representations
    from observational data with identifiability guarantees: under appropriate assumptions,
    the learned representations are consistent with the underlying causal process.
    The talk will consider various problem settings involving independent and identically
    distributed (i.i.d.) data, temporal data, or data with distribution shift as input,
    and demonstrate when identifiable causal representation learning can benefit from
    the flexibility of deep learning and when it has to impose suitable parametric
    assumptions on the causal process.'
  season: fall-2022
