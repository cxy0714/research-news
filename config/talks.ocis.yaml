- id: ocis-2020-09-29-emilija-perkovic
  url: https://www.youtube.com/watch?v=jY0nH3oVu4w
  title: 'Causal effects in maximally oriented partially directed acyclic graphs (MPDAGs):
    Identification and efficient estimation'
  speaker: Emilija Perkovic
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-09-29'
  topic: causal_inference
  language: en
  papers:
  - '2008.03481'
  discussant: Thomas Richardson
  slides: https://drive.google.com/file/d/14H0o9Dy5BwvorxPuYI_TH6bYDXmvdvgQ/view?usp=sharing
  season: fall-2020
- id: ocis-2020-09-23-falco-bargagli-stoffi-eli-ben-michael
  url: https://www.youtube.com/watch?v=njXNWjXKuTY
  title: 'Causal Rule Ensemble: Interpretable Inference of Heterogeneous Treatment
    Effects'
  speaker: Falco Bargagli Stoffi ; Eli Ben-Michael
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-09-23'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1jexQ2rIzPo62P8wDKxe60IagQKEGhHD4/view?usp=sharing
  abstract: 'In environmental epidemiology, it is critically important to identify
    subpopulations that are most vulnerable to the adverse effects of air pollution
    so we can develop targeted interventions. In recent years, there have been many
    methodological developments for addressing heterogeneity of treatment effects
    in causal inference. A common approach is to estimate the conditional average
    treatment effect (CATE) for a pre-specified covariate set. However, this approach
    does not provide an easy-to-interpret tool for identifying susceptible subpopulations
    or discover new subpopulations that are not defined a priori by the researchers.
    In this paper, we propose a new causal rule ensemble (CRE) method with two features
    simultaneously: 1) ensuring interpretability by revealing heterogeneous treatment
    effect structures in terms of decision rules, and 2) providing CATE estimates
    with high statistical precision. We provide theoretical results that guarantee
    consistency of the estimated causal effects for the newly discovered causal rules.
    Furthermore, via simulations, we show that the CRE method has competitive performance
    on its ability to discover subpopulations and then accurately estimate the causal
    effects. We also develop a new sensitivity analysis method to examine robustness
    to unmeasured confounding bias. Lastly, we apply the CRE method to the study of
    the effects of long-term exposure to air pollution on the 5-year mortality rate
    of the New England Medicare-enrolled population in United States. J oint work
    with Kwonsang Lee (Sungkyunkwan University) and Francesca Dominici (Harvard University)
    Talk 2: " Synthetic Controls with Staggered Adoption" (Eli Ben-Michael) Staggered
    adoption of policies by different units at different times creates promising opportunities
    for observational causal inference. The synthetic control method (SCM) is a recent
    addition to the evaluation toolkit but is designed to study a single treated unit
    and does not easily accommodate staggered adoption. In this paper, we generalize
    SCM to the staggered adoption setting. Current practice involves fitting SCM separately
    for each treated unit and then averaging. We show that the average of separate
    SCM fits does not necessarily achieve good balance for the average of the treated
    units, leading to possible bias in the estimated effect. We propose "partially
    pooled" SCM weights that instead minimize both average and state-specific imbalance,
    and show that the resulting estimator controls bias under a linear factor model.
    We also extend our proposal to balance auxiliary covariates and to include separate
    intercepts for each SCM problem. We assess the performance of the proposed method
    via extensive simulations and apply our results to the question of whether teacher
    collective bargaining leads to higher school spending, finding minimal impacts.
    We implement the proposed method in the augsynth R package. Joint work with Avi
    Feller and Jesse Rothstein.'
  season: fall-2020
- id: ocis-2020-09-15-nathan-kallus-and-xiaojie-mao
  url: https://www.youtube.com/watch?v=ZhKfclG-eSQ
  title: 'Localized Debiased Machine Learning: Efficient Inference on Quantile Treatment
    Effects and Beyond'
  speaker: Nathan Kallus and Xiaojie Mao
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-09-15'
  topic: causal_inference
  language: en
  papers:
  - '1912.12945'
  discussant: Alex andre Belloni
  slides: https://drive.google.com/file/d/1gR68Msb5ApyEtOfdFXYo2nxhdUuqnl_p/view?usp=sharing
  abstract: We consider the efficient estimation of a low-dimensional parameter in
    an estimating equation involving high-dimensional nuisances that depend on the
    parameter of interest. An important example is the (local) quantile treatment
    effect ((L)QTE) in causal inference, where the efficient estimating equation involves
    as a nuisance the covariate-conditional cumulative distribution function evaluated
    at the quantile to be estimated. Debiased machine learning (DML) is a data-splitting
    approach to address the need to estimate nuisances using flexible machine learning
    methods that may not satisfy strong metric entropy conditions, but applying it
    to problems with parameter-dependent nuisances is impractical. For (L)QTE estimation,
    DML requires we learn the whole conditional cumulative distribution function,
    conditioned on potentially high-dimensional covariates, which is far more challenging
    than the standard supervised regression task in machine learning. We instead propose
    localized debiased machine learning (LDML), a new data-splitting approach that
    avoids this burdensome step and needs only estimate the nuisances at a single
    initial rough guess for the parameter. For (L)QTE estimation, this involves just
    learning two binary regression (i.e., classification) models, for which many standard,
    time-tested machine learning methods exist, and the initial rough guess may be
    given by inverse propensity weighting. We prove that under lax rate conditions
    on nuisances, our estimator has the same favorable asymptotic behavior as the
    infeasible oracle estimator that solves the estimating equation with the unknown
    true nuisance functions. Thus, our proposed approach uniquely enables practically-feasible
    and theoretically-grounded efficient estimation of important quantities in causal
    inference such as (L)QTEs and in other coarsened data settings.
  season: fall-2020
- id: ocis-2020-09-08-joris-mooij
  url: https://www.youtube.com/watch?v=NgxQkFwve70
  title: 'Joint Causal Inference: A Unifying Perspective on Causal Discovery'
  speaker: Joris Mooij
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-09-08'
  topic: causal_inference
  language: en
  discussant: Philip Dawid
  slides: https://drive.google.com/file/d/1elhonytp31cpDnIEhd6BePCVTjnEGLZq/view?usp=sharing
  abstract: 'Many questions in science, policy making and everyday life are of a causal
    nature: how would a change of A affect B? An important research topic is therefore
    how cause-effect relationships can be discovered from data and how these can be
    used for making predictions in situations where a system has been perturbed by
    an external intervention. In this talk, I will introduce the basics of two, apparently
    quite different, approaches to causal discovery. I will discuss how both approaches
    can be elegantly combined in Joint Causal Inference (JCI), a novel constraint-based
    framework for causal discovery from multiple data sets. This perspective has inspired
    novel causal discovery algorithms that lead to a significant increase in the accuracy
    and identifiability of the predicted causal relations.'
  season: fall-2020
- id: ocis-2020-09-02-karthika-mohan-david-hirshberg
  url: https://www.youtube.com/watch?v=A_1lknAaXhY
  title: Causal Graphical Models for Handling Missing Data
  speaker: Karthika Mohan ; David Hirshberg
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-09-02'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1bUfLm3vjyfN7EHKsYv4GW1ESApPD7ocN/view?usp=sharing
  abstract: In causal inference, various notions of comparability between samples
    are used to justify the interpretation of observed differences as causal. Collectively,
    these are called balance . By reweighting units, we can establish balance between
    otherwise incomparable samples. We will discuss this tradition, and recent generalizations
    that allow the estimation of a variety of causal summaries.
  season: fall-2020
- id: ocis-2020-08-25-cynthia-rudin-alexander-volfovsky-sudeep
  url: https://www.youtube.com/watch?v=-So_cL-eMFQ
  title: Almost Matching Exactly
  speaker: Cynthia Rudin, Alexander Volfovsky, Sudeepa Roy
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-08-25'
  topic: causal_inference
  language: en
  discussant: Guillaume Basse
  slides: https://drive.google.com/file/d/1gdVhaltmZWJ5QvoQU1S2cJod0xYOkbNe/view?usp=sharing
  season: summer-2020
- id: ocis-2020-08-18-judith-lok
  url: https://www.youtube.com/watch?v=AB_DR0JhflU
  title: 'Causal organic indirect and direct effects: closer to Baron and Kenny, with
    a product method for binary mediators'
  speaker: Judith Lok
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-08-18'
  topic: causal_inference
  language: en
  papers:
  - '1903.04697'
  slides: https://drive.google.com/file/d/1lZWnpLU3bQttTb6IIljm2jDoionxS0Lb/view?usp=sharing
  season: summer-2020
- id: ocis-2020-08-11-panos-toulis
  url: https://www.youtube.com/watch?v=75G5NUekSj0
  title: 'Randomization tests for spillovers under general interference: A graph-theoretic
    approach'
  speaker: Panos Toulis
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-08-11'
  topic: causal_inference
  language: en
  papers:
  - '1910.10862'
  discussant: Peng Ding
  slides: https://drive.google.com/file/d/1LcZgOYYyYnf8By5ckALswYh7bESLUcBv/view?usp=sharing
  abstract: Interference exists when a unit’s outcome depends on another unit’s treatment
    assignment. For example, intensive policing on one street could have a spillover
    effect on neighboring streets. Classical randomization tests typically break down
    in this setting because many null hypotheses of interest are no longer sharp under
    interference. A promising alternative is to instead construct a conditional randomization
    test on a subset of units and assignments for which a given null hypothesis is
    sharp. Finding these subsets is challenging, however, and existing methods either
    have low power or are limited to special cases. In this paper, we propose valid,
    powerful, and easy to-implement randomization tests for a general class of null
    hypotheses under arbitrary interference between units. Our key idea is to represent
    the hypothesis of interest as a bipartite graph between units and assignments,
    and to find a biclique of this graph. Importantly, the null hypothesis is sharp
    for the units and assignments in this biclique, enabling randomization-based tests
    conditional on the biclique. We can apply off-the-shelf graph clustering methods
    to find such bicliques efficiently and at scale. We illustrate this approach in
    settings with clustered interference and show advantages over methods designed
    specifically for that setting. We then apply our method to a large-scale policing
    experiment in Medellín, Colombia, where interference has a spatial structure.
    Joint work with David Puelz (U Chicago, Booth), Guillaume Basse (Stanford) and
    Avi Feller (UC Berkeley)
  season: summer-2020
- id: ocis-2020-08-04-andrew-gelman
  url: https://www.youtube.com/watch?v=jnI5KI843Lk
  title: 100 Stories of Causal Inference
  speaker: Andrew Gelman
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-08-04'
  topic: causal_inference
  language: en
  slides: http://www.stat.columbia.edu/~gelman/research/published/storytelling.pdf
  abstract: In social science we learn from stories. The best stories are anomalous
    and immutable (see http://www.stat.columbia.edu/~gelman/research/published/storytelling.pdf
    ). We shall briefly discuss the theory of stories, the paradoxical nature of how
    we learn from them, and how this relates to forward and reverse causal inference.
    Then we will go through some stories of applied causal inference and see what
    lessons we can draw from them. We hope this talk will be useful as a model for
    how you can better learn from own experiences as participants and consumers of
    causal inference.
  season: summer-2020
- id: ocis-2020-07-28-georgia-papadogeorgou-and-lihua-lei
  url: https://www.youtube.com/watch?v=Tvm3fFYVroo
  title: 'Causal inference with spatio-temporal data: estimating the effects of airstrikes
    on insurgent violence in Iraq'
  speaker: Georgia Papadogeorgou and Lihua Lei
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-07-28'
  topic: causal_inference
  language: en
  papers:
  - '2006.06138'
  slides: https://drive.google.com/file/d/1qa_SWRshbEFLZQ7msGiC2gc5MxaTBlkI/view?usp=sharing
  abstract: 'Evaluating treatment effect heterogeneity widely informs treatment decision
    making. At the moment, much emphasis is placed on the estimation of the conditional
    average treatment effect via flexible machine learning algorithms. While these
    methods enjoy some theoretical appeal in terms of consistency and convergence
    rates, they generally perform poorly in terms of uncertainty quantification. This
    is troubling since assessing risk is crucial for reliable decision-making in sensitive
    and uncertain environments. In this work, we propose a conformal inference-based
    approach that can produce reliable interval estimates for counterfactuals and
    individual treatment effects under the potential outcome framework. For completely
    randomized or stratified randomized experiments with perfect compliance, the intervals
    have guaranteed average coverage in finite samples regardless of the unknown data
    generating mechanism. For randomized experiments with ignorable compliance and
    general observational studies obeying the strong ignorability assumption, the
    intervals satisfy a doubly robust property which states the following: the average
    coverage is approximately controlled if either the propensity score or the conditional
    quantiles of potential outcomes can be estimated accurately. Numerical studies
    on both synthetic and real datasets empirically demonstrate that existing methods
    suffer from a significant coverage deficit even in simple models. In contrast,
    our methods achieve the desired coverage with reasonably short intervals.'
  season: summer-2020
- id: ocis-2020-07-21-yiqing-xu-and-xun-pang
  url: https://www.youtube.com/watch?v=BAX_VuIPMf0
  title: 'A Bayesian Alternative to Synthetic Control for Comparative Case Studies:
    A Dynamic Multilevel Latent Factor Model with Hierarchical Shrinkage'
  speaker: Yiqing Xu and Xun Pang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-07-21'
  topic: causal_inference
  language: en
  discussant: Dmitry Arkhangelsky
  slides: https://drive.google.com/file/d/1oyygJDn5u_HXMAKtGyFhXdiwvweSJQey/view?usp=sharing
  abstract: This paper proposes a Bayesian alternative to the synthetic control method
    (SCM) for comparative case studies based on a posterior predictive approach to
    Rubin's causal model. Our counterfactual imputation method generalizes the SCM
    by assigning observation-specific parameters to covariates of treated units and
    exploiting high-order relationships between treated and control time series. The
    model includes a dynamic latent factor term to correct biases induced by unit-specific
    time trends and other unobserved time-varying confounders. To reduce model dependence,
    we develop a Bayesian hierarchical shrinkage strategy for factor selection and
    model specification search. It allows researchers to make causal inferences about
    both individual and average treatment effects based on empirical posterior distributions
    of treated counterfactuals. We apply this method to simulated data and two empirical
    examples and show that, compared to existing approaches, our method has smaller
    biases, higher efficiency, and more flexibility.
  season: summer-2020
- id: ocis-2020-07-14-michal-koles-r
  url: https://www.youtube.com/watch?v=KhEWdQ8Mtmo
  title: Finite-Sample Optimal Estimation and Inference on Average Treatment Effects
    Under Unconfoundedness
  speaker: Michal Kolesár
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-07-14'
  topic: causal_inference
  language: en
  discussant: Luke Miratrix
  slides: https://drive.google.com/file/d/1mU1mKUwtrtliH5jfakZwX8MtBqBxUI1V/view?usp=sharing
  abstract: We consider estimation and inference on average treatment effects under
    unconfoundedness conditional on the realizations of the treatment variable and
    covariates. Given nonparametric smoothness and/or shape restrictions on the conditional
    mean of the outcome variable, we derive estimators and confidence intervals (CIs)
    that are optimal in finite samples when the regression errors are normal with
    known variance. In contrast to conventional CIs, our CIs use a larger critical
    value that explicitly takes into account the potential bias of the estimator.
    When the error distribution is unknown, feasible versions of our CIs are valid
    asymptotically, even when √n-inference is not possible due to lack of overlap,
    or low smoothness of the conditional mean. We also derive the minimum smoothness
    conditions on the conditional mean that are necessary for √n-inference. When the
    conditional mean is restricted to be Lipschitz with a large enough bound on the
    Lipschitz constant, the optimal estimator reduces to a matching estimator with
    the number of matches set to one. We illustrate our methods in an application
    to the National Supported Work Demonstration.
  season: summer-2020
- id: ocis-2020-07-07-caroline-uhler
  url: https://www.youtube.com/watch?v=e-xUUdTIFeU
  title: Causal Inference in the Light of Drug Repurposing for SARS-CoV-2
  speaker: Caroline Uhler
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-07-07'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1yTmliTXycGhEJ-yTJZK-S-ibfJYQWe0W/view?usp=sharing
  abstract: Massive data collection holds the promise of a better understanding of
    complex phenomena and ultimately, of better decisions. An exciting opportunity
    in this regard stems from the growing availability of perturbation / intervention
    data (drugs, knockouts, overexpression, etc.) in biology. In order to obtain mechanistic
    insights from such data, a major challenge is the development of a framework that
    integrates observational and interventional data and allows predicting the effect
    of yet unseen interventions or transporting the effect of interventions observed
    in one context to another. I will present a framework for causal structure discovery
    based on such data and characterize the causal relationships that are identifiable
    in this setting. We end by demonstrating how these ideas can be applied for drug
    repurposing in the current SARS-CoV-2 crisis.
  season: summer-2020
- id: ocis-2020-06-30-marloes-maathuis
  url: https://www.youtube.com/watch?v=fpildpVeRTk
  title: Total causal effect estimation by combining causal structure learning and
    covariate adjustment
  speaker: Marloes Maathuis
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-06-30'
  topic: causal_inference
  language: en
  papers:
  - '2002.06825'
  discussant: Daniel Malinsky
  slides: https://drive.google.com/file/d/1IQBi6bZFpVc5jKFIoqneCzQcYFZmbJfD/view?usp=sharing
  abstract: I will discuss a line of work that combines causal structure learning
    and covariate adjustment to estimate causal effects from observational data. In
    particular, I will discuss the IDA algorithm and some of its variations, the generalized
    backdoor criterion, the generalized adjustment criterion, and a graphical characterization
    of efficient adjustment sets. Throughout, examples will be used to illustrate
    the concepts.
  season: summer-2020
- id: ocis-2020-06-23-eytan-bakshy
  url: https://www.youtube.com/watch?v=z0cHeMEYpNU
  title: Efficient Experimentation and Inference for Large Decision Spaces
  speaker: Eytan Bakshy
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-06-23'
  topic: causal_inference
  language: en
  discussant: Dean Eckles
  slides: https://drive.google.com/file/d/1OLJTSuGKzL3hgKYdd3hu-innCoHbEPjX/view?usp=sharing
  abstract: 'Internet service providers routinely leverage randomized experiments
    to optimize products and improve decision making. I will describe recent directions
    in adaptive experimentation, meta-analysis, and causal inference that draw on
    large-scale experiments at Facebook. I will first describe the general problem
    of experimenting with large action spaces, and a simple solution to this problem:
    Bayesian optimization. I will then describe how meta-analysis can be used to improve
    decision quality, and may ultimately be used to further accelerate experimentation
    via statistical surrogacy. Finally, I will discuss the increasing role of causal
    inference in practical decision-making problems faced by internal organizations.'
  season: summer-2020
- id: ocis-2020-06-16-jonas-peters
  url: https://www.youtube.com/watch?v=pg51RFCIr48
  title: Causality and distribution generalization
  speaker: Jonas Peters
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-06-16'
  topic: causal_inference
  language: en
  papers:
  - '2006.07433'
  discussant: Yuansi Chen
  slides: https://drive.google.com/file/d/1Ly2CIwP_-WObVOgMTFkYA0O3HOdpYtcF/view?usp=sharing
  abstract: Purely predictive methods do not perform well when the test distribution
    changes too much from the training distribution. Causal models are known to be
    stable with respect to distributional shifts such as arbitrarily strong interventions
    on the covariates, but may not perform well when the test distribution differs
    only mildly from the training distribution. As a result, methods have been proposed
    that provide a trade off between causal and predictive models. We provide conditions
    under which such methods can be proved to generalize well to unseen distributions
    discuss theoretical limitations of this idea and show an example for inferring
    metabolic networks.
  season: summer-2020
- id: ocis-2020-06-09-dean-eckles
  url: https://www.youtube.com/watch?v=pCYINm_YrbI
  title: Noise induced randomization in regression discontinuity designs
  speaker: Dean Eckles
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-06-09'
  topic: causal_inference
  language: en
  discussant: Michal Kolesár
  slides: https://drive.google.com/file/d/1s5AQlHa2zp7pEvgLR4pUxCYP-FC82dSo/view?usp=sharing
  abstract: Joint work with Nikolaos Ignatiadis, Stefan Wager & Han Wu. Regression
    discontinuity designs are used to estimate causal effects in settings where treatment
    is determined by whether an observed running variable crosses a pre-specified
    threshold. While the resulting sampling design is sometimes described as akin
    to a locally randomized experiment in a neighborhood of the threshold, standard
    formal analyses do not make reference to probabilistic treatment assignment and
    instead identify treatment effects via continuity arguments. Here we propose a
    new approach to identification, estimation, and inference in regression discontinuity
    designs that exploits measurement error in the running variable for identification.
    Under an assumption that the measurement error is exogenous, we show how to consistently
    estimate causal effects using a class of linear estimators that weight treated
    and control units so as to balance a latent variable of which the running variable
    is a noisy measure. We find this approach to facilitate identification of both
    familiar estimands from the literature, as well as policy-relevant estimands that
    correspond to the effects of realistic changes to the existing treatment assignment
    rule. Regression discontinuity designs with estimable measurement error arise
    in many settings, including medicine, education, and meta-science. We demonstrate
    the method with a study of retention of HIV patients and evaluate its performance
    using simulated data and a regression discontinuity design artificially constructed
    from tests scores in early childhood.
  season: summer-2020
- id: ocis-2020-06-02-paul-rosenbaum
  url: https://www.youtube.com/watch?v=xQRfPcd3XqA
  title: Replication and Evidence Factors in Observational Studies
  speaker: Paul Rosenbaum
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-06-02'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/12OPu8lgCYoRaV_hghzyz9wnKMt1RQcZt/view?usp=sharing
  abstract: 'Observational studies are often biased by failure to adjust for a covariate
    that was not measured. A series of studies may replicate an association because
    the bias that produced this association has been replicated, not because a treatment
    effect has been demonstrated. To be of value, a replication should remove, or
    reduce, or at least vary a potential source of bias that resulted in uncertainty
    in earlier studies. Having defined the goal of replication in this way, we may
    ask: Can one observational study replicate itself? Can it provide two statistically
    independent tests of one hypothesis about treatment effects such that the two
    tests are susceptible to different unobserved biases? Can the sensitivity analyses
    for these two tests be combined using meta-analytic techniques as if they came
    from unrelated studies, despite using the same data twice? When this is possible,
    the study is said to possess two evidence factors. The talk is divided into two
    parts, a brief, largely conceptual discussion of replication in observational
    studies, followed by a longer, more technical discussion with results about and
    practical examples of evidence factors.'
  season: summer-2020
- id: ocis-2020-05-26-ya-xu
  url: https://www.youtube.com/watch?v=OoKsLAvyIYA
  title: 'Causal Inference Challenges in Industry : A perspective from experiences
    at LinkedIn'
  speaker: Ya Xu
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-05-26'
  topic: causal_inference
  language: en
  discussant: Iavor Bojinov
  abstract: In this talk, we will briefly give some background how online controlled
    experiments are commonly used in industry, and introduce some challenges we face,
    and also some opportunities in novel applications.
  slides: https://drive.google.com/file/d/1rcqZ56lWZB2LW_pO5hJ2qlQXm8TqbC_X/view?usp=sharing
  season: spring-2020
- id: ocis-2020-05-19-susan-murphy
  url: https://www.youtube.com/watch?v=iLJ1hC5k-IQ
  title: Inference for Batched Bandits
  speaker: Susan Murphy
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-05-19'
  topic: causal_inference
  language: en
  papers:
  - '2002.03217'
  discussant: Stefan Wager
  slides: https://drive.google.com/file/d/1u3Pppn9cqmOPVwvM4jd8reR5b1xoz1hv/view?usp=sharing
  abstract: As bandit algorithms are increasingly utilized in scientific studies and
    industrial applications, there is an associated increasing need for reliable inference
    methods based on the resulting adaptively collected data. In this work, we develop
    methods for inference on data collected in batches using a bandit algorithm. When
    there is no unique arm we prove that the ordinary least squares estimator(OLS)
    is not asymptotically normal on data collected using standard bandit algorithms.
    This is the case even when the bandit is constrained to select each arm with probabilities
    bounded away from 0 and 1. We show that this problem can be traced to the fact
    that the arm selection probabilities do not concentrate. We take advantage of
    the batched setting to develop a Batched OLS estimator (BOLS) that we prove is
    (1) asymptotically normal on data collected from both multi-arm and contextual
    bandits and (2) robust to nonstationarity in the baseline reward. This is joint
    work with Kelly Zhang and Lucas Janson.
  season: spring-2020
- id: ocis-2020-05-12-ilya-shpitser
  url: https://www.youtube.com/watch?v=FRYkkQBfrDg
  title: Identification and estimation in graphical models of missing data
  speaker: Ilya Shpitser
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-05-12'
  topic: causal_inference
  language: en
  papers:
  - '1909.01848'
  discussant: Jin Tian
  slides: http://auai.org/uai2019/proceedings/papers/428.pdf
  abstract: Missing data is a pervasive problem in data analyses, resulting in datasets
    that contain censored realizations of a target distribution. Many approaches to
    inference on the target distribution using censored observed data rely on missing
    data models represented as a factorization with respect to a graph. We describe
    a simple characterization of all identified missing data models where the full
    data distribution factorizes with respect to a directed acyclic graph (DAG). We
    show how statistical inference may be performed within maximum likelihood and
    semi-parametric frameworks in this class of models. Finally, we discuss why identification
    of marginal target parameters in missing data is significantly more complicated
    and requires approaches more general than those developed in classical causal
    inference problems. This is joint work with Rohit Bhattacharya, Razieh Nabi, Daniel
    Malinsky, Eric Tchetgen Tchetgen, and James M. Robins.
  season: spring-2020
- id: ocis-2020-05-05-eric-tchetgen-tchetgen
  url: https://www.youtube.com/watch?v=K-Uo5XbIE9I
  title: Selective Machine Learning of Doubly Robust Functionals
  speaker: Eric Tchetgen Tchetgen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-05-05'
  topic: causal_inference
  language: en
  papers:
  - '1911.02029'
  discussant: Stijn Vansteelandt
  slides: https://drive.google.com/file/d/1XqTTTNVfrPbWihhnEwKwQdME7eLW05MK/view?usp=sharing
  abstract: While model selection is a well-studied topic in parametric and nonparametric
    regression or density estimation, model selection of possibly high-dimensional
    nuisance parameters in semiparametric problems is far less developed. In this
    paper, we propose a selective machine learning framework for making inferences
    about a finite-dimensional functional defined on a semiparametric model, when
    the latter admits a doubly robust estimating function. We introduce two model
    selection criteria for bias reduction of functional of interest, each based on
    a novel definition of pseudo-risk for the functional that embodies this double
    robustness property and thus may be used to select the candidate model that is
    nearest to fulfilling this property even when all models are wrong. We establish
    an oracle property for a multi-fold cross-validation version of the new model
    selection criteria which states that our empirical criteria perform nearly as
    well as an oracle with a priori knowledge of the pseudo-risk for each candidate
    model. We also describe a smooth approximation to the selection criteria which
    allows for valid post-selection inference. Finally, we apply the approach to model
    selection of a semiparametric estimator of average treatment effect given an ensemble
    of candidate machine learners to account for confounding in an observational study.
    This is joint work with Yifan Cui.
  season: spring-2020
- id: ocis-2020-04-28-edward-kennedy
  url: https://www.youtube.com/watch?v=AUOnAfUjDVE
  title: Optimal doubly robust estimation of heterogeneous causal effects
  speaker: Edward Kennedy
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-04-28'
  topic: causal_inference
  language: en
  papers:
  - '2004.14497'
  discussant: James Robins
  slides: https://drive.google.com/file/d/1_fzpAsIuDgzVSgab1NlIelSUAuNmn5l8/view?usp=sharing
  abstract: Heterogeneous effect estimation has become a major enterprise in causal
    inference, with ramifications across medicine and social science, e.g., improving
    understanding of variation, as well as informing policy and optimizing treatment
    decisions. Many methods for estimating the conditional average treatment effect
    (CATE) have been proposed in recent years; however, there are important gaps in
    the literature, particularly on the theory side, vis-a-vis understanding if and
    when such methods can be optimal. These gaps are especially pronounced in settings
    where the CATE is more structured and less complex than the rest of the data-generating
    process. We contribute in several main ways. First, we study a two-stage doubly
    robust CATE estimator, similar to that proposed by van der Laan (2013) and used
    by others since. We give a generic model-free error bound, which, despite its
    generality, yields sharper results than those in the current literature. Second,
    we illustrate the results in nonparametric models with smoothness or sparsity,
    and give sufficient conditions for oracle efficiency, depending on nuisance structure.
    Underlying our error bound is a general oracle inequality for regression with
    estimated or imputed outcomes, which is of independent interest; this is the third
    main contribution. The fourth contribution is aimed at understanding the fundamental
    statistical limits of CATE estimation. To that end, we propose and study a local
    polynomial adaptation of the R-Learner and double-residual regression (Nie & Wager
    2017, Robinson 1998). We show that this estimator is oracle efficient under weaker
    conditions than the first estimator, when using a specialized form of sample splitting
    and careful choices of tuning parameters. These conditions are the weakest currently
    found in the literature, and we conjecture that they are minimal in a minimax
    sense. We go on to give error bounds in the challenging regime where oracle rates
    cannot be achieved. We illustrate our results and study finite-sample properties
    with simulations.
  season: spring-2020
- id: ocis-2020-04-21-elizabeth-ogburn
  url: https://www.youtube.com/watch?v=uFSVZTDl0aM
  title: Social network dependence, unmeasured confounding, and the replication crisis
  speaker: Elizabeth Ogburn
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-04-21'
  topic: causal_inference
  language: en
  papers:
  - '1908.00520'
  discussant: Ilya Shpitser
  slides: https://drive.google.com/file/d/1g33lgUXo_q9Etc2puuI__BHGcJq22LUc/view?usp=sharing
  season: spring-2020
- id: ocis-2020-04-14-elizabeth-tipton
  url: https://www.youtube.com/watch?v=HYP32wzEZMA
  title: W ill this Intervention Work in this Population? Designing Randomized Trials
    for Generalization
  speaker: Elizabeth Tipton
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-04-14'
  topic: causal_inference
  language: en
  discussant: Andrew Gelman
  slides: https://drive.google.com/file/d/1rM3tWP6FKBhgDfODp8zyGRm-bOCp0pm5/view?usp=sharing
  season: spring-2020
- id: ocis-2020-04-08-hyunseung-kang
  url: https://www.youtube.com/watch?v=FLxng_1YCGk
  title: Inferring Treatment Effects After Testing Instrument Strength in Linear Models
  speaker: Hyunseung Kang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-04-08'
  topic: causal_inference
  language: en
  papers:
  - '2003.06723'
  discussant: Will Fithian
  slides: https://drive.google.com/file/d/1hE1GFeq3Pjk3hqHPylTVkyNDPTGnumnN/view?usp=sharing
  abstract: A common practice in IV studies is to check for instrument strength, i.e.
    its association to the treatment, with an F-test from regression. If the F-statistic
    is above some threshold, usually 10, the instrument is deemed to satisfy one of
    the three core IV assumptions and used to test for the treatment effect. However,
    in many cases, the inference on the treatment effect does not take into account
    the strength test done a priori. In this paper, we show that not accounting for
    this pretest can severely distort the distribution of the test statistic and propose
    a method to correct this distortion, producing valid inference. A key insight
    in our method is to frame the F-test as a randomized convex optimization problem
    and to leverage recent methods in selective inference. We prove that our method
    provides conditional and marginal Type I error control. We also extend our method
    to weak instrument settings. We conclude with a reanalysis of studies concerning
    the effect of education on earning where we show that not accounting for pre-testing
    can dramatically alter the original conclusion about education's effects.
  season: spring-2020
- id: ocis-2020-03-31-dylan-small
  url: https://www.youtube.com/watch?v=DWTDIPuff14
  title: T esting an Elaborate Theory of a Causal Hypothesis
  speaker: Dylan Small
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-03-31'
  topic: causal_inference
  language: en
  discussant: Peter Bühlmann
  slides: http://www-stat.wharton.upenn.edu/~bikramk/papers/integrationef41.pdf
  abstract: When R.A. Fisher was asked what can be done in observational studies to
    clarify the step from association to causation, he replied, “Make your theories
    elaborate” -- when constructing a causal hypothesis, envisage as many different
    consequences of its truth as possible and plan observational studies to discover
    whether each of these consequences is found to hold. William Cochran called “this
    multi-phasic attack…one of the most potent weapons in observational studies.”
    Statistical tests for the various pieces of the elaborate theory help to clarify
    how much the causal hypothesis is corroborated. In practice, the degree of corroboration
    of the causal hypothesis has been assessed by a verbal description of which of
    the several tests provides evidence for which of the several predictions. This
    verbal approach can miss quantitative patterns. We develop a quantitative approach
    to making statistical inference about the amount of the elaborate theory that
    is supported by evidence.
  season: spring-2020
- id: ocis-2021-11-02-xinran-li
  url: https://youtu.be/XUh8KsaWfJ4
  title: '- Randomization Inference beyond the Sharp Null: Bounded Null Hypotheses
    and Quantiles of Individual Treatment Effects'
  speaker: Xinran Li
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-11-02'
  topic: causal_inference
  language: en
  discussant: Panos Toulis
  abstract: Randomization (a.k.a. permutation) inference is typically interpreted
    as testing Fisher's "sharp" null hypothesis that all effects are exactly zero.
    This hypothesis is often criticized as uninteresting and implausible. We show,
    however, that many randomization tests are also valid for a "bounded" null hypothesis
    under which effects are all negative (or positive) for all units but otherwise
    heterogeneous. The bounded null is closely related to important concepts such
    as monotonicity and Pareto efficiency. Inverting tests of this hypothesis yields
    confidence intervals for the maximum (or minimum) individual treatment effect.
    We then extend randomization tests to infer other quantiles of individual effects,
    which can be used to infer the proportion of units with effects larger (or smaller)
    than any threshold. The proposed confidence intervals for all quantiles of individual
    effects are simultaneously valid, in the sense that no correction due to multiple
    analyses is needed. In sum, we provide a broader justification for Fisher randomization
    tests, and develop exact nonparametric inference for quantiles of heterogeneous
    individual effects. We illustrate our methods with simulations and applications,
    where we find that Stephenson rank statistics often provide the most informative
    results.
  slides: https://drive.google.com/file/d/12YFKB9B0zt2IAw6xQovkttNdHEINZQmB/view?usp=sharing
  season: fall-2021
