talks:
- id: ocis-2026-06-02-suhas-vijaykumar
  url: https://youtu.be/iEd5f1jARBk
  title: Demonstration Experiments
  speaker: Suhas Vijaykumar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-06-02'
  topic: causal_inference
  language: en
  papers:
  - '2603.06941'
  discussant: Aurélien Bibaut
  abstract: 'Adaptive experiments are used extensively in online platforms, healthcare
    and biotechnology, and the social sciences. Often, the primary goal is not to
    precisely estimate a treatment effect but to demonstrate that at least one candidate
    intervention yields a positive effect, for some subpopulation and on some measured
    outcome. We formalize this objective as testing the global null in a threshold
    bandit framework, and develop two inference procedures that are valid under general
    adaptive sampling: one that pools information across promising arms, and one based
    on time-uniform multiple testing of individual arm means. To support the latter,
    we establish a moderate-deviations principle for the sequential t-statistic, justifying
    asymptotic confidence sequences in settings where the number of arms is large
    relative to the sample size. To illustrate how adaptive designs can target the
    proposed statistics, we recast experimental design as bandit optimization with
    an arm''s reward given by its signal-to-noise ratio, and analyze an allocation
    rule for which we establish a logarithmic regret bound. We apply the methods in
    a simulation study of targeting unconditional cash transfer programs. Joint work
    with Guido Imbens, Lorenzo Masoero, Alexander Rakhlin and Thomas Richardson.'
  slides: https://drive.google.com/file/d/1Nij0j0A_3hP_Sjs8gW2Da7lFr1qFyQl8/view?usp=sharing
  season: spring-2026
- id: ocis-2026-05-19-naoki-egami
  url: https://youtu.be/Tdf05OYHVUU
  title: 'Conformal Policy Learning with Distribution-Free Safety Guarantees: Application
    to AI-Powered Interventions'
  speaker: Naoki Egami
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-05-19'
  topic: causal_inference
  language: en
  discussant: Eli Ben-Michael
  abstract: 'Generative AI is emerging as a new class of intervention in the social
    sciences, with applications designed to change attitudes and behaviors through
    scalable, personalized interactions. For example, conversational agents have been
    used to reduce political polarization and improve workplace productivity. At the
    same time, recent empirical studies highlight an important risk: while such interventions
    may benefit many individuals and tasks, they may also harm others. How, then,
    can AI interventions be deployed safely? In this paper, we develop a new statistical
    framework, conformal policy learning, to deliver pre-specified safety guarantees
    when deciding whether individuals should receive a new intervention or the status
    quo. For instance, a researcher may require that the probability that an individual
    is harmed by the chosen intervention is below 1%. Using tailored conformal hypothesis
    testing, our method provides finite-sample safety guarantees under the standard
    exchangeability assumption, without relying on any modeling assumptions. It also
    achieves asymptotically optimal power or welfare maximization when the conditional
    expectation functions of outcomes are correctly specified. Thus, our treatment
    assignment rule is guaranteed to be safe in finite samples while attaining optimality
    under standard modeling assumptions. In practice, our framework enables researchers
    to deploy AI safely by assigning AI interventions only to people and tasks that
    satisfy user-specified safety requirements, and by reverting to the status quo
    otherwise. This offers a middle ground between two undesirable extremes: unfiltered
    deployment that ignores AI risks and total avoidance due to safety concerns. We
    illustrate the method through extensive simulations and an experiment in which
    randomly assigned AI chatbots are used to reduce conspiracy beliefs. This is joint
    work with Ying Jin.'
  slides: https://drive.google.com/file/d/1FIQFPIBjFCG9jPLNqqBtFqCgZnOjS4Gd/view?usp=share_link
  season: spring-2026
- id: ocis-2026-05-12-fan-xia
  url: https://youtu.be/L8ih_a5bHws
  title: Robust and Efficient Semiparametric Inference for the Stepped Wedge Design
  speaker: Fan Xia
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-05-12'
  topic: causal_inference
  language: en
  abstract: Stepped wedge designs (SWDs) are increasingly used to evaluate longitudinal
    cluster-level interventions but pose substantial challenges for valid inference.
    Because crossover times are randomized, intervention effects are intrinsically
    confounded with secular time trends, while heterogeneity across clusters, complex
    correlation structures, baseline covariate imbalances, and small numbers of clusters
    further complicate inference. We propose a unified semiparametric framework for
    estimating possibly time-varying intervention effects in SWDs. Under a semiparametric
    model on treatment contrast, we develop a nonstandard semiparametric efficiency
    theory that accommodates correlated observations within clusters, varying cluster-period
    sizes, and weakly dependent treatment assignments. The resulting estimator is
    consistent and asymptotically normal even under misspecified covariance structure
    and control cluster-period means, and is efficient when both are correctly specified.
    To enable inference with few clusters, we exploit the permutation structure of
    treatment assignment to propose a standard error estimator that reflects finite-sample
    variability, with a leave-one-out correction to reduce plug-in bias. The framework
    also allows seamless incorporation of adjustment for imbalanced baseline precision
    variables through a design-based adjustment shown to be closely related to post-stratification,
    or a double adjustment that additionally incorporates an outcome-based component.
    Simulations and application to a public health trial demonstrate the robustness
    and efficiency of the proposed method relative to standard approaches.
  season: spring-2026
- id: ocis-2026-05-05-chan-park
  url: https://youtu.be/sUlOJmdwUY8
  title: 'Distributional Balancing for Causal Inference: A Unified Framework via Characteristic
    Function Distance'
  speaker: Chan Park
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-05-05'
  topic: causal_inference
  language: en
  papers:
  - '2601.15449'
  abstract: Weighting methods are essential tools for estimating causal effects in
    observational studies, with the goal of balancing pre-treatment covariates across
    treatment groups. Traditional approaches pursue this objective indirectly, for
    example, via inverse propensity score weighting or by matching a finite number
    of covariate moments, and therefore do not guarantee balance of the full joint
    covariate distributions. Recently, distributional balancing methods have emerged
    as robust, nonparametric alternatives that directly target alignment of entire
    covariate distributions, but they lack a unified framework, formal theoretical
    guarantees, and valid inferential procedures. We introduce a unified framework
    for nonparametric distributional balancing based on the characteristic function
    distance (CFD) and show that widely used discrepancy measures, including the maximum
    mean discrepancy and energy distance, arise as special cases. Our theoretical
    analysis establishes conditions under which the resulting CFD-based weighting
    estimator achieves root-N consistency. Since the standard bootstrap may fail for
    this estimator, we propose subsampling as a valid alternative for inference. We
    further extend our approach to an instrumental variable setting to address potential
    unmeasured confounding. Finally, we evaluate the performance of our method through
    simulation studies and a real-world application, where the proposed estimator
    performs well and exhibits results consistent with our theoretical predictions.
  slides: https://drive.google.com/file/d/1--U-3hfAEns9ryki7Vf645H5Qr55-mUW/view?usp=sharing
  season: spring-2026
- id: ocis-2026-04-28-bryon-aragam
  url: https://youtu.be/Xj2h0Z1qwms
  title: Beyond identifiability in causal representation learning
  speaker: Bryon Aragam
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-04-28'
  topic: causal_inference
  language: en
  abstract: 'Causal reasoning has long been recognized as a crucial skill needed to
    build intelligent systems. Whether or not current systems possess this skill is
    the subject of much debate: Recent years have witnessed a flurry of activity with
    both positive and negative results on this topic from both theoretical and empirical
    perspectives. This talk will highlight the challenges intrinsic to this endeavour,
    focusing on the difficulties in translating existing causal identifiability results
    into practical, finite-sample algorithms. We will focus on two concrete subproblems
    in causal representation learning, namely neighbourhood selection and factor modeling,
    and present recent progress towards resolving these challenges.'
  season: spring-2026
- id: ocis-2026-04-07-thomas-icard
  url: https://youtu.be/bHXGL9UlevA
  title: Causal Inference as a Logical Problem
  speaker: Thomas Icard
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-04-07'
  topic: causal_inference
  language: en
  discussant: Jiji Zhang
  abstract: The goal of this talk will be to show how problems of causal inference
    can be usefully and precisely understood as logical problems. Adapting tools and
    concepts from mathematical and computational logic affords new perspectives, raises
    new questions, and sheds light on some practical and theoretical issues in causal
    inference. We illustrate with several examples, including some ways in which a
    logical lens can help clarify the empirical status of assumptions sufficient to
    bridge gaps between limited data and substantive causal conclusions.
  slides: https://drive.google.com/file/d/1x_RuY_8YSnVbrT_xVUaR1IbubwdkuTiR/view?usp=sharing
  season: spring-2026
- id: ocis-2026-03-24-young-researchers-seminar
  url: https://youtu.be/fzowqjMUj1s
  title: Policy Learning with Unobserved Heterogeneity
  speaker: Young Researchers' Seminar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-03-24'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1TL2VTXhDoR_dC6rfiiyG0QEcokBWwFBV/view
  abstract: Empirical research shows that individuals' responses to treatments vary
    along latent characteristics, such as innate ability or motivation. Therefore,
    a policymaker seeking to maximize social welfare may consider assigning treatments
    not only based on observed characteristics, but also on estimated latent traits.
    I characterize how the accuracy of these estimates affects the worst-case performance
    of policies, deriving sharp regret bounds for assignment rules that include or
    exclude them, and illustrate new trade-offs with the complexity of the policy
    space. I then study how a policymaker can mitigate this effect by designing data
    collections before solving the decision problem, and derive the minimax optimal
    data collection effort. In an empirical application in development economics,
    I show that including a proxy for entrepreneurs' business skills in policy recommendations
    increases welfare by 6%, and halves the probability of generating welfare losses.
  season: winter-2026
- id: ocis-2026-03-17-rajarshi-mukherjee
  url: https://youtu.be/gOcHwBF5R9Q
  title: Nuisance Parameter Tuning for Estimating Doubly Robust Functionals
  speaker: Rajarshi Mukherjee
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-03-17'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1iDS5RQCzXk7D72dcTkBVLaoAg-TckX3U/view?usp=share_link
  abstract: The purpose is to discuss the issue of nuisance parameter tuning for estimating
    quantities in observational studies, such as the average treatment effect and
    measures of conditional dependence. Typical methods for estimating such quantities
    of interest rely on estimating nuisance functions often through the lens of nonparametric
    and/or high-dimensional machine learning methods. Whereas many popular ideas pertain
    to tuning these nuisance function estimators from a prediction perspective and
    subsequently performing downstream bias correction for valid inference of low
    dimensional summaries of interest in the observational studies, cases are explored
    to show that there exists a delicate interplay between nuisance function estimation
    strategies, type of estimators that uses these nuisance functions in its pipeline
    for estimating the final object of interest, and sample splitting strategies that
    are now popular to allow flexible nuisance function estimators without jeopardizing
    the standard errors of estimators of the downstream objects of interest. The above
    is explored through the lens of specific functionals that arise in the context
    of causal inference, and both are studied in nonparametric and high-dimensional
    regimes.
  season: winter-2026
- id: ocis-2026-03-10-dean-eckles
  url: https://youtu.be/pBhOtOhKEtc
  title: Policy relevance of causal quantities in networks
  speaker: Dean Eckles
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-03-10'
  topic: causal_inference
  language: en
  papers:
  - '2507.14391'
  slides: https://drive.google.com/file/d/1a8SVAcGS3XQxkDGNrobq6sW1V-z9l8cX/view?usp=share_link
  abstract: 'In settings where units'' outcomes are affected by others'' treatments,
    there has been a proliferation of ways to quantify effects of treatments on outcomes,
    including via indirect exposure to other units'' treatments. Here we consider
    two properties we might want estimands to have: being interpretable as summaries
    of unit-level effects, and being relevant to choice of a policy governing treatment
    assignment. We characterize many estimands as involving one of two orders of averaging
    over units in a population and over treatment assignments under a policy. The
    more common representation often results in quantities that are insufficient for
    optimal policy choice. This occurs because these quantities summarize outcomes
    under homogeneous exposure to treatment, but even homogeneous policies often lead
    to heterogeneous exposures. The other representation often yields quantities that
    lack an interpretation as summaries of unit-level effects. We argue that, among
    various estimands, the expected average outcome, which averages over units and
    treatment assignments in either order, deserves further attention from researchers.
    This estimand, or contrasts among these estimands under different policies, is
    both a summary of unit-level effects and is sufficient for optimal policy choice
    with utilitarian welfare.'
  season: winter-2026
- id: ocis-2026-03-03-mats-stensrud
  url: https://youtu.be/r9Y38RiZ51Y?si=2RcCvO4-VoNLVIZ2
  title: Causal effects conditional on post-treatment variables
  speaker: Mats Stensrud
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-03-03'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1QswMjLnF3d7JDpmNNrjB8JXP3pBPTsvx/view?usp=sharing
  abstract: Many studies aim to estimate treatment effects on outcomes that are defined
    only for individuals who experience a post-treatment event. For example, the effect
    of cancer therapies on quality of life is only well defined among individuals
    who are alive. Similarly, the effect of vaccines on post-infection outcomes is
    only of interest among individuals who become infected. A naive comparison of
    outcomes conditional on such post-treatment events generally lacks a causal interpretation,
    even when treatment is randomly assigned. In this talk, I discuss causal contrasts
    for outcomes conditional on post-treatment events, including principal stratum
    effects and conditional separable effects. I then derive identification results
    for these estimands and discuss their interpretation and the conditions under
    which they might, in principle, be falsified. I illustrate the relevance of these
    results for clinical trials of cancer therapies and vaccines, and I conclude by
    revisiting the classical birth weight paradox in epidemiology.
  season: winter-2026
- id: ocis-2026-02-24-kayvan-sadeghi
  url: https://youtu.be/EkpY1l1sjPQ
  title: A theory of causality with multiple interventions
  speaker: Kayvan Sadeghi
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-02-24'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1FpXibixrorvPuURys08rx9nzAmTMmT-0/view?usp=share_link
  abstract: 'Causal intervention is an essential tool in causal inference. By considering
    a family of interventional distributions for multiple interventions, we propose
    simple assumptions that lead to a theory of causality that has several advantages:
    it does not need to make use of any modeling assumptions such as those imposed
    by structural causal models; it includes most cases with latent variables and
    causal cycles; and more importantly, it does not assume the existence of an underlying
    true causal graph as we do not take it as the primitive object—in fact, a causal
    graph is derived as a by-product of our theory. We show that, with these assumptions,
    the intervened distributions are Markovian to the defined intervened causal graphs,
    and an observed joint probability distribution is Markovian to the obtained causal
    graph. We discuss how structural causal models fit in this setting. (Joint work
    with Philip Dawid and Terry Soo)'
  season: winter-2026
- id: ocis-2026-02-17-young-researchers-seminar
  url: https://youtu.be/GO1z9bECD2k
  title: 'Average Causal Effect Estimation in DAGs with Hidden Variables: Beyond Back-Door
    and Front-Door Criteria'
  speaker: Young Researchers' Seminar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-02-17'
  topic: causal_inference
  language: en
  papers:
  - '2312.10234'
  slides: https://drive.google.com/file/d/1pyNTF31HmxdbiGp_6oS7flqBQbCjWl_O/view?usp=sharing
  abstract: This talk focuses on flexible estimation of causal effects in hidden-variable
    graphical models. While the identification theory for causal effects in directed
    acyclic graphs (DAGs) with hidden variables is well developed, methods for estimation
    and inference of causal functionals beyond the g-formula remain limited. In the
    first part, we introduce novel one-step–corrected plug-in estimators and targeted
    minimum loss-based estimators (TMLE) for causal effects in a class of hidden-variable
    DAGs that extends beyond the classical back-door and front-door criteria, known
    in the literature as treatment primal fixability. These estimators leverage data-adaptive
    machine learning methods to reduce modeling assumptions while retaining key statistical
    guarantees, including double robustness, boundedness within the parameter space,
    and asymptotic linearity under $L^2(P)$-rate conditions on nuisance function estimation,
    yielding root-$n$ consistent causal effect estimators. In the second part, we
    discuss a model known as the Napkin graph, which falls outside this convenient
    class and requires a nonstandard identification strategy, necessitating special
    consideration in estimation. This model also encodes a generalized independence
    restriction, known as a Verma constraint. We show how such constraints can be
    exploited both to improve estimation efficiency and to test model assumptions.
  season: winter-2026
- id: ocis-2025-01-27-victor-chernozhukov
  url: https://youtu.be/YN29rc-E530?si=0Kx99EFwLznzG1_Y
  title: Adventures in Demand Analysis Using AI
  speaker: Victor Chernozhukov
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-01-27'
  topic: causal_inference
  language: en
  abstract: This paper advances empirical demand analysis by integrating multimodal
    product representations derived from artificial intelligence (AI). Using a detailed
    dataset of toy cars on Amazon.com , we combine text descriptions, images, and
    tabular covariates to represent each product using transformer-based embedding
    models. These embeddings capture nuanced attributes, such as quality, branding,
    and visual characteristics, that traditional methods often struggle to summarize.
    Moreover, we fine-tune these embeddings for causal inference tasks. We show that
    the resulting embeddings substantially improve the predictive accuracy of sales
    ranks and prices and that they lead to more credible causal estimates of price
    elasticity. Notably, we uncover strong heterogeneity in price elasticity driven
    by these product-specific features. Our findings illustrate that AI-driven representations
    can enrich and modernize empirical demand analysis. The insights generated may
    also prove valuable for applied causal inference more broadly.
  season: winter-2026
- id: ocis-2025-01-20-paul-rosenbaum
  url: https://youtu.be/S27_5l7leZI?si=6tRwk-DTUPCmVpMC
  title: Being Realistic About Unmeasured Biases in Observational Studies
  speaker: Paul Rosenbaum
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-01-20'
  topic: causal_inference
  language: en
  abstract: Observational studies of the effects caused by treatments are always subject
    to the concern that an ostensible treatment effect may reflect a bias in treatment
    assignment, rather than an effect actually caused by the treatment. The degree
    of legitimate concern is strongly affected by simple decisions that an investigator
    makes during the design and analysis of an observational study. Poor choices lead
    to heightened concern; that is, poor choices make a study sensitive to small unmeasured
    biases where better choices would correctly report insensitivity to larger biases.
    Indeed, perhaps surprisingly, unambiguous evidence of the presence of unmeasured
    bias may increase insensitivity to unmeasured bias. These issues are discussed
    with the aid of some theory and a simple example of an observational study.
  season: winter-2026
- id: ocis-2026-01-13-yilin-song
  url: https://youtu.be/GxiyMtWMRVE
  title: 'The Categorical Instrumental Variable Model: Characterization, Partial Identification,
    and Statistical Inference'
  speaker: Yilin Song
  venue: OCIS (Online Causal Inference Seminar)
  date: '2026-01-13'
  topic: causal_inference
  language: en
  papers:
  - '2405.09510'
  discussant: Desire Kedagni
  slides: https://drive.google.com/file/d/1XXoj74siuw30w6j-G4aV9z-EH0WiiAsr/view?usp=sharing
  abstract: We study categorical instrumental variable (IV) models with instrument,
    treatment, and outcome taking finitely many values. We derive a simple closed-form
    characterization of the set of joint distributions of potential outcomes that
    are compatible with a given observed data distribution in terms of a set of inequalities.
    These inequalities unify several different IV models defined by versions of the
    independence and exclusion restriction assumptions and are shown to be non-redundant.
    Finally, given a set of linear functionals of the joint counterfactual distribution,
    such as pairwise average treatment effects, we construct confidence intervals
    with simultaneous finite-sample coverage, using a tail bound on the Kullback--Leibler
    divergence. We illustrate our method using data from the Minneapolis Domestic
    Violence Experiment.
  season: winter-2026
- id: ocis-2025-12-09-carlos-cinelli
  url: https://youtu.be/1RZz1gLse7s
  title: 'Long Story Short: Omitted Variable Bias in Causal Machine Learning'
  speaker: Carlos Cinelli
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-12-09'
  topic: causal_inference
  language: en
  discussant: Dominik Rothenhäusler
  slides: https://drive.google.com/file/d/14FU1KukMS-DF1vzurj_EiUdT7sfrAsnP/view?usp=share_link
  abstract: We develop a general theory of omitted variable bias for a wide range
    of common causal parameters, including (but not limited to) averages of potential
    outcomes, average treatment effects, average causal derivatives, and policy effects
    from covariate shifts. Our theory applies to nonparametric models, while naturally
    allowing for (semi-)parametric restrictions (such as partial linearity) when such
    assumptions are made. We show how simple plausibility judgments on the maximum
    explanatory power of omitted variables are sufficient to bound the magnitude of
    the bias, thus facilitating sensitivity analysis in otherwise complex, nonlinear
    models. Finally, we provide flexible and efficient statistical inference methods,
    which can leverage modern machine learning algorithms for estimation. These results
    allow empirical researchers to perform sensitivity analyses in a flexible class
    of machine-learned causal models using very simple, and interpretable, tools.
    Empirical examples demonstrate the utility of our approach.
  season: fall-2025
- id: ocis-2025-12-02-rajen-shah
  url: https://youtu.be/PpSCauIpXr0
  title: Hunt and test for assessing the fit of semiparametric regression models
  speaker: Rajen Shah
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-12-02'
  topic: causal_inference
  language: en
  discussant: Mats Stensrud
  slides: https://drive.google.com/file/d/1gMBAVLfXA3KznzpCbGXenonqkxiscIEa/view?usp=sharing
  abstract: 'We consider testing the goodness of fit of semiparametric regression
    models, such as generalised additive models, partially linear models, and quantile
    additive regression models: a class of problems that includes, for example, testing
    for heterogeneous treatment effects. We propose an approach that involves splitting
    the data in two parts. On one part, we "hunt" for any signal that may be present
    in the score-type residuals following a fit of the null model. On the remaining
    data, we test for the presence of the potential signal thus found. In the first,
    hunting stage of the procedure, our framework allows the use of any flexible regression
    method chosen by the practitioner, such as a random forest. The method can therefore
    harness the power of modern machine learning tools to detect complex alternatives.
    A challenge in the testing step is that any first-order bias in the residuals
    may lead to rejection under the null. To address this, we employ a debiasing step,
    which we show is equivalent to performing a particular weighted least squares
    regression. We establish that the type I error can be controlled under relatively
    mild conditions and that the test has power against alternatives for which, with
    high probability, the hunted signal is correlated with the true signal in the
    score residuals.'
  season: fall-2025
- id: ocis-2025-11-18-caleb-miles
  url: https://youtu.be/L37UkHqzv6Y
  title: Addressing an extreme positivity violation to distinguish the causal effects
    of surgery and anesthesia via separable effects
  speaker: Caleb Miles
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-11-18'
  topic: causal_inference
  language: en
  papers:
  - '2504.01171'
  discussant: James Robins and Thomas Richardson
  slides: https://drive.google.com/file/d/16Fcb0eVymop-1zgkZVjej8kRle7cZYie/view?usp=share_link
  abstract: The U.S. Food and Drug Administration has cautioned that prenatal exposure
    to anesthetic drugs during the third trimester may have neurotoxic effects; however,
    there is limited clinical evidence available to substantiate this recommendation.
    One major scientific question of interest is whether such neurotoxic effects might
    be due to surgery, anesthesia, or both. Isolating the effects of these two exposures
    is challenging because they are observationally equivalent, thereby inducing an
    extreme positivity violation. To address this, we adopt the separable effects
    framework of Robins and Richardson (2010) to identify the effect of anesthesia
    (alone) by blocking effects through variables that are assumed to completely mediate
    the causal pathway from surgery to the outcome. We apply this approach to data
    from the nationwide Medicaid Analytic eXtract (MAX) from 1999 through 2013, which
    linked 16,778,281 deliveries to mothers enrolled in Medicaid during pregnancy.
    Furthermore, we assess the sensitivity of our results to violations of our key
    identification assumptions.
  season: fall-2025
- id: ocis-2025-11-04-zijun-gao
  url: https://youtu.be/T-KzfVzHji4
  title: Explainability and Analysis of Variance
  speaker: Zijun Gao
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-11-04'
  topic: causal_inference
  language: en
  papers:
  - '2411.01625'
  discussant: Art Owen
  slides: https://drive.google.com/file/d/1H-eijYNeV8SaXWHvzbpee9z6XZlaHYBF/view?usp=sharing
  abstract: Existing tools for explaining complex models and systems are associational
    rather than causal and do not provide mechanistic understanding. We propose a
    new notion called counterfactual explainability for causal attribution that is
    motivated by the concept of genetic heritability in twin studies. Counterfactual
    explainability extends methods for global sensitivity analysis (including the
    functional analysis of variance and Sobol's indices), which assumes independent
    explanatory variables, to dependent explanations by using a directed acyclic graphs
    to describe their causal relationship. Therefore, this explanability measure directly
    incorporates causal mechanisms by construction. Under a comonotonicity assumption,
    we discuss methods for estimating counterfactual explainability and apply them
    to a real dataset dataset to explain income inequality by gender, race, and educational
    attainment.
  season: fall-2025
- id: ocis-2025-10-28-linbo-wang
  url: https://youtu.be/VZh13Cy7WDM
  title: 'The synthetic instrument: From sparse association to sparse causation'
  speaker: Linbo Wang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-10-28'
  topic: causal_inference
  language: en
  papers:
  - '2304.01098'
  discussant: Zijian Guo
  slides: https://drive.google.com/file/d/1ohqea2Zq1MzcYETScQt7Aoj-8UZW-p0z/view?usp=sharing
  abstract: In many observational studies, researchers are often interested in studying
    the effects of multiple exposures on a single outcome. Standard approaches for
    high-dimensional data such as the lasso assume the associations between the exposures
    and the outcome are sparse. These methods, however, do not estimate the causal
    effects in the presence of unmeasured confounding. In this paper, we consider
    an alternative approach that assumes the causal effects in view are sparse. We
    show that with sparse causation, the causal effects are identifiable even with
    unmeasured confounding. At the core of our proposal is a novel device, called
    the synthetic instrument, that in contrast to standard instrumental variables,
    can be constructed using the observed exposures directly. We show that under linear
    structural equation models, the problem of causal effect estimation can be formulated
    as an $\ell_0$-penalization problem, and hence can be solved efficiently using
    off-the-shelf software. Simulations show that our approach outperforms state-of-art
    methods in both low-dimensional and high-dimensional settings. We further illustrate
    our method using a mouse obesity dataset.
  season: fall-2025
- id: ocis-2025-10-21-wooseok-ha
  url: https://youtu.be/3EJrhuW1zVA
  title: 'When few labeled target data suffice: a theory of semi-supervised domain
    adaptation via fine-tuning from multiple adaptive starts'
  speaker: Wooseok Ha
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-10-21'
  topic: causal_inference
  language: en
  papers:
  - '2507.14661'
  discussant: Jason Kluswoski
  slides: https://drive.google.com/file/d/1RHej9J-s1WaJVvgYmEQhxEJeINEUOei6/view?usp=sharing
  abstract: Semi-supervised domain adaptation (SSDA) aims to achieve high predictive
    performance in the target domain with limited labeled target data by exploiting
    abundant source and unlabeled target data. Despite its significance in numerous
    applications, theory on the effectiveness of SSDA remains largely unexplored,
    particularly in scenarios involving various types of source-target distributional
    shifts. In this talk, I will present a theoretical framework based on structural
    causal models (SCMs) which allows us to analyze and quantify the performance of
    SSDA methods when labeled target data is limited. Within this framework, I introduce
    three SSDA methods, each having a fine-tuning strategy tailored to a distinct
    assumption about the source and target relationship. Under each assumption, I
    demonstrate how extending an unsupervised domain adaptation (UDA) method to SSDA
    can achieve minimax-optimal target performance with limited target labels. Finally,
    when the relationship between source and target data is only vaguely known—a common
    practical concern—I will describe the Multi Adaptive-Start FineTuning (MASFT)
    algorithm, which fine-tunes UDA models from multiple starting points and selects
    the best-performing one based on a small hold-out target validation dataset. Combined
    with model selection guarantees, MASFT achieves near-optimal target predictive
    performance across a broad range of types of distributional shifts while significantly
    reducing the need for labeled target data.
  season: fall-2025
- id: ocis-2025-10-14-jakob-runge
  url: https://youtu.be/DZbLQ-WLrD0
  title: Causal Inference on Time Series Data with the Tigramite Package
  speaker: Jakob Runge
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-10-14'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1dqRbHt1uMaTDyQ3Yo1Q65gTSBEpp48cL/view?usp=sharing
  abstract: This talk introduces the open-source Python package Tigramite , which
    implements constraint-based algorithms such as PCMCI+ and many variants thereof
    as methods optimised for causal discovery on time series. In addition, Tigramite
    features causal effect estimation using optimal adjustment. I will outline the
    basic ideas behind PCMCI and optimal adjustment and then demonstrate practical
    workflows in Tigramite, including a user-friendly guide to choosing methods in
    causal inference based on causal questions, assumptions and available data. I
    look forward to feedback and exchange on improvements of the package to make causal
    inference accessible for practitioners dealing with time series data.
  season: fall-2025
- id: ocis-2025-09-30-joseph-antonelli
  url: https://youtu.be/5mAK4ivGBdU
  title: Partial identification and unmeasured confounding with multiple treatments
    and multiple outcomes
  speaker: Joseph Antonelli
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-09-30'
  topic: causal_inference
  language: en
  papers:
  - '2311.12252'
  slides: https://drive.google.com/file/d/1tytITJJBfF-IsB7dZvL5724z1VYUbWDh/view?usp=sharing
  abstract: 'Estimating the health effects of multiple air pollutants is a crucial
    problem in public health, but one that is difficult due to unmeasured confounding
    bias. Motivated by this issue, we develop a framework for partial identification
    of causal effects in the presence of unmeasured confounding in settings with multiple
    treatments and multiple outcomes. Under a factor confounding assumption, we show
    that joint partial identification regions for multiple estimands can be more informative
    than considering partial identification for individual estimands one at a time.
    We show how assumptions related to the strength of confounding or magnitude of
    plausible effect sizes for one estimand can reduce the partial identification
    regions for other estimands. As a special case of this result, we explore how
    negative control assumptions reduce partial identification regions and discuss
    conditions under which point identification can be obtained. We develop novel
    computational approaches to finding partial identification regions under a variety
    of these assumptions. We then estimate the causal effect of PM2.5 components on
    a variety of public health outcomes in the United States Medicare cohort, where
    we find that, in particular, the detrimental effect of black carbon is robust
    to the potential presence of unmeasured confounding bias. - Discussant : Carlos
    Cinelli (University of Washington)'
  season: fall-2025
- id: ocis-2025-09-23-young-researchers-seminar
  url: https://youtu.be/fGCPabNMkh0
  title: Learning causal cellular programs from large-scale perturbations
  speaker: Young researchers' seminar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-09-23'
  topic: causal_inference
  language: en
  papers:
  - '2307.06250'
  slides: https://drive.google.com/file/d/1FBpTl5iLrylaGyze2cKekpA-S_NokZm_/view?usp=share_link
  abstract: 'Complex molecular mechanisms govern cellular functions in living organisms
    and shape their behavior in health and disease. Understanding these mechanisms
    can greatly accelerate therapeutic discovery, yet it remains challenging due to
    the high dimensionality and intricate dependencies within biological systems.
    Recent advances in experimental technologies, however, are beginning to make this
    problem more tractable. For example, we can now systematically perturb individual
    or combinations of genes in single cells and measure their downstream effects,
    enabling empirical identification and validation of causal relationships. Nevertheless,
    perturbation data remain noisy and high-dimensional, with effects often sparse
    and subtle. In this talk, I will present our work addressing two key challenges
    in this emerging paradigm: (1) how to define and learn the causal programs that
    govern high-dimensional or perceptual data; (2) how to model perturbational effects
    in a way that enables the prediction of novel perturbations. For (1), we introduce
    new causal representation theories that guarantee identifiability of the underlying
    causal programs, given sufficient samples and regularizing condition. For (2),
    we develop a modular framework that models perturbation effects through distributional
    discrepancies. This approach captures nuanced, sample-level changes and enables
    extrapolation to predict the effects of unseen perturbations across diverse conditions
    and data types.'
  season: fall-2025
- id: ocis-2025-06-17-julie-josse
  url: https://youtu.be/C9VMl3xgE98
  title: Causal Alternatives to Meta-Analysis
  speaker: Julie Josse
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-06-17'
  topic: causal_inference
  language: en
  papers:
  - '2505.20168'
  discussant: Larry Han
  slides: https://drive.google.com/file/d/1136x5pwhzf0CKHJinlUCNOFlwQqvle6X/view?usp=sharing
  abstract: 'Meta-analysis, by aggregating effect estimates from multiple studies
    conducted in diverse settings, stands at the top of the evidence-based medicine
    hierarchy. However, conventional approaches face key limitations: they often lack
    a clear causal interpretation, and practical constraints, such as data silos and
    regulatory barriers, frequently prevent access to individual-level data, limiting
    the feasibility of individual patient data meta-analyses. In this talk, we introduce
    three causal alternatives to classical meta-analysis. First, we present novel
    causal aggregation formulas—distinct from fixed- and random-effects models—that
    are compatible with standard meta-analysis practices and do not require individual-level
    data but only aggregated data. While these often align with traditional conclusions,
    they can expose important discrepancies, including cases where conventional methods
    suggest benefit when a causal approach reveals harm. Second, we connect federated
    learning with causal inference to enable treatment effect estimation from decentralized
    data sources. Finally, we discuss generalization methods aimed at predicting treatment
    effects in new target populations. Across these approaches, we focus on both absolute
    and relative measures, such as risk ratios and odds ratios, which pose unique
    challenges due to their non-linearity.'
  season: spring-2025
- id: ocis-2025-06-10-matias-cattaneo
  url: https://youtu.be/QkAdvFdkImc
  title: Estimation and Inference in Boundary Discontinuity Designs
  speaker: Matias Cattaneo
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-06-10'
  topic: causal_inference
  language: en
  papers:
  - '2505.05670'
  slides: https://drive.google.com/file/d/1moSCQz6W62K18XgJQmn9U9BDlV7QSGHo/view?usp=sharing
  abstract: 'Boundary Discontinuity Designs are used to learn about treatment effects
    along a continuous boundary that splits units into control and treatment groups
    according to a bivariate score variable. These research designs are also called
    Multi-Score Regression Discontinuity Designs, a leading special case being Geographic
    Regression Discontinuity Designs. We study the statistical properties of commonly
    used local polynomial treatment effects estimators along the continuous treatment
    assignment boundary. We consider two distinct approaches: one based explicitly
    on the bivariate score variable for each unit, and the other based on their univariate
    distance to the boundary. For each approach, we present pointwise and uniform
    estimation and inference methods for the treatment effect function over the assignment
    boundary. Notably, we show that methods based on univariate distance to the boundary
    exhibit an irreducible large misspecification bias when the assignment boundary
    has kinks or other irregularities, making the distance-based approach unsuitable
    for empirical work in those settings. In contrast, methods based on the bivariate
    score variable do not suffer from that drawback. We illustrate our methods with
    an empirical application. Companion general-purpose software is provided.'
  season: spring-2025
- id: ocis-2025-05-27-francesco-locatello
  url: https://youtu.be/YGo9rTI2bZE
  title: 'Powering causality with ML: Discovery, Representations, and Inference'
  speaker: Francesco Locatello
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-05-27'
  topic: causal_inference
  language: en
  discussant: Jason Hartford
  slides: https://drive.google.com/file/d/10NZf3U4jWhCzkKFFha5DtoK_jPzKWmBV/view?usp=share_link
  abstract: 'Machine learning and AI have the potential to transform data-driven scientific
    discovery, enabling not only accurate predictions for several scientific phenomena
    but also accelerating causal understanding. In this talk, I will show how machine
    learning has the potential to power causal analysis across 3 pillars: discovery,
    representations, and inference. I will discuss first how causal structure can
    be discovered using score matching approaches. Next, I will turn to a new interpretation
    of causal representation learning, introducing the measurement model as a way
    to conceptualize causal representations and the invariance principle as a unifying
    methodology. Finally, I will focus on powering causal inferences from high-dimensional
    observations. Using our real-world ISTAnt benchmark in experimental ecology as
    a motivating example, I will discuss challenges from selection bias during transfer
    learning and encoder bias due to pre-training and generalization across populations
    (e.g., multiple experiments with different treatments).'
  season: spring-2025
- id: ocis-2025-05-20-luke-keele
  url: https://youtu.be/sOuxZtYJKlQ
  title: 'Clustered Observational Studies: A Review of Concepts and Methods'
  speaker: Luke Keele
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-05-20'
  topic: causal_inference
  language: en
  discussant: Eli Ben-Michael
  slides: https://drive.google.com/file/d/1z4SHdGPLaalteaGNyohQzHWZ6iZm0LzH/view?usp=share_link
  abstract: The clustered observational study (COS) design is the observational counterpart
    to the clustered randomized trial. In a COS, a treatment is assigned to intact
    groups, and all units within the group are exposed to the treatment. However,
    the treatment is non-randomly assigned. COSs are common in both education and
    health services research. In education, treatments may be given to all students
    within some schools but withheld from all students in other schools. In health
    studies, treatments may be applied to clusters such as hospitals or groups of
    patients treated by the same physician. In this presentation, I provide a review
    of research on the COS design. I start with identification issues for COS designs.
    Specifically, I outline how this design is subject to differential selection,
    which occurs when the units' cluster selections depend on the clusters' treatment
    assignments. This can occur when units switch clusters in response to how the
    cluster was assigned to treatment. Early work on COSs made an implicit assumption
    that rules out the presence of differential selection. I review how causal effects
    can be identified in the presence of differential selection and how to reason
    about when it is likely. Next, I review how COS designs are often subject to common
    support violations. Such violations are likely to occur in a COS, especially with
    a small number of treated clusters. I outline how trimming to ensure common support
    holds can result in extremely narrow causal estimands that are unlikely to generalize
    to other contexts. I then review methods for covariate adjustment in COS design.
    Extant methods for covariate adjustment include specialized forms of matching
    and weighting. I review these different methods and outline current research that
    compares the performance of these different methods. I conclude with more recent
    work that has developed key results on the nature of omitted confounders. Throughout
    I motivate concepts and methods with a number of COS applications from education
    and health services research.
  season: spring-2025
- id: ocis-2025-05-13-sam-pimentel
  url: https://youtu.be/O2Yt9N5FVbY
  title: Design Sensitivity and Its Implications for Weighted Observational Studies
  speaker: Sam Pimentel
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-05-13'
  topic: causal_inference
  language: en
  papers:
  - '2307.00093'
  discussant: Jacob Dorn
  slides: https://drive.google.com/file/d/167kX0QzysTqqL2b6eHpujAR95QA_zQiU/view?usp=drive_link
  abstract: Sensitivity to unmeasured confounding is not typically a primary consideration
    in designing weighted treated-control comparisons in observational studies. We
    introduce a framework allowing researchers to optimize robustness to omitted variable
    bias at the design stage using a measure called design sensitivity. Design sensitivity,
    which describes the asymptotic power of a sensitivity analysis, allows transparent
    assessment of the impact of different weighted estimation strategies on sensitivity.
    We apply this general framework to two commonly-used sensitivity models, the marginal
    sensitivity model and the variance-based sensitivity model. By comparing design
    sensitivities, we interrogate how key features of weighted designs --- including
    definition of treatment, inclusion criteria, and handling of extreme weights ---
    impact robustness to unmeasured confounding, and how these impacts may differ
    for the two different sensitivity models. We illustrate the proposed framework
    on a study examining drivers of support for the 2016 Colombian peace agreement.
  season: spring-2025
- id: ocis-2025-05-06-zijian-guo
  url: https://youtu.be/1X9691nTTc8
  title: 'Multi-Source Learning with Minimax Optimization: From Adversarial Robustness
    to Causal Invariance'
  speaker: Zijian Guo
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-05-06'
  topic: causal_inference
  language: en
  discussant: Kaizheng Wang
  slides: https://drive.google.com/file/d/19YqS1DBxrWx_7VJIMAJeMFZ3QmlgcQzW/view?usp=sharing
  abstract: Empirical risk minimization often fails to deliver reliable predictions
    when the target distribution deviates from source populations. This talk explores
    leveraging multi-source data to build models that generalize and transfer effectively
    to target domains. We propose a distributionally robust optimization framework
    that maximizes worst-case performance over a set of potential target distributions.
    We first introduce the definition of a distributionally robust prediction model
    and show that it can be expressed as a weighted average of the conditional outcome
    models from the source populations. We then extend this framework to the transfer
    learning regime by incorporating a small number of labeled outcomes from the target
    domain to guide the robust optimization. This approach achieves faster convergence
    rates than models trained solely on labeled target data, while mitigating negative
    transfer. Finally, we connect causal invariance learning to distributionally robust
    learning with negative weights. We show that allowing negative weights over environment-specific
    risks enables the identification of invariant causal models, despite introducing
    nonconvexity. We establish a necessary and sufficient condition for identifying
    the causal invariance model under additive interventions. Under this causal identification
    condition, we show that standard gradient-based methods can efficiently solve
    the resulting nonconvex optimization problem, with provable convergence rates
    depending on the sample size and number of iterations.
  season: spring-2025
- id: ocis-2025-04-29-angela-zhou
  url: https://youtu.be/isWP1pdCI_U
  title: Robust Fitted-Q-Evaluation and Iteration under Sequentially Exogenous Unobserved
    Confounders
  speaker: Angela Zhou
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-04-29'
  topic: causal_inference
  language: en
  papers:
  - '2302.00662'
  discussant: Qingyuan Zhao
  slides: https://drive.google.com/file/d/1HRaboxuAzXl0oBf8W0NvCRL-itIAo4YP/view?usp=sharing
  abstract: 'Offline reinforcement learning is important in domains such as medicine,
    economics, and e-commerce where online experimentation is costly, dangerous or
    unethical, and where the true model is unknown. However, most methods assume all
    covariates used in the behavior policy’s action decisions are observed. Though
    this assumption, sequential ignorability/unconfoundedness, likely does not hold
    in observational data, most of the data that accounts for selection into treat-
    ment may be observed, motivating sensitivity analysis. We study robust policy
    evaluation and policy optimization in the presence of sequentially-exogenous unobserved
    confounders under a sensitivity model. We propose and analyze orthogonalized robust
    fitted-Q-iteration that uses closed-form solutions of the robust Bellman operator
    to derive a loss minimization problem for the robust Q function, and adds a bias-correction
    to quantile estimation. Our algorithm enjoys the computational ease of fitted-Q-iteration
    and statistical improvements (reduced dependence on quantile estimation error)
    from orthogonalization. We provide sample complexity bounds, insights, and show
    effectiveness both in simulations and on real-world longitudinal healthcare data
    of treating sepsis. In particular, our model of sequential unobserved confounders
    yields an online Markov decision process, rather than partially observed Markov
    decision process: we illustrate how this can enable warm-starting optimistic reinforcement
    learning algorithms with valid robust bounds from observational data.'
  season: spring-2025
- id: ocis-2025-04-22-young-researchers-seminar
  url: https://youtu.be/Ik4MTjhHaVM
  title: 'Monotonicity in graphical causal models: an algorithmic approach'
  speaker: Young researchers' seminar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-04-22'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1qOKm4awkpPxy3vKTwOfK193Lpp720ZVY/view
  abstract: A longstanding debate between the proponents of the potential outcomes
    (PO) and the graphical models (GM) approach to causal inference concerns the identification
    of causal effects under shape constraints (such as monotonicity). Scholars in
    the PO framework have developed seminal results leveraging monotonicity constraints
    in practical applications, such as in identification of local average treatment
    effects (LATE). Various assertions have been made in the PO literature that the
    graphical approach may be inherently limited for encoding shape constraints. At
    the same time, the GM approach has successfully provided complete algorithms for
    non-parametric identification of causal effects. Some special cases, such as linear
    or additive-noise models, are also well understood within this approach. However,
    incorporating shape constraints such as monotonicity, has so far eluded its scope.
    In this talk, we discuss a recent advance which allows one to encode monotonicity
    constraints in a graphical model, and leverage monotonicity for identification.
  season: spring-2025
- id: ocis-2025-04-08-nathan-kallus
  url: https://youtu.be/Os1jikCZTvg
  title: 'Learning Surrogate Indices from Historical A/Bs: Adversarial ML for Debiased
    Inference on Functionals of Ill-Posed Inverses'
  speaker: Nathan Kallus
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-04-08'
  topic: causal_inference
  language: en
  discussant: Rahul Singh
  slides: https://drive.google.com/file/d/100Y7I-RGkeBpwcjRFgFjSghLnShnBrn3/view?usp=share_link
  abstract: 'Experimentation on digital platforms often faces a dilemma: we want rapid
    innovation but we also want to make decisions based on long-term impact. Usually
    one resorts to looking at indices (i.e., scalar-valued functions) that combine
    multiple short-term surrogate outcomes. Constructing indices by regressing long-term
    metrics on short-term ones is easy with off-the-self ML but suffers bias from
    confounding and direct (i.e., unmediated) effects. I will discuss how to instead
    leverage past experiments as instrumental variables (IVs) and some surrogates
    as negative-control outcomes, with real-world examples from Netflix. There are
    two key technical challenges to surmount to make this possible. First, past experiments
    characterize the right surrogate index as a solution to an ill-posed system of
    moment equations: it does not uniquely identify an index, and approximately solving
    it does not translate to approximating any solution. We tackle this by developing
    a novel debiasing method for inference on linear functionals of solutions to ill-posed
    problems (as average long-term effects are such functionals of the index) and
    adversarial ML estimators for the solution admitting flexible hypothesis classes,
    such as neural nets and reproducing kernel Hilbert spaces. Second, even as we
    observe more past experiments, we have non-vanishing bias in estimating the moment
    equation implied by each one, since each experiment has a bounded size that is
    often just barely powered to detect effects. We tackle this by incorporating an
    instrument-splitting technique into our estimators, leading to a ML analogue of
    the classic (linear) jackknife IV estimator (JIVE) with guarantees for flexible
    function classes in terms of generic complexity measures.'
  season: spring-2025
- id: ocis-2025-04-01-dylan-small
  url: https://youtu.be/xW-pKDS8VlU
  title: 'Exploration, Confirmation, and Replication in the Same Observational Study:
    A Two Team Cross-Screening Approach to Studying the Effect of Unwanted Pregnancy
    on Mothers’ Later Life Outcomes'
  speaker: Dylan Small
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-04-01'
  topic: causal_inference
  language: en
  discussant: Ying Jin
  slides: https://csap.yale.edu/sites/default/files/files/ds-qrmw-1-30-25.pdf
  abstract: The long term consequences of unwanted pregnancies carried to term on
    mothers have not been much explored. We use data from the Wisconsin Longitudinal
    Study (WLS) and propose a novel approach, namely two team cross-screening, to
    study the possible effects of unwanted pregnancies carried to term on various
    aspects of mothers’ later-life mental health, physical health, economic well-being
    and life satisfaction. Our method, unlike existing approaches to observational
    studies, enables the investigators to perform exploratory data analysis, confirmatory
    data analysis and replication in the same study– this is a valuable property when
    there is only a single data set available with unique strengths to perform exploratory,
    confirmatory and replication analysis. In two team cross-screening, the investigators
    split themselves into two teams and the data is split as well according to a meaningful
    covariate. Each team then performs exploratory data analysis on its part of the
    data to design an analysis plan for the other part of the data. The complete freedom
    of the teams in designing the analysis has the potential to generate new unanticipated
    hypotheses in addition to a prefixed set of hypotheses. Moreover, only the hypotheses
    that looked promising in the data each team explored are forwarded for analysis
    (thus alleviating the multiple testing problem). These advantages are demonstrated
    in our study of the effects of unwanted pregnancies on mothers’ later life outcomes.
    This is joint work with Samrat Roy, Marina Bogomolov, Ruth Heller, Tishra Beeson
    and Amy Claridge.
  season: spring-2025
- id: ocis-2025-03-25-guido-imbens
  url: https://youtu.be/6YuY-J3CXMI
  title: Identification of nonparametric factor models for average treatment effects
  speaker: Guido Imbens
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-03-25'
  topic: causal_inference
  language: en
  discussant: Bryan Graham
  slides: https://drive.google.com/file/d/1p5kk32LOkCuCSqjutpZNDLD0LjlzL3oH/view?usp=drive_link
  abstract: There is a growing literature on methods for estimating causal effects
    in settings with panel or longitudinal data using two-way-fixed-effect, linear
    factor, and synthetic control methods. These methods attempt to adjust for unobserved
    differences between units as well as unobserved differences over time. Many of
    these methods partly rely on functional form assumptions to allow for such adjustments.
    Here we propose a set up that does not involve functional form assumptions. We
    show that by matching units on a similarity distance we can find units that are
    comparable in terms of expected outcomes and use those units to consistently estimate
    average causal effects under a matrix version of standard ignorability conditions.
  season: winter-2025
- id: ocis-2025-03-18-alberto-abadie
  url: https://youtu.be/FeS9a_USwqA
  title: Synthetic Controls for Experimental Design
  speaker: Alberto Abadie
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-03-18'
  topic: causal_inference
  language: en
  discussant: Dmitry Arkhangelsky
  slides: https://economics.mit.edu/sites/default/files/2023-12/Synthetic%20Controls%20for%20Experimental%20Design.pdf
  abstract: This article studies experimental design in settings where the experimental
    units are large aggregate entities (e.g., markets), and only one or a small number
    of units can be exposed to the treatment. In such settings, randomization of the
    treatment may result in treated and control groups with very different characteristics
    at baseline, inducing biases. We propose a variety of experimental non-randomized
    synthetic control designs (Abadie, Diamond and Hainmueller, 2010, Abadie and Gardeazabal,
    2003) that select the units to be treated, as well as the untreated units to be
    used as a control group. Average potential outcomes are estimated as weighted
    averages of the outcomes of treated units for potential outcomes with treatment,
    and weighted averages the outcomes of control units for potential outcomes without
    treatment. We analyze the properties of estimators based on synthetic control
    designs and propose new inferential techniques. We show that in experimental settings
    with aggregate units, synthetic control designs can substantially reduce estimation
    biases in comparison to randomization of the treatment.
  season: winter-2025
- id: ocis-2025-03-11-katherine-a-keith
  url: https://youtu.be/uWHBJ35n4_8
  title: Proximal Causal Inference with Text Data
  speaker: Katherine A. Keith
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-03-11'
  topic: causal_inference
  language: en
  discussant: Naoki Egami
  slides: https://drive.google.com/file/d/1jW1zdszZz5EkJ1H0dzAPaMsjBp_4Ny-p/view?usp=drive_link
  abstract: Recent text-based causal methods attempt to mitigate confounding bias
    by estimating proxies of confounding variables that are partially or imperfectly
    measured from unstructured text data. These approaches, however, assume analysts
    have supervised labels of the confounders given text for a subset of instances,
    a constraint that is sometimes infeasible due to data privacy or annotation costs.
    In this work, we address settings in which an important confounding variable is
    completely unobserved. We propose a new causal inference method that uses two
    instances of pre-treatment text data, infers two proxies using two zero-shot models
    on the separate instances, and applies these proxies in the proximal g-formula.
    We prove, under certain assumptions about the instances of text and accuracy of
    the zero-shot predictions, that our method of inferring text-based proxies satisfies
    identification conditions of the proximal g-formula while other seemingly reasonable
    proposals do not. To address untestable assumptions associated with our method
    and the proximal g-formula, we further propose an odds ratio falsification heuristic
    that flags when to proceed with downstream effect estimation using the inferred
    proxies. We evaluate our method in synthetic and semi-synthetic settings—the latter
    with real-world clinical notes from MIMIC-III and open large language models for
    zero-shot prediction—and find that our method produces estimates with low bias.
    We believe that this text-based design of proxies allows for the use of proximal
    causal inference in a wider range of scenarios, particularly those for which obtaining
    suitable proxies from structured data is difficult.
  season: winter-2025
- id: ocis-2025-03-04-vasilis-syrgkanis
  url: https://youtu.be/ThSwOyrK5dg
  title: Detecting clinician implicit biases in diagnoses using proximal causal inference
  speaker: Vasilis Syrgkanis
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-03-04'
  topic: causal_inference
  language: en
  papers:
  - '2501.16399'
  discussant: Ilya Shpitser
  slides: https://docs.google.com/presentation/d/1-VUGr9a5YbBJu2hBpU1pADUP9L3yD9k9/edit?usp=sharing&ouid=103522914004166230828&rtpof=true&sd=true
  abstract: Clinical decisions to treat and diagnose patients are affected by implicit
    biases formed by racism, ableism, sexism, and other stereotypes. These biases
    reflect broader systemic discrimination in healthcare and risk marginalizing already
    disadvantaged groups. Existing methods for measuring implicit biases require controlled
    randomized testing and only capture individual attitudes rather than outcomes.
    However, the "big-data" revolution has led to the availability of large observational
    medical datasets, like EHRs and biobanks, that provide the opportunity to investigate
    discrepancies in patient health outcomes. In this work, we propose a causal inference
    approach to detect the effect of clinician implicit biases on patient outcomes
    in large-scale medical data. Specifically, our method uses proximal mediation
    to disentangle pathway-specific effects of a patient’s sociodemographic attribute
    on a clinician’s diagnosis decision. We test our method on real-world data from
    the UK Biobank. Our work can serve as a tool that initiates conversation and brings
    awareness to unequal health outcomes caused by implicit biases.
  season: winter-2025
- id: ocis-2025-02-25-young-researchers-seminar
  url: https://youtu.be/PAXimAZbkPM
  title: Multi-Domain Causal Representation Learning
  speaker: Young researchers' seminar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-02-25'
  topic: causal_inference
  language: en
  papers:
  - '2304.14545'
  slides: https://proceedings.neurips.cc/paper_files/paper/2023/file/67089958e98b243d5cc1881ad60418b8-Paper-Conference.pdf
  abstract: A key obstacle to more widespread use of causal models is requiring the
    relevant variables to be specified a priori. Yet, the causal relations of interest
    often do not occur at the level of raw observations such as pixels, but instead
    play out among abstract high-level latent concepts. Machine learning (ML) has
    proven successful at automatically extracting useful and compact representations
    of such complex data. Causal representation learning (CRL) aims to combine core
    strengths of ML and causality by learning representations in the form of latent
    variables endowed with causal structure and interventional semantics. In this
    talk, I will present two identifiability studies [1,2] for CRL from multiple domains
    or environments arising from interventions on the latent causal variables. In
    particular, we focus on the continuous, nonparametric case in which both the latent
    causal model and the mixing function are completely unconstrained. First, we introduce
    Causal Component Analysis (CauCA) [1], a generalization of independent component
    analysis (ICA), in which the causal graph is known but non-trivial. As a special
    case of CRL, CauCA provides insights into necessary assumptions; it also yields
    novel identifiability results for ICA. We then study the full CRL setting [2]
    with unknown graph and intervention targets and prove identifiability subject
    to a suitable notion of genericity or given coupled interventions.
  season: winter-2025
- id: ocis-2025-02-18-eric-tchetgen-tchetgen
  url: https://youtu.be/-ltDXMH9ZPA
  title: 'Revisiting Identification in the Binary Instrumental Variable Model: the
    NATE and Beyond'
  speaker: Eric Tchetgen Tchetgen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-02-18'
  topic: causal_inference
  language: en
  papers:
  - '2410.23590'
  slides: https://drive.google.com/file/d/16zYSKCLaLiPqR6cQO9PIf75u1t2_sErY/view?usp=drive_link
  abstract: This talk revisits the identification problem in the canonical binary
    instrumental variable model. The work reveals new conditions for the classical
    Wald ratio estimand (WR) to be endowed with a nonparametric causal interpretation.
    Specifically, we describe a straightforward set of conditions under which the
    Wald Ratio point identifies the Nudge Average Treatment Effect (NATE), defined
    as the average causal effect for the subgroup of units whose treatment can be
    manipulated by the instrument, a sub-group referred to as Nudge-able. Crucially,
    the nudge-able may include both compliers and defiers therefore obviating the
    need for the standard no-defier IV condition known to identify the Local Average
    Treatment Effect. Our key identification condition for the NATE is that any variability
    of the treatment effect induced by a hidden counfounder must be is uncorrelated
    with corresponding variability in the share of compliers among the Nudge-able.
    An important and easily interpretable sufficient condition for this assumption
    is that, although a priori unrestricted, the share of compliers within the subgroup
    of nudge-able units is balanced across strata of the unmeasured confounders. We
    will also describe various generalizations of our results, including new straightforward
    conditions for identification of the average treatment effect for the treated
    by a generalized Wald ratio estimand, together with new quasi-IV identification
    results with an imperfect instrument which violates the exclusion restriction
    assumption.
  season: winter-2025
- id: ocis-2025-02-11-corwin-zigler
  url: https://youtu.be/Lj-oRwvspsY
  title: Causal health impacts of power plant emission controls under modeled and
    uncertain physical process interference
  speaker: Corwin Zigler
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-02-11'
  topic: causal_inference
  language: en
  discussant: Fredrik Sävje
  slides: https://drive.google.com/file/d/1SbJ76PTQ31v0Alr9uyuwKrzf7yLUeqFQ/view?usp=share_link
  abstract: 'Causal inference with spatial environmental data is often challenging
    due to the presence of interference: outcomes for observational units depend on
    some combination of local and nonlocal treatment. This is especially relevant
    when estimating the effect of power plant emissions controls on population health,
    as pollution exposure is dictated by: (i) the location of point-source emissions
    as well as (ii) the transport of pollutants across space via dynamic physical-chemical
    processes. In this work we estimate the effectiveness of air quality interventions
    at coal-fired power plants in reducing two adverse health outcomes in Texas in
    2016: pediatric asthma ED visits and Medicare all-cause mortality. We develop
    methods for causal inference with interference when the underlying network structure
    is not known with certainty and instead must be estimated from ancillary data.
    Notably, uncertainty in the interference structure is propagated to the resulting
    causal effect estimates. We offer a Bayesian, spatial mechanistic model for the
    interference mapping, which we combine with a flexible nonparametric outcome model
    to marginalize estimates of causal effects over uncertainty in the structure of
    interference. Our analysis finds some evidence that emissions controls at upwind
    power plants reduce asthma ED visits and all-cause mortality; however, accounting
    for uncertainty in the interference renders the results largely inconclusive.'
  season: winter-2025
- id: ocis-2025-02-04-michal-koles-r
  url: https://youtu.be/KUOpFA5QLhc
  title: Evaluating Counterfactual Policies Using Instruments
  speaker: Michal Kolesár
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-02-04'
  topic: causal_inference
  language: en
  discussant: Edward Vytlacil
  slides: https://drive.google.com/file/d/1sEuvbxExTj8qEOyhACzIXlOvbRaQjJ-J/view?usp=sharing
  abstract: In settings with instrumental variables, the TSLS estimator is the most
    popular way of summarizing causal evidence. Yet in many settings, the instrument
    monotonicity assumption needed for its causal interpretation is refuted. A prominent
    example are designs using the (quasi-)random assignment of defendants to judges
    as an instrument for incarceration. But ultimately, we may not be interested in
    the TSLS estimand itself, but rather in the impact of some counterfactual policy
    intervention (e.g. an encouragement to release more defendants). In this paper,
    we derive tractable sharp bounds on the impact of such counterfactual policies
    under reasonable sets of assumptions. We show that for a variety of common policy
    exercises, the bounds do not depend on whether one imposes instrument monotonicity,
    and thus one can drop this often-tenuous assumption without loss of information.
    We explore other restrictions that can help to tighten the bounds, including the
    policy invariance assumption commonly used in applications of the marginal treatment
    effects framework and its relaxations. We illustrate the usefulness of this approach
    in an application involving the quasi-random assignment of prosecutors to defendants
    in Massachusetts.
  season: winter-2025
- id: ocis-2025-01-28-anne-helby-petersen
  url: https://youtu.be/KfqEZdQwz2M
  title: What are we discovering? Two perspectives on interpretable evaluation of
    causal discovery algorithms
  speaker: Anne Helby Petersen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-01-28'
  topic: causal_inference
  language: en
  papers:
  - '2412.10039'
  discussant: Vanessa Didelez
  slides: https://drive.google.com/file/d/18QggMdJfRmj4mEY1EO7CYuylo4tpETzP/view?usp=share_link
  abstract: 'Causal discovery algorithms aim to recover (parts) of causal data generating
    mechanism by analyzing empirical data they generated. Methodological research
    on causal discovery has been immensely productive, but a standard practice for
    evaluating performance has still not been established. It is therefore difficult
    to understand what algorithms may be most suited for what tasks, and what performance
    we can expect on real data. Evaluating performance of causal discovery algorithms
    can be divided into two questions: First, how well do the algorithms perform in
    an (artificial) controlled environment, where the true data generating mechanism
    is assumed to be known? And secondly, do they provide useful information in real
    world applications? As an example of how the second question may be adressed,
    I present a case-based study that compares graphs found using causal discovery
    algorithms with DAGs constructed by experts in a life coure epidemiologic study
    [1]. For the first question, I propose using random guessing as a common, interpretable
    baseline for evaluating causal discovery algorithms [2]. I provide mathematical
    insights into expected behavior of commonly used evaluation approaches under random
    guessing, as well as simulation-based generalizations. I furthermore showcase
    how use of negative controls enhance interpretability of classic causal discovery
    evaluation designs, including the study in [1].'
  season: winter-2025
- id: ocis-2025-01-21-davide-viviano
  url: https://youtu.be/PUod1h8OywA
  title: Program Evaluation with Remotely Sensed Outcomes
  speaker: Davide Viviano
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-01-21'
  topic: causal_inference
  language: en
  papers:
  - '2411.10959'
  discussant: Hyunseung Kang
  slides: https://drive.google.com/file/d/1L5kIyczLmAgKD15MzUVSdgHVGnCBE0pi/view?usp=sharing
  abstract: 'While traditional program evaluations typically rely on surveys to measure
    outcomes, certain economic outcomes such as living standards or environmental
    quality may be infeasible or costly to collect. As a result, recent empirical
    work estimates treatment effects using remotely sensed variables (RSVs), such
    mobile phone activity or satellite images, instead of ground-truth outcome measurements.
    Common practice predicts the economic outcome from the RSV, using an auxiliary
    sample of labeled RSVs, and then uses such predictions as the outcome in the experiment.
    We prove that this approach leads to biased estimates of treatment effects when
    the RSV is a post-outcome variable. We nonparametrically identify the treatment
    effect, using an assumption that reflects the logic of recent empirical research:
    the conditional distribution of the RSV remains stable across both samples, given
    the outcome and treatment. Our results do not require researchers to know or consistently
    estimate the relationship between the RSV, outcome, and treatment, which is typically
    mis-specified with unstructured data. We form a representation of the RSV for
    downstream causal inference by predicting the outcome and predicting the treatment,
    with better predictions leading to more precise causal estimates. We re-evaluate
    the efficacy of a large-scale public program in India, showing that the program’s
    measured effects on local consumption and poverty can be replicated using satellite
    imagery.'
  season: winter-2025
- id: ocis-2025-01-14-qingyuan-zhao
  url: https://youtu.be/cjYEionaRGQ
  title: On statistical and causal models associated with acyclic directed mixed graphs
  speaker: Qingyuan Zhao
  venue: OCIS (Online Causal Inference Seminar)
  date: '2025-01-14'
  topic: causal_inference
  language: en
  papers:
  - '2501.03048'
  discussant: Thomas Richardson
  slides: https://drive.google.com/file/d/115xxL7Bb7LkNfKzWx3ukPYglnqLl7Z12/view?usp=sharing
  abstract: Causal models in statistics are often described using acyclic directed
    mixed graphs (ADMGs), which contain directed and bidirected edges and no directed
    cycles. This article surveys various interpretations of ADMGs, discusses their
    relations in different sub-classes of ADMGs, and argues that one of them -- nonparametric
    equation system (the E model below) -- should be used as the default interpretation.
    The E model is closely related to but different from the interpretation of ADMGs
    as directed acyclic graphs (DAGs) with latent variables that is commonly found
    in the literature. Our endorsement of the E model is based on two observations.
    First, in a subclass of ADMGs called unconfounded graphs (which retain most of
    the good properties of directed acyclic graphs and bidirected graphs), the E model
    is equivalent to many other interpretations including the global Markov and nested
    Markov models. Second, the E model for an arbitrary ADMG is exactly the union
    of that for all unconfounded expansions of that graph. This property is referred
    to as completeness, as it shows that the model does not commit to any specific
    latent variable explanation. In proving that the E model is nested Markov, we
    also develop an ADMG-based theory for causality. Finally, we criticize the common
    interpretation of ADMG as a convenient shortcut to represent some unspecified
    large causal DAG that generate the data. We argue that the "latent DAG" interpretation
    is mathematically unnecessary, makes obscure ontological assumptions, and discourages
    practitioners from deliberating over important structural assumptions.
  season: winter-2025
- id: ocis-2024-12-10-panos-toulis-wenxuan-guo
  url: https://youtu.be/4x0vbIjd5hk
  title: ML-assisted Randomization Tests for Complex Treatment Effects in A/B Experiments
  speaker: Panos Toulis, Wenxuan Guo
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-12-10'
  topic: causal_inference
  language: en
  discussant: Xinran Li
  slides: https://drive.google.com/file/d/1Tn6wumTa8t_h1tjNZtxI-Z3sclffPQ0Z/view?usp=share_link
  abstract: Experimentation is widely used for causal inference and data-driven decision
    making across disciplines. In an A/B experiment, for example, a business randomizes
    two different treatments (e.g., website designs) to their customers and then aims
    to infer which treatment is better. In this paper, we construct randomization
    tests for complex treatment effects, including heterogeneity and interference.
    A key feature of our approach is the use of flexible machine learning (ML) models,
    where the ANOVA-like test statistic is defined as the difference between the cross-validation
    errors from two ML models, one including the treatment variable and the other
    without it. This approach combines the predictive power of modern ML tools with
    the finite-sample validity of the randomization framework, enabling a robust and
    efficient way to perform causal inference in experimental settings. We demonstrate
    this combined benefit both theoretically and empirically through applied examples.
  season: fall-2024
- id: ocis-2024-12-03-yiqing-xu
  url: https://youtu.be/NzFFlXxkloE?si=j9M8cXb6EJHduaq4
  title: Factorial Difference-in-Differences
  speaker: Yiqing Xu
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-12-03'
  topic: causal_inference
  language: en
  papers:
  - '2407.11937'
  discussant: Erin Hartman
  slides: https://drive.google.com/file/d/1ZjJVfQbdGnbXpuNr0YkiDFPiijJxctXu/view?usp=sharing
  abstract: 'In many social science applications, researchers use the difference-in-differences
    (DID) estimator to establish causal relationships, exploiting cross-sectional
    variation in a baseline factor and temporal variation in exposure to an event
    that presumably may affect all units. This approach, which we term factorial DID
    (FDID), differs from canonical DID in that it lacks a clean control group unexposed
    to the event after the event occurs. In this paper, we clarify FDID as a research
    design in terms of its data structure, feasible estimands, and identifying assumptions
    that allow the DID estimator to recover these estimands. We frame FDID as a factorial
    design with two factors: the baseline factor, denoted by G, and the exposure level
    to the event, denoted by Z, and define the effect modification and causal interaction
    as the associative and causal effects of G on the effect of Z, respectively. We
    show that under the canonical no anticipation and parallel trends assumptions,
    the DID estimator identifies only the effect modification of G in FDID, and propose
    an additional factorial parallel trends assumption to identify the causal interaction.
    Moreover, we show that the canonical DID research design can be reframed as a
    special case of the FDID research design with an additional exclusion restriction
    assumption, thereby reconciling the two approaches. We extend this framework to
    allow conditionally valid parallel trends assumptions and multiple time periods,
    and clarify assumptions required to justify regression analysis under FDID. We
    illustrate these findings with empirical examples from economics and political
    science, and provide recommendations for improving practice and interpretation
    under FDID. This is joint work with Anqi Zhao and Peng Ding.'
  season: fall-2024
- id: ocis-2024-11-19-jared-s-murray
  url: https://youtu.be/raHavd2FtbY
  title: 'A Unifying Weighting Perspective on Causal Machine Learning: Kernel Methods,
    Gaussian Processes, and Bayesian Tree Models'
  speaker: Jared S. Murray
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-11-19'
  topic: causal_inference
  language: en
  discussant: Rahul Singh
  abstract: 'Causal machine learning methods based on kernel methods are powerful
    tools for estimating heterogeneous treatment effects; examples include kernel
    ridge regression, (causal) random forests, and many neural networks. A known but
    underappreciated result is that many of these methods have an equivalent representation
    as weighting estimators, with weights that correspond to an estimate of the Riesz
    representer of the estimand. This paper catalogs results about the weighting representation
    of heterogenous effect estimates under kernel ridge regression estimates of outcome
    models, and we provide new results about kernel ridge estimates that incorporate
    propensity scores in the spirit of the Robinson ``regression-on-residuals''''
    transformation. We show that under mild conditions, these R-parameterized outcome
    models produce implied weights that approximately balance broad classes of functions
    between treated and control groups when estimating the average treatment effect
    in {\em any} target population -- even under some forms of outcome model misspecification.
    This result connects the desirable properties of the Robinson transform and its
    corresponding Neyman orthogonal score/risk functions to the balancing properties
    of the implied weights. We also show that this balancing property is generally
    insufficient to completely debias estimates even if the outcome model is correctly
    specified. We characterize the remaining bias via ``target imbalance'''': the
    difference between means in the model-implied target population and the actual
    target population. We propose broadly applicable debiasing strategies that remain
    inside the outcome modeling framework. Finally, we show that many of these results
    translate to the R-learner with linear smoothers, which is also a weighting estimator.
    We then extend our results to a large class of Bayesian nonparametric models used
    in causal machine learning via their representation as conditional Gaussian process
    (GP) regression models. Examples include BART, Bayesian causal forests, high-dimensional
    Bayesian regression with shrinkage or selection priors, many Bayesian neural networks,
    and other generic GP regression models. We use the connection between GP and kernel
    ridge regression to compute and interpret the model-implied weights. Their form
    sheds new light on why Bayesian tree models are especially effective for estimating
    heterogeneous effects. Finally, we leverage the implied weighting representation
    to introduce new tools for diagnosing violations of causal assumptions, model
    criticism, and method comparisons.'
  season: fall-2024
- id: ocis-2024-11-12-tianchen-qian
  url: https://youtu.be/0IIz6EFjqwY?si=BZXvfT3WAd4xPTQe
  title: Causal inference and machine learning in mobile health – modeling time-varying
    effects using longitudinal functional data
  speaker: Tianchen Qian
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-11-12'
  topic: causal_inference
  language: en
  papers:
  - '2410.12151'
  discussant: Walter Dempsey
  slides: https://drive.google.com/file/d/171kFIxQ-FQqVBp8wH3l5JLVU8xYgHD5y/view?usp=sharing
  abstract: To optimize mobile health interventions and advance domain knowledge on
    intervention design, it is critical to understand how the intervention effect
    varies over time and with contextual information. This study aims to assess how
    a push notiﬁcation suggesting physical activity inﬂuences individuals’ step counts
    using data from the HeartSteps micro-randomized trial (MRT). The statistical challenges
    include the time-varying treatments and longitudinal functional step count measurements.
    We propose the ﬁrst semiparametric causal excursion effect model with varying
    coefﬁcients to model the time-varying effects within a decision point and across
    decision points in an MRT. The proposed model incorporates double time indices
    to accommodate the longitudinal functional outcome, enabling the assessment of
    time-varying effect moderation by contextual variables. We propose a two-stage
    causal effect estimator that is robust against a misspeciﬁed high-dimensional
    outcome regression nuisance model. We establish asymptotic theory and conduct
    simulation studies to validate the proposed estimator. Our analysis provides new
    insights into individuals’ change in response proﬁles (such as how soon a response
    occurs) due to the activity suggestions, how such changes differ by the type of
    suggestions received, and how such changes depend on other contextual information
    such as being recently sedentary and the day being a weekday.
  season: fall-2024
- id: ocis-2024-10-29-toru-kitagawa
  url: https://youtu.be/PTY8O-6lbY4
  title: Policy Choice in Time-Series by Empirical Welfare Maximization
  speaker: Toru Kitagawa
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-10-29'
  topic: causal_inference
  language: en
  papers:
  - '2205.03970'
  discussant: Mikkel Plagborg-Moller
  slides: https://drive.google.com/file/d/1Pd_zMSABA0uSqJMQ8j6-y0Zu7L9BkZ4i/view?usp=drive_link
  abstract: This paper develops a novel method for policy choice in a dynamic setting
    where the available data is a multivariate time series. Building on the statistical
    treatment choice framework, we propose Time-series Empirical Welfare Maximization
    (T-EWM) methods to estimate an optimal policy rule for the current period or over
    multiple periods by maximizing an empirical welfare criterion constructed using
    nonparametric potential outcome time-series. We characterize conditions under
    which T-EWM consistently learns a policy choice that is optimal in terms of conditional
    welfare given the time-series history. We then derive a nonasymptotic upper bound
    for conditional welfare regret and its minimax lower bound. To illustrate the
    implementation and uses of T-EWM, we perform simulation studies and apply the
    method to estimate optimal monetary policy rules from macroeconomic time-series
    data.
  season: fall-2024
- id: ocis-2024-10-22-alexis-bellot
  url: https://youtu.be/15odVeek524?si=NW_zvhOmf_A6ybcY
  title: Partial Transportability for Domain Generalization
  speaker: Alexis Bellot
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-10-22'
  topic: causal_inference
  language: en
  discussant: Adam Li
  slides: https://causalai.net/r88.pdf
  abstract: A fundamental task in AI is providing performance guarantees for predictions
    made in unseen domains. In practice, there can be substantial uncertainty about
    the distribution of new data, and corresponding variability in the performance
    of existing predictors. For example, a risk prediction tool fine-tuned on a patient
    population (e.g. particular hospital, geographic location) may not be equally
    optimal if deployed on a different patient population that may differ in several
    aspects. This talk studies this problem through the lens of partial transportability,
    that combines data from source domains and assumptions about the data generating
    mechanisms, encoded in causal diagrams, to provide a guarantee on out-of-distribution
    performance of classification models. We will show that one may consistently predict
    the worst-case performance of existing classification models, and that, further,
    one may train classification models to explicitly optimize for worst-case performance
    in a target domain, under our assumptions. Both these methods may be parameterized
    with expressive neural networks and implemented with gradient-based optimization
    schemes. With these results, we hope to provide a fresh perspective on the problem
    of transfer learning and domain generalization in machine learning.
  season: fall-2024
- id: ocis-2024-10-15-oliver-dukes
  url: https://youtu.be/wNAUHprgX2E
  title: Nonparametric tests of treatment effect homogeneity for policy-makers
  speaker: Oliver Dukes
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-10-15'
  topic: causal_inference
  language: en
  papers:
  - '2410.00985'
  discussant: Edward Kennedy
  slides: https://drive.google.com/file/d/19YE3UtRGxiq5C-FlW_lJpIEF_vWGztTG/view?usp=sharing
  abstract: Recent work has focused on nonparametric estimation of conditional treatment
    effects, but inference has remained relatively unexplored. We propose a class
    of nonparametric tests for both quantitative and qualitative treatment effect
    heterogeneity. The tests can incorporate a variety of structured assumptions on
    the conditional average treatment effect, allow for both continuous and discrete
    covariates, and do not require sample splitting. Furthermore, we show how the
    tests are tailored to detect alternatives where the population impact of adopting
    a personalized decision rule differs from using a rule that discards covariates.
    The proposal is thus relevant for guiding treatment policies. The utility of the
    proposal is borne out in simulation studies and a re-analysis of an AIDS clinical
    trial. This is joint work with Mats Stensrud, Riccardo Brioschi and Aaron Hudson.
  season: fall-2024
- id: ocis-2024-10-01-anish-agarwal
  url: https://youtu.be/o_rHksAzXCg
  title: 'Synthetic Combinations: A Causal Inference Framework for Combinatorial Interventions'
  speaker: Anish Agarwal
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-10-01'
  topic: causal_inference
  language: en
  papers:
  - '2303.14226'
  discussant: Christina Lee Yu
  slides: https://drive.google.com/file/d/1JTOlUnK0XI_FDy-HdrWVCM528QtEQfhL/view?usp=share_link
  abstract: We consider a setting where there are N heterogeneous units and p interventions.
    Our goal is to learn unit-specific potential outcomes for any combination of these
    p interventions, i.e., N×2^p causal parameters. Choosing a combination of interventions
    is a problem that naturally arises in a variety of applications such as factorial
    design experiments and recommendation engines (e.g., showing a set of movies that
    maximizes engagement for a given user). Running N×2^p experiments to estimate
    the various parameters is likely expensive and/or infeasible as N and p grow.
    Further, with observational data there is likely confounding, i.e., whether or
    not a unit is seen under a combination is correlated with its potential outcome
    under that combination. We study this problem under a novel model that imposes
    latent structure across both units and combinations of interventions. Specifically,
    we assume latent similarity in potential outcomes across units (i.e., the matrix
    of potential outcomes is approximately rank r) and regularity in how combinations
    of interventions interact (i.e., the coefficients in the Fourier expansion of
    the potential outcomes is approximately s sparse). We establish identification
    for all N×2^p parameters despite unobserved confounding. We propose an estimation
    procedure, Synthetic Combinations, and establish finite-sample consistency under
    precise conditions on the observation pattern. We show that Synthetic Combinations
    is able to consistently estimate unit-specific potential outcomes given a total
    of poly(r)×(N+s^{2}p) observations. In comparison, previous methods that do not
    exploit structure across both units and combinations have poorer sample complexity
    scaling as min(N×s^{2}p, r×(N+2^p)).
  season: fall-2024
- id: ocis-2024-06-04-wang-miao
  url: https://youtu.be/gyxzf09JYzU
  title: 'Introducing the specificity score: a measure of causality beyond P value'
  speaker: Wang Miao
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-06-04'
  topic: causal_inference
  language: en
  discussant: Qingyuan Zhao
  abstract: There is considerable debate about P value in scientific research and
    its use is banished in several prestigious journals in recent years. Particularly
    in observational studies where confounding or selection bias arises, P value as
    a measure of statistical significance fails to capture the causal association
    of scientific interest, and could lead to false or trivial scientific discoveries.
    In this talk, I will introduce a specificity score for testing the existence of
    causal effects in the presence of unmeasured confounding. The specificity score
    measures how extreme the observed association is when compared to the confounding
    bias. A large specificity score means the observed association cannot be explained
    away by confounding and is thus evidence of causality. Under certain conditions,
    the specificity test has controlled type I error and power approaching unity for
    testing the null hypothesis of no causal effect. This approach only entails certain
    rough information on the broadness of the causal associations in sight, but does
    not require the availability of auxiliary variables. This approach admits joint
    causal discovery with multiple treatments and multiple outcomes, which is particularly
    suitable for gene expressions studies, Mendelian randomization and EHR studies.
    A visualization approach using a heatmap of specificity is used to communicate
    all specificity score/test information in a universal and effective manner. The
    specificity score is related to Hill’s specificity criterion for causal inference,
    but I will discuss the differences from Hill’s. Simulations are used for illustration
    and an application to a mouse obesity dataset detects potential active effects
    of genes on clinical traits that are relevant to metabolic syndrome.
  season: spring-2024
- id: ocis-2024-05-28-rodrigo-pinto
  url: https://youtu.be/fz4ZWsCiM6Q
  title: What is causality? How to express it? And why it matters
  speaker: Rodrigo Pinto
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-05-28'
  topic: causal_inference
  language: en
  papers:
  - '2211.08209'
  discussant: Ilya Shpitser
  slides: https://drive.google.com/file/d/11PxtA9cTzTJV1Q7GaCJHKXwWYbcD-Cpf/view?usp=sharing
  abstract: 'Causality is a well-studied concept in economics, yet effective causal
    analysis necessitates tools beyond traditional statistics and probability theory.
    Economists have historically employed structural equations and causal tools for
    this purpose. Alongside this traditional approach, several frameworks have been
    developed to address and manipulate causal inquiries. This paper explores the
    advantages and drawbacks of three prominent approaches: Haavelmo''s Hypothetical
    Model Approach, the Language of Potential Outcomes (Rubin and co-authors), and
    Do-calculus (Pearl and co-authors). By critically examining these methodologies,
    we aim to highlight their respective strengths and limitations, providing a comprehensive
    understanding of their applications in economic causal analysis.'
  season: spring-2024
- id: ocis-2024-04-30-hyunseung-kang
  url: https://youtu.be/WzH2YzaVQx0
  title: 'Transfer Learning Between U.S. Presidential Elections: How much can we learn
    from a 2020 ad campaign to inform 2024 elections?'
  speaker: Hyunseung Kang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-04-30'
  topic: causal_inference
  language: en
  discussant: Melody Huang
  slides: https://drive.google.com/file/d/1XgoVvSFh-tm9s0aShds7Yaq7DYe9e4ds/view?usp=sharing
  abstract: 'In the 2020 U.S presidential election, Aggarwal et al. (2023) ran a large-scale,
    randomized experiment to analyze the impact of an online ad campaign on voter
    turnout and found that the overall impact was “effectively equivalent to zero."
    As the 2024 election approaches, a natural question to ask is whether a similar
    ad campaign would remain ineffective during this election. Despite some similarities
    between 2020 and 2024, such as the same presumptive candidates and concerns about
    the economy, differences like COVID-19, concerns about immigration, and overturning
    of Roe v. Wade exist, which raises the broader question: how much can we learn
    from past ad campaigns to inform future ad campaigns? In this ongoing work, we
    lay out a transfer learning framework to address this question. Two major features
    of our framework are that we do not assume (a) the transportability assumption,
    which roughly states that the differences between the 2020 and the 2024 elections
    can be adjusted by a common set of covariates, and (b) the same set of covariates
    are measured between the two elections. Instead, we present a sensitivity analysis
    framework that provide a plausible range of effects of future ad campaigns based
    on past ad campaigns and allow the covariates to be different between elections.
    Under our framework, we develop two nonparametric estimators, one of which is
    rooted in the study design, derive a bootstrap approach to conduct inference,
    and establish some inferential guarantees. We also present simple ways to calibrate
    and ultimately, demystify sensitivity parameters for interpretability. We conclude
    with some preliminary results about the plausible range of effects of running
    an ad campaign during the 2024 U.S. presidential election. This is joint work
    with Xinran Miao (UW-Madison) and Jiwei Zhao (UW-Madison).'
  season: spring-2024
- id: ocis-2024-04-16-mihaela-van-der-schaar
  url: https://youtu.be/P-GxxhhcLUo
  title: 'The (Causal) Discovery Ladder: Unravelling Governing Equations and Beyond
    using Machine Learning'
  speaker: Mihaela van der Schaar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-04-16'
  topic: causal_inference
  language: en
  papers:
  - '2002.04083'
  slides: https://drive.google.com/file/d/1Y3s5gzw-I-K7F1g75i_i3oYAOkaKSbVV/view?usp=sharing
  season: spring-2024
- id: ocis-2024-04-09-chao-ma
  url: https://youtu.be/cnz17Q6g6Lw
  title: 'Towards Causal Foundation Model: on Duality between Causal Inference and
    Attention'
  speaker: Chao Ma
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-04-09'
  topic: causal_inference
  language: en
  discussant: Jiaqi Zhang
  abstract: Foundation models have brought changes to the landscape of machine learning,
    demonstrating sparks of human-level intelligence across a diverse array of tasks.
    However, a gap persists in complex tasks such as causal inference, primarily due
    to challenges associated with intricate reasoning steps and high numerical precision
    requirements. In this work, we take a first step towards building causally-aware
    foundation models for complex tasks. We propose a novel, theoretically sound method
    called Causal Inference with Attention (CInA), which utilizes multiple unlabeled
    datasets to perform self-supervised causal learning, and subsequently enables
    zero-shot causal inference on unseen tasks with new data. This is based on our
    theoretical results that demonstrate the primal-dual connection between optimal
    covariate balancing and self-attention, facilitating zero-shot causal inference
    through the final layer of a trained transformer-type architecture. We demonstrate
    empirically that our approach CInA effectively generalizes to out-of-distribution
    datasets and various real-world datasets, matching or even surpassing traditional
    per-dataset causal inference methodologies.
  season: spring-2024
- id: ocis-2024-04-02-kosuke-imai
  url: https://youtu.be/DSAcBPsoPa4
  title: The Cram Method for Efficient Simultaneous Learning and Evaluation
  speaker: Kosuke Imai
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-04-02'
  topic: causal_inference
  language: en
  discussant: 'Rui Song and Hengrui Cai - Q&A moderator: Michael Li'
  slides: https://imai.fas.harvard.edu/talk/files/OnlineCausal24.pdf
  abstract: We introduce the `cram' method, a general and efficient approach to simultaneous
    learning and evaluation using a generic machine learning (ML) algorithm. In a
    single pass of batched data, the proposed method repeatedly trains an ML algorithm
    and tests its empirical performance. Because it utilizes the entire sample for
    both learning and evaluation, cramming is significantly more data-efficient than
    sample-splitting. The cram method also naturally accommodates online learning
    algorithms, making its implementation computationally efficient. To demonstrate
    the power of the cram method, we consider the standard policy learning setting
    where cramming is applied to the same data to both develop an individualized treatment
    rule (ITR) and estimate the average outcome that would result if the learned ITR
    were to be deployed. We show that under a minimal set of assumptions, the resulting
    crammed evaluation estimator is consistent and asymptotically normal. While our
    asymptotic results require a relatively weak stabilization condition of ML algorithm,
    we develop a simple, generic method that can be used with any policy learning
    algorithm to satisfy this condition. Our extensive simulation studies show that,
    when compared to sample-splitting, cramming reduces the evaluation standard error
    by more than 40\% while improving the performance of learned policy. We also apply
    the cram method to a randomized clinical trial to demonstrate its applicability
    to real-world problems. Finally, we briefly discuss future extensions of the cram
    method to other learning and evaluation settings.
  season: spring-2024
- id: ocis-2024-03-26-krikamol-muandet
  url: https://youtu.be/uiFdGZcKbSY
  title: A Measure-Theoretic Axiomatisation of Causality
  speaker: Krikamol Muandet
  venue: OCIS (Online Causal Inference Seminar)
  date: '2024-03-26'
  topic: causal_inference
  language: en
  papers:
  - '2305.17139'
  discussant: 'Ricardo Silva - Q&A moderator: Junhyung Park'
  slides: https://drive.google.com/file/d/1bmT27qVWDvYJ94RGVD17kl7iQq4OYaS2/view?usp=sharing
  abstract: Causality is a central concept in a wide range of research areas, yet
    there is still no universally agreed axiomatisation of causality. We view causality
    both as an extension of probability theory and as a study of \textit{what happens
    when one intervenes on a system}, and argue in favour of taking Kolmogorov's measure-theoretic
    axiomatisation of probability as the starting point towards an axiomatisation
    of causality. To that end, we propose the notion of a \textit{causal space}, consisting
    of a probability space along with a collection of transition probability kernels,
    called \textit{causal kernels}, that encode the causal information of the space.
    Our proposed framework is not only rigorously grounded in measure theory, but
    it also sheds light on long-standing limitations of existing frameworks including,
    for example, cycles, latent variables and stochastic processes.
  season: winter-2024
