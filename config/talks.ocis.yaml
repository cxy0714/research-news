- id: ocis-2020-10-27-david-blei
  url: https://www.youtube.com/watch?v=M30Mw4MYLWM
  title: 'The Deconfounder: What is it? What is its theory? Is it useful?'
  speaker: David Blei
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-10-27'
  topic: causal_inference
  language: en
  papers:
  - '2003.04948'
  discussant: Guido Im bens
  slides: https://drive.google.com/file/d/1_aqUCejz2u2owmoQ9grwb10C-FCuNxr1/view?usp=sharing
  abstract: I will discuss the deconfounder algorithm and the assumptions it requires.
    Several refinements have been suggested around the theory of the deconfounder.
    Among these, Imai and Jiang clarified the assumption of "no unobserved single-cause
    confounders." Using their assumption, I will clarify the theory. Finally, I will
    discuss whether the deconfounder is useful in practice. This talk will largely
    follow Wang and Blei (2020).
  season: fall-2020
- id: ocis-2020-10-12-interview-with-esther-duflo
  url: https://www.youtube.com/watch?v=WWW9q3oMYxU&feature=youtu.be
