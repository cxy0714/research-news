  abstract: Asking for the “root cause(s)” of a singular event is at the heart of
    human attempts to understand what happened. Nevertheless, we were not able to
    find a satisfactory formalization of “Root Cause Analysis (RCA)” for our business.
    We have therefore proposed a framework for RCA of anomalies [ 1
  season: fall-2022
- id: ocis-2022-06-28-samuel-wang
  url: https://youtu.be/YxgG35kDbR4
  title: '- Uncertainty Quantification for Causal Discovery'
  speaker: Samuel Wang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-06-28'
  topic: causal_inference
  language: en
  discussant: Daniel Malinsky
  slides: https://drive.google.com/file/d/1-m7PpD92S7JTI3T_HnR01ppKvzI32NEP/view?usp=sharing
  abstract: Causal discovery procedures are popular methods for discovering causal
    structure across the physical, biological, and social sciences. However, most
    procedures for causal discovery only output a single estimated causal model or
    single equivalence class of models. In this work, we propose a procedure for quantifying
    uncertainty in causal discovery. Specifically, we consider structural equation
    models where a unique graph can be identified and propose a procedure which returns
    a confidence sets of causal orderings which are not ruled out by the data. We
    show that asymptotically, a true causal ordering will be contained in the returned
    set with some user specified probability. In addition, the confidence set can
    be used to form conservative sets of ancestral relationships.
  season: spring-2022
- id: ocis-2022-06-14-amiremad-ghassami
  url: https://youtu.be/uVfEo9UuC20
  title: Johns Hopkins University ) - Combining Experimental and Observational Data
    for Identification and Estimation of Long-Term Causal Effects
  speaker: AmirEmad Ghassami (
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-06-14'
  topic: causal_inference
  language: en
  papers:
  - '2201.10743'
  discussant: Guido Imbens
  slides: https://drive.google.com/file/d/1NW1ggfyFz7qhiIhod0AUwuDtKgyyD2Mg/view?usp=sharing
  abstract: We consider the task of identifying and estimating the causal effect of
    a treatment variable on a long-term outcome variable using data from an observational
    domain and an experimental domain. The observational domain is subject to unobserved
    confounding. Furthermore, subjects in the experiment are only followed for a short
    period of time; hence, long-term effects of treatment are unobserved but short-term
    effects will be observed. Therefore, data from neither domain alone suffices for
    causal inference about the effect of the treatment on the long-term outcome, and
    must be pooled in a principled way, instead. Athey et al. (2020) proposed a method
    for systematically combining such data for identifying the downstream causal effect
    in view. Their approach is based on the assumptions of internal and external validity
    of the experimental data, and an extra novel assumption called latent unconfoundedness.
    In this paper, we first review their proposed approach, and then we propose three
    alternative approaches for data fusion for the purpose of identifying and estimating
    average treatment effect as well as the effect of treatment on the treated. Our
    first approach is based on assuming equi-confounding bias for the short-term and
    long-term outcomes. Our second approach is based on a relaxed version of the equi-confounding
    bias assumption, where we assume the existence of an observed confounder such
    that the short-term and long-term potential outcome variables have the same partial
    additive association with that confounder. Our third approach is based on the
    proximal causal inference framework, in which we assume the existence of an extra
    variable in the system which is a proxy of the latent confounder of the treatment-outcome
    relation. We propose influence function-based estimation strategies for each of
    our data fusion frameworks and study the robustness properties of the proposed
    estimators.
  season: spring-2022
- id: ocis-2022-06-07-mona-azadkia
  url: https://youtu.be/ikHRbNLjYdc
  title: '- A Fast Non-parametric Approach for Causal Structure Learning in Polytrees'
  speaker: Mona Azadkia
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-06-07'
  topic: causal_inference
  language: en
  papers:
  - '2111.14969'
  discussant: Bryon Aragam
  slides: https://drive.google.com/file/d/1e9tgRtVsG-nNTwChsxvUF_E_l6IkVkui/view?usp=sharing
  abstract: We study the problem of causal structure learning with no assumptions
    on the functional relationships and noise. We develop DAG-FOCI, a computationally
    fast algorithm for this setting that is based on the FOCI variable selection algorithm
    in (Azadkia 2021). DAG-FOCI requires no tuning parameter and outputs the parents
    and the Markov boundary of a response variable of interest. We provide high-dimensional
    guarantees of our procedure when the underlying graph is a polytree. Furthermore,
    we demonstrate the applicability of DAG-FOCI on real data from computational biology
    (Sachs et al., 2005) and illustrate the robustness of our methods to violations
    of assumptions.
  season: spring-2022
- id: ocis-2022-05-31-bin-yu
  url: https://youtu.be/4e2EFrOUGfE
  title: '- Predictability, stability, and causality with a case study to find genetic
    drivers of a heart disease'
  speaker: Bin Yu
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-05-31'
  topic: causal_inference
  language: en
  discussant: Jas Sekhon -
  slides: https://drive.google.com/file/d/13DGK_eu2txQQhtOcszm41M3MwJauxFBR/view?usp=sharing
  abstract: '"A.I. is like nuclear energy -- both promising and dangerous" -- Bill
    Gates, 2019. Data Science is a pillar of A.I. and has driven most of recent cutting-edge
    discoveries in biomedical research and beyond. Human judgement calls are ubiquitous
    at every step of a data science life cycle, e.g., in choosing data cleaning methods,
    predictive algorithms and data perturbations. Such judgment calls are often responsible
    for the "dangers" of A.I. To maximally mitigate these dangers, we developed a
    framework based on three core principles: Predictability, Computability and Stability
    (PCS). The PCS framework unifies and expands on the best practices of machine
    learning and statistics. It consists of a workflow and documentation and is supported
    by our software package v-flow. In this talk, we first illustrate the PCS framework
    through the development of iterative random forests (iRF) for predictable and
    stable non-linear interaction discovery (in collaboration with the Brown Lab at
    LBNL and Berkeley Statistics). In pursuit of genetic drivers of a heart disease
    called hypertrophic cardiomyopathy (HCM) as a CZ Biohub project in collaboration
    with the Ashley Lab at Stanford Medical School and others, we use iRF and UK Biobank
    data to recommend gene-gene interaction targets for knock-down experiments. We
    then analyze the experimental data to show promising findings about genetic drivers
    of HCM.'
  season: spring-2022
- id: ocis-2022-05-17-mireille-schnitzer
  url: https://youtu.be/NN3V2ggZXjk
  title: 'University of Montreal ) - Estimands and estimation of COVID-19 vaccine
    effectiveness under the test-negative design: connections to causal inference'
  speaker: Mireille Schnitzer (
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-05-17'
  topic: causal_inference
  language: en
  discussant: David Benkeser
  slides: https://drive.google.com/file/d/1_3ZbBLOjzF9uXdiuc8d1z6WK45g_Qc23/view?usp=sharing
  abstract: The test-negative design (TND) is routinely used for the monitoring of
    seasonal flu vaccine effectiveness. More recently, it has become integral to the
    estimation of COVID-19 vaccine effectiveness, in particular for more severe disease
    outcomes. Distinct from the case-control study, the design typically involves
    recruitment of participants with a common symptom presentation who are being tested
    for the infectious disease in question. Participants who test positive for the
    target infection are the “cases” and those who test negative are the “controls”.
    Logistic regression is the only statistical method that has been proposed to estimate
    vaccine effectiveness under the TND while adjusting for confounders. While under
    strong modeling assumptions it produces estimates of a causal risk ratio, it may
    be biased in the presence of effect modification by a confounder. I will present
    and justify an inverse probability of treatment weighting (IPTW) estimator for
    the marginal risk ratio, which is valid under effect modification. I’ll discuss
    connections between the estimands targeted by these two methods and causal parameters
    under different interference assumptions. I will then describe the results of
    a simulation study to illustrate and confirm the derivations and to evaluate the
    performance of the estimators.
  season: spring-2022
- id: ocis-2022-05-03-tyler-vanderweele
  url: https://youtu.be/UA2WvYlT2RE
  title: 'Causal Inference and Measure Construction: Towards a New Model of Measurement'
  speaker: Tyler VanderWeele
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-05-03'
  topic: causal_inference
  language: en
  discussant: Fredrik Sävje - Abstract. Psychosocial constructs can only be assessed
    indirectly, and measures are typically formed by a combination of indicators that
    are thought to relate to the construct. Reflective and formative measurement models
    offer different conceptualizations of the relation between the indicators and
    what is sometimes conceived of as a univariate latent variable supposedly corresponding
    to the construct. I argue that the empirical implications of these models will
    often be violated by data since the causally relevant constituents will generally
    be multivariate, not univariate. In fact, the assumption of an underlying univariate
    structural latent variable is so strong that it has empirically testable implications,
    even though the latent is unobserved. Formal statistical tests can be developed
    to reject this assumption, but factor analysis, as typically practiced, is not
    adequate to do so. Factor analysis also suffers from the inability to distinguish
    associations arising from causal versus conceptual relations. I put forward an
    outline for a new model of the process of measure construction and propose a causal
    interpretation of associations between constructed measures and subsequent outcomes
    that is applicable even if the usual assumptions of reflective and formative models
    fail. I discuss the practical implications of these observations and proposals
    for the provision of definitions, the selection of items, item-by-item analyses,
    the construction of measures, and the causal interpretation of regression analyses.
  slides: https://drive.google.com/file/d/1PifbZBL3MI9v9bnHsFfOk9UTQ1L-baWg/view?usp=sharing
  season: spring-2022
- id: ocis-2022-04-26-shu-yang
  url: https://youtu.be/APIQujnvXNI
  title: '- Test-based integrative analysis for heterogeneous treatment effects combining
    randomized trial and real-world data'
  speaker: Shu Yang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-04-26'
  topic: causal_inference
  language: en
  papers:
  - '2005.10579'
  discussant: Issa Dahabreh
  slides: https://drive.google.com/file/d/1nVjTVYROGIjLW5eHHPJZJbDy7G_BQj68/view?usp=sharing
  abstract: 'Parallel randomized trial (RT) and real-world (RW) data are becoming
    increasingly available for treatment evaluation. Given the complementary features
    of the RT and RW data, we propose a test-based elastic integrative analysis of
    RT and RW data for accurate and robust estimation of the heterogeneity of treatment
    effect (HTE), which lies at the heart of precision medicine. When the RW data
    are not subject to bias, e.g., due to hidden confounding, our approach combines
    the RT and RW data for optimal estimation by exploiting semiparametric efficiency
    theory. Utilizing the design advantage of RTs, we construct a built-in test procedure
    to gauge the reliability of the RW data and decide whether or not to use RW data
    in an integrative analysis. A data-adaptive procedure is proposed to select the
    threshold of the test statistic that promises the smallest mean square error of
    the proposed estimator of the HTE. Lastly, we construct an adaptive confidence
    interval that has a good finite-sample coverage property. We apply the proposed
    method to characterize who can benefit from adjuvant chemotherapy in patients
    with stage IB non-small cell lung cancer. If time permits, I will cover other
    approaches such as using the notion of the confounding function to improve inference
    for HTEs using RT and RW data. Keywords: Bias function; Least favorable confidence
    interval; Nonregularity; Pre-test estimator; Semiparametric efficient score.'
  season: spring-2022
- id: ocis-2022-04-12-neil-davies
  url: https://youtu.be/CDEC8--Xnsw
  title: '- Average causal effect estimation via instrumental variables: the no simultaneous
    heterogeneity assumption'
  speaker: Neil Davies
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-04-12'
  topic: causal_inference
  language: en
  papers:
  - '2010.10017'
  discussant: Eric Tchetgen Techetgen
  slides: https://drive.google.com/file/d/1f5wLwDuCCtKIyAV1cia2On8CR1txZDoY/view?usp=sharing
  abstract: 'Instrumental variables (IVs) can be used to provide evidence as to whether
    a treatment X has a causal effect on Y. Z is a valid instrument if it satisfies
    the three core IV assumptions of relevance, independence and the exclusion restriction.
    Even if the instrument satisfies these assumptions, further assumptions are required
    to estimate the average causal effect (ACE) of X on Y. Sufficient assumptions
    for this include: homogeneity in the causal effect of X on Y; homogeneity in the
    association of Z with X; and No Effect Modification (NEM). Here, we describe the
    NO Simultaneous Heterogeneity (NOSH) assumption, which requires the heterogeneity
    in the X-Y causal effect to be independent of both Z and heterogeneity in the
    Z-X association. We describe the necessary conditions for NOSH to hold, in which
    case conventional IV methods are consistent for the ACE even if both homogeneity
    assumptions and NEM are violated. We illustrate these ideas using simulations
    and by re-examining selected published studies.'
  season: spring-2022
- id: ocis-2022-03-29-shuangning-li-michael-oberst
  url: https://youtu.be/Sz4Q7xGdTpU
  title: 'Talk #1: Random Graph Asymptotics for Treatment Effect Estimation under
    Network Interference'
  speaker: Shuangning Li ; Michael Oberst
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-03-29'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1zAMOW6iuAbtqocT6DGBiU-XDlDnwEY48/view?usp=sharing
- id: ocis-2022-03-22-mathias-drton
  url: https://youtu.be/XAoKhwMdFqI
  title: Technical University of Munich) - Half-Trek Criterion for Identifiability
    of Latent Variable Models
  speaker: Mathias Drton (
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-03-22'
  topic: causal_inference
  language: en
  papers:
  - '2201.04457'
  discussant: Robin Evans
  slides: https://drive.google.com/file/d/1wLk0zFWwZGwYVHWF4R3DRRatTAZDf0J3/view?usp=sharing
  abstract: We consider linear structural equation models with latent variables and
    develop a criterion to certify whether the direct causal effects between the observable
    variables are identifiable based on the observed covariance matrix. Linear structural
    equation models assume that both observed and latent variables solve a linear
    equation system featuring stochastic noise terms. Each model corresponds to a
    directed graph whose edges represent the direct effects that appear as coefficients
    in the equation system. Prior research has developed a variety of methods to decide
    identifiability of direct effects in a latent projection framework, in which the
    confounding effects of the latent variables are represented by correlation among
    noise terms. This approach is effective when the confounding is sparse and effects
    only small subsets of the observed variables. In contrast, the new latent-factor
    half-trek criterion (LF-HTC) we develop in this paper operates on the original
    unprojected latent variable model and is able to certify identifiability in settings,
    where some latent variables may also have dense effects on many or even all of
    the observables. Our LF-HTC is an effective sufficient criterion for rational
    identifiability, under which the direct effects can be uniquely recovered as rational
    functions of the joint covariance matrix of the observed random variables. When
    restricting the search steps in the LF-HTC to consider subsets of latent variables
    of bounded size, the criterion can be verified in time that is polynomial in the
    size of the graph.
  season: spring-2022
- id: ocis-2022-03-15-chengchun-shi
  url: https://youtu.be/Zor1CmRyycw
  title: '- A reinforcement learning framework for dynamic causal effects evaluation
    in A/B testing'
  speaker: Chengchun Shi
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-03-15'
  topic: causal_inference
  language: en
  discussant: Will Wei Sun
  slides: https://drive.google.com/file/d/1oq59VQ2rWP2P5sFG9U_cV0BYYYyIQ3Gs/view?usp=sharing
  abstract: A/B testing, or online experiment is a standard business strategy to compare
    a new product with an old one in pharmaceutical, technological, and traditional
    industries. Major challenges arise in online experiments of two-sided marketplace
    platforms (e.g., Uber) where there is only one unit that receives a sequence of
    treatments over time. In those experiments, the treatment at a given time impacts
    current outcome as well as future outcomes. In this talk, we introduce a reinforcement
    learning framework for carrying A/B testing in these experiments, while characterizing
    the long-term treatment effects. Our proposed testing procedure allows for sequential
    monitoring and online updating. It is generally applicable to a variety of treatment
    designs in different industries. In addition, we systematically investigate the
    theoretical properties of our testing procedure. Finally, we apply our framework
    to both simulated data and a real-world data example obtained from a ridesharing
    company to illustrate its advantage over the current practice.
  season: winter-2022
- id: ocis-2022-03-08-yuansi-chen
  url: https://youtu.be/d-5KomewQis
  title: '- Domain adaptation under structural causal models'
  speaker: Yuansi Chen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-03-08'
  topic: causal_inference
  language: en
  discussant: Biwei Huang
  slides: https://drive.google.com/file/d/14mXLxH6-Z1sqqkeyRxSlsV890I_PBb2u/view?usp=sharing
  abstract: Domain adaptation (DA) arises as an important problem in statistical machine
    learning when the source data used to train a model is different from the target
    data used to test the model. Recent advances in DA have mainly been application-driven
    and have largely relied on the idea of a common subspace for source and target
    data. To understand the empirical successes and failures of DA methods, we propose
    a theoretical framework via structural causal models that enables analysis and
    comparison of the prediction performance of DA methods. This framework also allows
    us to itemize the assumptions needed for the DA methods to have a low target error.
    Additionally, with insights from our theory, we propose a new DA method called
    CIRM that outperforms existing DA methods when both the covariates and label distributions
    are perturbed in the target data. We complement the theoretical analysis with
    extensive simulations to show the necessity of the devised assumptions. Reproducible
    synthetic and real data experiments are also provided to illustrate the strengths
    and weaknesses of DA methods when parts of the assumptions in our theory are violated.
  season: winter-2022
- id: ocis-2022-03-01-kosuke-imai
  url: https://youtu.be/Gd2-MxJQTKA
  title: 'Safe Policy Learning through Extrapolation: Application to Pre-trial Risk
    Assessment'
  speaker: Kosuke Imai
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-03-01'
  topic: causal_inference
  language: en
  papers:
  - '2109.11679'
  discussant: Yifan Cui
  slides: https://drive.google.com/file/d/1QR08Lrr0P0BrpiK0IA1v5GrmKIQorMrG/view?usp=sharing
  abstract: Algorithmic recommendations and decisions have become ubiquitous in today’s
    society. Many of these and other data-driven policies, especially in the realm
    of public policy, are based on known, deterministic rules to ensure their transparency
    and interpretability. For example, algorithmic pre-trial risk assessments, which
    serve as our motivating application, provide relatively simple, deterministic
    classification scores and recommendations to help judges make release decisions.
    How can we use the data based on existing deterministic policies and learn new
    and better policies? Unfortunately, prior methods for policy learning are not
    applicable because they require existing policies to be stochastic rather than
    deterministic. We develop a robust optimization approach that partially identifies
    the expected utility of a policy, and then finds an optimal policy by minimizing
    the worst-case regret. The resulting policy is conservative but has a statistical
    safety guarantee, allowing the policy-maker to limit the probability of producing
    a worse outcome than the existing policy. We extend this approach to common and
    important settings where humans make decisions with the aid of algorithmic recommendations.
    Lastly, we apply the proposed methodology to a unique field experiment on pre-trial
    risk assessment instruments. We derive new classification and recommendation rules
    that retain the transparency and interpretability of the existing instrument while
    potentially leading to better overall outcomes at a lower cost.
  season: winter-2022
- id: ocis-2022-02-22-dominik
  url: https://youtu.be/LrMzAKDEbDA
  title: 'Rothenhäusler - Calibrated inference: statistical inference that accounts
    for both sampling uncertainty and distributional uncertainty'
  speaker: Dominik
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-02-22'
  topic: causal_inference
  language: en
  discussant: Guido Imbens
  slides: https://drive.google.com/file/d/1iCQ_Hi1GnvCA3nKSqglT5Ha8fCEbmPZl/view?usp=sharing
  abstract: During data analysis, analysts often have to make seemingly arbitrary
    decisions. For example during data pre-processing, there are a variety of options
    for dealing with outliers or inferring missing data. Similarly, many specifications
    and methods can be reasonable to address a certain domain question. This may be
    seen as a hindrance to reliable inference since conclusions can change depending
    on the analyst's choices. In this paper, we argue that this situation is an opportunity
    to construct confidence intervals that account not only for sampling uncertainty
    but also some type of distributional uncertainty. Distributional uncertainty is
    closely related to other issues in data analysis, ranging from dependence between
    observations to selection bias and confounding. We demonstrate the utility of
    the approach on simulated and real-world data. This is joint work with Yujin Jeong.
  season: winter-2022
- id: ocis-2022-02-15-luke-keele
  url: https://youtu.be/CjZnQ3ToJjg
  title: '- So Many Choices: The Comparative Performance of Statistical Adjustment
    Methods'
  speaker: Luke Keele
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-02-15'
  topic: causal_inference
  language: en
  discussant: Iván Díaz
  slides: https://drive.google.com/file/d/1cNB6jpr2ABMK7c_U2U4779OWgjVOR5lO/view?usp=sharing
  abstract: Much evidence in applied research is based on observational studies where
    investigators assume that there are no unobservable differences between the groups
    under comparison. Treatment effects are estimated after adjusting for observed
    confounders via statistical methods. However, even if the assumption of no unobserved
    confounding holds, bias from model misspecification may be significant. Traditionally,
    regression models of various kinds have been used to adjust for confounders. Such
    models impose strong functional form assumptions that are most prone to model
    misspecification. In the causal inference literature, there has been considerable
    effort on the development of more flexible adjustment methods. In fact, there
    has been an explosion in the number of methods that can be used to adjust for
    observed confounders. Now investigators can choose between many forms of matching,
    weighting, doubly robust methods, and a variety of machine learning based estimators.
    The general trend has been to move toward flexible methods of estimation. Specifically,
    most recent work has sought to combine methods from machine learning with a doubly
    robust framework. While these methods have clear theoretical advantages, they
    see little use in the applied literature. Moreover, the development of guidelines
    for applied researchers has been limited. In this presentation, I review key concepts
    related to functional form assumptions and how those can contribute to bias from
    model misspecification. I also review the logic behind why machine learning methods
    have been so widely proposed for estimation and review the strengths and weaknesses
    of these methods. I present two case studies where I seek to recover experimental
    benchmarks using observational study data. In these case studies, I compare the
    performance of a wide variety of methods for statistical adjustment. I find that
    several widely used methods are subject to bias from model misspecification. I
    also find that while machine learning methods are among the strongest performers,
    they are not always reliable.
  season: winter-2022
- id: ocis-2022-02-08-zhimei-ren
  url: https://youtu.be/aM3auY7kgSA
  title: '- Sensitivity Analysis of Individual Treatment Effects: A Robust Conformal
    Inference Approach'
  speaker: Zhimei Ren
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-02-08'
  topic: causal_inference
  language: en
  papers:
  - '2111.12161'
  discussant: Stefan Wager
  slides: https://drive.google.com/file/d/1Fdq3fhUZa0wi-goqGtzDUHxobNHsh6I3/view?usp=sharing
  abstract: We propose a model-free framework for sensitivity analysis of individual
    treatment effects (ITEs), building upon ideas from conformal inference. For any
    unit, our procedure reports the Gamma-value, a number which quantifies the minimum
    strength of confounding needed to explain away the evidence for ITE. Our approach
    rests on the reliable predictive inference of counterfactuals and ITEs in situations
    where the training data is confounded. Under the marginal sensitivity model of
    Tan (2006), we characterize the shift between the distribution of the observations
    and that of the counterfactuals. We first develop a general method for predictive
    inference of test samples from a shifted distribution; we then leverage this to
    construct covariate-dependent prediction sets for counterfactuals. No matter the
    value of the shift, these prediction sets (resp. approximately) achieve marginal
    coverage if the propensity score is known exactly (resp. estimated). We describe
    a distinct procedure also attaining coverage, however, conditional on the training
    data. In the latter case, we prove a sharpness result showing that for certain
    classes of prediction problems, the prediction intervals cannot possibly be tightened.
    We verify the validity and performance of the new methods via simulation studies
    and apply them to analyze real datasets.
  season: winter-2022
- id: ocis-2022-01-25-daniel-mccaffrey
  url: https://youtu.be/et3eUSM0mu0
  title: '- Nonrandom Samples and Causal Inference'
  speaker: Daniel McCaffrey
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-01-25'
  topic: causal_inference
  language: en
  discussant: Shu Yang
  slides: https://drive.google.com/file/d/1Xjl0cXxLMd2t9ywiDmCEQthDMxP3VJgW/view?usp=sharing
  abstract: Causal inferences, i.e., estimates of how a treatment or intervention
    affects outcomes, are of great interest in many fields. There are many causal
    modeling methods for estimating causal effects from observational data that attempt
    to adjust for potential biases due to the differences between individuals receiving
    different treatments in natural settings. These methods nearly universally implicitly
    assume the data are a random sample from the population of interest. Nonrandom
    samples occur when using survey samples or because of nonresponse or study attrition.
    Weighting commonly is proposed for adjusting the nonrandom samples to be representative
    of the population of interest. There are questions about how to use these sampling
    (or nonresponse or attrition) weights with causal modeling techniques. Authors
    have explored the issue but the advice is somewhat conflicting. In this talk,
    I will demonstrate that under certain assumptions combining sampling (or nonresponse
    or attrition) weights with inverse-probability-of-treatment weights can yield
    consistent estimates of causal effects for the entire population of interest.
    I show that different assumptions lead to different recommendations for how to
    use the sampling (or nonresponse or attrition) weights. I also show that using
    simulate data to study how to use such weights without a theoretical foundation
    can lead to confusing conclusions.
  season: winter-2022
- id: ocis-2022-01-11-interview-with-guido-imbens
  url: https://youtu.be/DuVVy1WM-qM
  speaker: Interview with Guido Imbens
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-01-11'
  topic: causal_inference
  language: en
  papers:
  - '2108.03726'
  slides: https://drive.google.com/file/d/1258iqrVEHTaz7J6xBnqOIpSKret3z9d6/view?usp=sharing
  season: winter-2022
- id: ocis-2021-11-30-thomas-richardson
  url: https://youtu.be/jnEM1z0m4ow
  title: '- Single World Intervention Graphs: A simple framework for unifying graphs
    and potential outcomes with applications to mediation analysis'
  speaker: Thomas Richardson
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-11-30'
  topic: causal_inference
  language: en
  discussant: Mats Stensrud
  slides: https://drive.google.com/file/d/1qScivV9HytYsbUHAo59bsA7cAkZteCh0/view?usp=sharing
  abstract: Causal models based on potential outcomes, also known as counterfactuals,
    were introduced by Neyman (1923) and later popularized by Rubin. Causal Directed
    Acyclic Graphs (DAGs) are another approach, originally introduced by Wright (1921),
    but subsequently significantly generalized and extended by Spirtes and Pearl among
    others. In this talk I will first present a simple approach to unifying these
    two approaches via Single-World Intervention Graphs (SWIGs). The SWIG encodes
    the counterfactual independences associated with a specific hypothetical intervention
    on a set of treatment variables. The nodes on the SWIG are the corresponding counterfactual
    random variables. This represents a counterfactual model originally introduced
    by Robins (1986) using event trees. This synthesis permits a simplification of
    Pearl's do-calculus that clarifies and separates the underlying concepts. In turn
    this leads to a simple counterfactual formulation of a complete identification
    algorithm for causal effects in models with hidden variables. By expanding the
    graph, SWIGs may also be used to describe a novel interventionist approach to
    mediation analysis whereby treatment is decomposed into multiple separable components.
    This provides a means of discussing direct effects without reference to cross-world
    (nested) counterfactuals or interventions on the mediator. The theory preserves
    the dictum ``no causation without manipulation'' and makes questions of mediation
    empirically testable in future randomized controlled trials. This is joint work
    with James M. Robins (Harvard) and Ilya Shpitser (Johns Hopkins).
  season: fall-2021
- id: ocis-2021-11-16-linbo-wang
  url: https://youtu.be/ol6dabNA7go
  title: '- Causal inference on distribution functions'
  speaker: Linbo Wang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-11-16'
  topic: causal_inference
  language: en
  papers:
  - '2101.01599'
  discussant: Hongtu Zhu
  slides: https://drive.google.com/file/d/1ICs4_rP8D1UZScpbqnqlCVLD73E5yakP/view?usp=sharing
  abstract: Understanding causal relationships is one of the most important goals
    of modern science. So far, the causal inference literature has focused almost
    exclusively on outcomes coming from the Euclidean space Rp. However, it is increasingly
    common that complex datasets collected through electronic sources, such as wearable
    devices, cannot be represented as data points from Rp. In this paper, we present
    a novel framework of causal effects for outcomes from the Wasserstein space of
    cumulative distribution functions, which in contrast to the Euclidean space, is
    non-linear. We develop doubly robust estimators and associated asymptotic theory
    for these causal effects. As an illustration, we use our framework to quantify
    the causal effect of marriage on physical activity patterns using wearable device
    data collected through the National Health and Nutrition Examination Survey.
  season: fall-2021
- id: ocis-2021-11-09-jin-tian
  url: https://youtu.be/PUOYK2zhjLc
  title: '- Estimating Identifiable Causal Effects through Double Machine Learning
    - Graph-based & Data-driven Approaches'
  speaker: Jin Tian
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-11-09'
  topic: causal_inference
  language: en
  discussant: Ilya Shpitser
  slides: https://faculty.sites.iastate.edu/jtian/files/inline-files/aaai-21-Yonghan.pdf
  abstract: 'Inferring causal effects from observational data is a fundamental task
    throughout the empirical sciences. General methods have been developed to decide
    the identifiability of a target effect from a combination of observational data
    and the causal graph underlying the system. In practice, however, there are still
    challenges to estimating identifiable causal functionals from finite samples.
    We aim to fill this gap between causal identification and causal estimation. In
    this talk, I will discuss two versions of this problem. (1) Graph-based: For any
    identifiable causal functionals given a causal graph, we develop a general estimator
    with double/debiased machine learning (DML) properties enjoying doubly robustness
    against model misspecification and debiasedness against biases in nuisance function
    estimation permitting the use of machine learning techniques for estimating nuisances.
    This constitutes the first general result of identification with robustness guarantees
    given an arbitrary causal graph. (2) Data-driven: We study causal estimation from
    a Markov equivalence class (MEC) of the underlying causal graphs represented by
    a partial ancestral graph (PAG), which is learnable from observational data. In
    particular, we develop a general DML estimator for any identifiable causal effects
    in a PAG. The result provides an entirely data-driven solution to causal estimation,
    i.e., from observational data -> PAG by structure learning -> identifiability
    of target effect P(y|do(x)) -> estimating P(y|do(x)) from data. Joint work with
    Yonghan Jung and Elias Bareinboim.'
  season: fall-2021
- id: ocis-2021-10-26-carlos-cinelli
  url: https://youtu.be/j7mN_G5Gpyg
  title: '- Transparent and Robust Causal Inference in the Social and Health Sciences'
  speaker: Carlos Cinelli
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-10-26'
  topic: causal_inference
  language: en
  discussant: Guido Imbens
  slides: https://carloscinelli.com/files/Cinelli%20and%20Hazlett%20%282020%29%20-%20Making%20Sense%20of%20Sensitivity.pdf
  abstract: 'The past few decades have witnessed rapid and unprecedented theoretical
    progress on the science of causal inference, ranging from the "credibility revolution”
    with the popularization of quasi-experimental designs, to the development of a
    complete solution to non-parametric identification with causal graphical models.
    Most of this theoretical progress, however, relies on strong, exact assumptions,
    such as the absence of unobserved common causes (ignorability assumptions), or
    the absence of certain direct effects (exclusion restrictions). Unfortunately,
    more often than not these assumptions are very hard to defend in practice. This
    leads to two undesirable consequences for applied quantitative work: (i) important
    research questions may be neglected, simply because they do not exactly match
    the requirements of current methods; or, (ii) researchers may succumb to making
    the required “identification assumptions” simply to justify the use of available
    methods, but not because these assumptions are truly believed (or understood).
    In this talk, I will discuss new theory, methods, and software for permitting
    causal inferences under more flexible and realistic settings. In particular, I
    will focus on a flexible suite of sensitivity analysis tools for OLS (Cinelli
    and Hazlett, 2020) and instrumental variables (Cinelli and Hazlett, 2021) which
    can be immediately put to use to improve the robustness and transparency of current
    applied research. Notably, by building upon the familiar "omitted variable bias"
    framework, these tools: (i) do not require assumptions on the functional form
    of the treatment assignment mechanism nor on the distribution of the unobserved
    variables; (ii) naturally handle multiple unobserved variables, possibly acting
    non-linearly; (iii) exploit expert knowledge to bound sensitivity parameters;
    and, (iv) can be easily implemented using standard regression output. If time
    permits, I will also briefly discuss a graph-based approach for the algorithmic
    derivation of sensitivity curves for linear structural equation models (Cinelli
    et al, 2019).'
  season: fall-2021
- id: ocis-2021-10-12-colin-fogarty
  url: https://www.youtube.com/watch?v=N0QOGkzZXhw
  title: '- Prepivoting in Finite Population Causal Inference'
  speaker: Colin Fogarty
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-10-12'
  topic: causal_inference
  language: en
  discussant: Tirthanker Dasgupta -
  slides: https://drive.google.com/file/d/1S4u8CzZ0ZuxI-ux2T_Q3feqXx5TRoLpW/view?usp=sharing
  abstract: In finite population causal inference exact randomization tests can be
    constructed for sharp null hypotheses, hypotheses which fully impute the missing
    potential outcomes. Oftentimes inference is instead desired for the weak null
    that the sample average of the treatment effects takes on a particular value while
    leaving the subject-specific treatment effects unspecified. Without proper care,
    tests valid for sharp null hypotheses may be anti-conservative even asymptotically
    should only the weak null hold, creating the risk of misinterpretation when randomization
    tests are deployed in practice. We develop a general framework for unifying modes
    of inference for sharp and weak nulls, wherein a single procedure simultaneously
    delivers exact inference for sharp nulls and asymptotically valid inference for
    weak nulls. To do this, we employ randomization tests based upon prepivoted test
    statistics, wherein a test statistic is first transformed by a suitably constructed
    cumulative distribution function and its randomization distribution assuming the
    sharp null is then enumerated. For a large class of test statistics common in
    practice, we show that prepivoting may be accomplished by employing a sample-based
    Gaussian measure governed by a suitably constructed covariance estimator. In essence,
    the approach enumerates the randomization distribution (assuming the sharp null)
    of a p-value for a large-sample test known to be valid under the weak null, and
    uses the resulting randomization distribution to perform inference. The versatility
    of the method is demonstrated through various examples, including inference for
    rerandomized experiments.
  season: fall-2021
- id: ocis-2021-09-28-youjin-lee
  url: https://youtu.be/E37iFrVN-0k
  title: '- Evidence factors from multiple, possibly invalid, instrumental variables'
  speaker: Youjin Lee
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-09-28'
  topic: causal_inference
  language: en
  discussant: Jose Zubizarreta
  slides: https://drive.google.com/file/d/1EKTUCt_CneEVYlVxb_InrKOHBL57_4lp/view?usp=sharing
  abstract: Instrumental variables have been widely used to estimate the causal effect
    of a treatment on an outcome in the presence of unmeasured confounders. When several
    instrumental variables are available and the instruments are subject to possible
    biases that do not completely overlap, a careful analysis based on these several
    instruments can produce orthogonal pieces of evidence (i.e., evidence factors)
    that would strengthen causal conclusions when combined. We develop several strategies,
    including stratification, to construct evidence factors from multiple candidate
    instrumental variables when invalid instruments may be present. Our proposed methods
    deliver nearly independent inferential results each from candidate instruments
    under the more liberally defined exclusion restriction than the previously proposed
    reinforced design. We apply our stratification method to evaluate the causal effect
    of malaria on stunting among children in Western Kenya using three nested instruments
    that are converted from a single ordinal variable. Our proposed stratification
    method is particularly useful when we have an ordinal instrument of which validity
    depends on different values of the instrument. This is based on joint work with
    Anqi Zhao, Dylan Small, and Bikram Karmarkar.
  season: fall-2021
- id: ocis-2021-09-21-ted-westling
  url: https://youtu.be/kwfLbgrf4L0
  title: Nonparametric tests of the causal null with non-discrete exposures
  speaker: Ted Westling
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-09-21'
  topic: causal_inference
  language: en
  papers:
  - '2001.05344'
  discussant: Oliver Dukes
  slides: https://drive.google.com/file/d/1rY7fXPF_g_G3sV64kc2dN3o9cV1KDjEe/view?usp=sharing
  abstract: Many methods have been developed to test for the presence of a causal
    effect of a discrete exposure on an outcome when there are no unobserved confounders.
    In this talk, we introduce a class of nonparametric tests of the null hypothesis
    that there is no average causal effect of an arbitrary univariate exposure on
    an outcome when there are no unobserved confounders. Our tests apply to discrete,
    continuous, and mixed discrete-continuous exposures. We demonstrate that our proposed
    tests are doubly-robust consistent, that they have correct asymptotic type I error
    if both nuisance parameters involved in the problem are estimated at fast enough
    rates, and that they have power to detect local alternatives approaching the null
    at the rate $n^{-1/2}$. We study the performance of our tests in numerical studies,
    and use them to test for the presence of a causal effect of BMI on immune response
    in early-phase vaccine trials.
  season: fall-2021
- id: ocis-2021-09-14-daniel-malinsky
  url: https://youtu.be/itnR1xVS4YI
  title: Explaining the Behavior of Black-Box Prediction Algorithms with Causal Learning
  speaker: Daniel Malinsky
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-09-14'
  topic: causal_inference
  language: en
  papers:
  - '2006.02482'
  discussant: Joshua Loftus
  slides: https://drive.google.com/file/d/1-yRmKnpwPSKiXlSq1sbaZ3Y0EqYeHy9U/view?usp=sharing
  abstract: We propose to explain the behavior of black-box prediction methods (e.g.,
    deep neural networks trained on image pixel data) using causal graphical models.
    Specifically, we explore learning the structure of a causal graph where the nodes
    represent prediction outcomes along with a set of macro-level “interpretable”
    features, while allowing for arbitrary unmeasured confounding among these variables.
    The resulting graph may indicate which of the interpretable features, if any,
    are possible causes of the prediction outcome and which may be merely associated
    with prediction outcomes due to confounding. The approach is motivated by a counterfactual
    theory of causal explanation wherein good explanations point to factors that are
    “difference-makers” in an interventionist sense. The resulting analysis may be
    useful in algorithm auditing and evaluation, by identifying features which make
    a causal difference to the algorithm’s output.
  season: fall-2021
- id: ocis-2021-08-10-maggie-makar
  url: https://youtu.be/R555VwMXSZ4
  title: 'Talk #1: Causally motivated shortcut removal using auxiliary labels (Maggie
    Makar)'
  speaker: Maggie Makar
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-08-10'
  topic: causal_inference
  language: en
  papers:
  - '2108.03849'
  slides: https://drive.google.com/file/d/1BB8vU6R_7eY2w16jg4bclOYkM3D-9DX7/view?usp=sharing
  abstract: Robustness to certain forms of distribution shift is a key concern in
    many ML applications. Often, robustness can be formulated as enforcing invariances
    to particular interventions on the data generating process. Here, we study a flexible,
    causally-motivated approach to enforcing such invariances, paying special attention
    to shortcut learning, where a robust predictor can achieve optimal i.i.d generalization
    in principle, but instead it relies on spurious correlations or shortcuts in practice.
    Our approach uses auxiliary labels, typically available at training time, to enforce
    conditional independences between the latent factors that determine these labels.
    We show both theoretically and empirically that causally-motivated regularization
    schemes (a) lead to more robust estimators that generalize well under distribution
    shift, and (b) have better finite sample efficiency compared to usual regularization
    schemes, even in the absence of distribution shifts. Our analysis highlights important
    theoretical properties of training techniques commonly used in causal inference,
    fairness, and disentanglement literature. This is based on joint work with Alex
    D'amour.
  season: summer-2021
- id: ocis-2021-08-03-anish-agarwal-and-dennis-shen
  url: https://youtu.be/e8nomN9hxZM
  title: Synthetic Interventions
  speaker: Anish Agarwal and Dennis Shen
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-08-03'
  topic: causal_inference
  language: en
  papers:
  - '2006.07691'
  discussant: Jason Poulos
  slides: https://drive.google.com/file/d/1w8R6T1FlbYGFeYwo6cXuMjS-rzVeNdyx/view?usp=sharing
  abstract: Consider a setting where there are N heterogeneous units (e.g., individuals,
    sub-populations) and D interventions (e.g., socio-economic policies). Our goal
    is to learn the potential outcome associated with every intervention on every
    unit (i.e., N x D causal parameters). Towards this, we present a causal framework,
    synthetic interventions (SI), to infer these N x D causal parameters while only
    observing each of the N units under at most two interventions, independent of
    D. This can be significant as the number of interventions, i.e, level of personalization,
    grows. Importantly, our estimator also allows for latent confounders that determine
    how interventions are assigned. Theoretically, under a novel tensor factor model
    across units, measurements, and interventions, we formally establish an identification
    result for each of these N x D causal parameters, and establish finite-sample
    consistency and asymptotic normality of our estimator. Empirically, we validate
    our framework through both experimental and observational case studies; namely,
    a large-scale A/B test performed on an e-commerce platform, a phase 3 clinical
    trial data from a pharmaceutical company, and an evaluation of mobility-restricting
    policies on COVID-19. We believe this has important implications for program evaluation
    and the design of data-efficient RCTs with heterogeneous units and multiple interventions.
  season: summer-2021
- id: ocis-2021-07-27-johannes-textor
  url: https://youtu.be/LCC4BkLZo-g
  title: Causal Inference using the R package DAGitty
  speaker: Johannes Textor
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-07-27'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/122hfAj3t75vl5WlqxrFJ44K554x6xIB4/view?usp=sharing
  abstract: The R package "DAGitty" is a port of the online tool " dagitty.net " to
    the R platform for statistical computing. It provides access to graphical causal
    identification methods such as adjustment sets and instrumental variables, and
    has capabilities for simulating data from pre-specified graphical causal models.
    In this talk, I will explain the history and design principles behind the package,
    and show how it can be used in conjunction with other powerful packages such as
    ggdag, bnlearn, pcalg, and causaleffect. Special attention will be paid to the
    issue of testing graphical causal models via implied d-separation or tetrad implications.
  season: summer-2021
- id: ocis-2021-07-20-fiammetta-menchetti-armeen-taeb
  url: https://youtu.be/RjMEtv3C5S0
  title: 'Talk 1: Estimating the causal effect of an intervention in a time series
    setting: the C-ARIMA approach (Fiammetta Menchetti)'
  speaker: Fiammetta Menchetti ; Armeen Taeb
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-07-20'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1rI7kf9hsPyRcxxaLXHbJBUM0hJk6cJM9/view?usp=sharing
  abstract: The Rubin Causal Model (RCM) is a framework that allows to define the
    causal effect of an intervention as a contrast of potential outcomes. In recent
    years, several methods have been developed under the RCM to estimate causal effects
    in time series settings. None of these makes use of ARIMA models, which are instead
    very common in the econometrics literature. We propose a novel approach, C-ARIMA,
    to define and estimate the causal effect of an intervention in a time series setting
    under the RCM. We first formalize the assumptions enabling the definition, the
    estimation and the attribution of the effect to the intervention. In the empirical
    application, we use C-ARIMA to assess the causal effect of a permanent price reduction
    on supermarket sales.
  season: summer-2021
- id: ocis-2021-07-13-alexander-volfovsky
  url: https://youtu.be/CoxmwebAsOw
  title: Online experimentation for studying political polarization
  speaker: Alexander Volfovsky
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-07-13'
  topic: causal_inference
  language: en
  discussant: Edo Airoldi
  slides: https://drive.google.com/file/d/1PaT1yqjDA99-xZvL_dleL4gGoJcHnqQF/view?usp=sharing
  abstract: Social media sites are often blamed for exacerbating political polarization
    by creating “echo chambers” that prevent people from being exposed to information
    that contradicts their preexisting beliefs. We conducted a field experiment during
    which a large group of Democrats and Republicans followed bots that retweeted
    messages by elected officials and opinion leaders with opposing political views.
    Republican participants expressed substantially more conservative views after
    following a liberal Twitter bot, while Democrats’ attitudes became slightly more
    liberal after following a conservative Twitter bot. To successfully study such
    pressing societal questions, it is imperative that experimental designs take into
    account new data paradigms. In modern settings where experiments are commonly
    run on online networks or when studying naturally networked phenomena standard
    randomization schemes do not exhibit the same theoretical properties. To address
    these issues we develop randomization schemes that are able to take into account
    violations of the no-interference and no-homophily assumptions. Under a scheme
    for studying direct treatment effects, we demonstrate the existence of unbiased
    estimators with bounded variance. We provide a simplified and computationally
    tractable randomized design which leads to asymptotically consistent estimators
    of direct treatment effects under both dense and sparse network regimes. We further
    extend this line of work by proposing experimental designs that efficiently target
    peer effects.
  season: summer-2021
- id: ocis-2021-07-06-isaiah-andrews
  url: https://youtu.be/Zs6FqGvRIuQ
  title: Inference on Winners
  speaker: Isaiah Andrews
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-07-06'
  topic: causal_inference
  language: en
  discussant: Will Fithian
  slides: https://scholar.harvard.edu/files/iandrews/files/inference_on_winners.pdf
  abstract: Many empirical questions concern target parameters selected through optimization.
    For example, researchers may be interested in the effectiveness of the best policy
    found in a randomized trial, or the best-performing investment strategy based
    on historical data. Such settings give rise to a winner’s curse, where conventional
    estimates are biased and conventional confidence intervals are unreliable. This
    paper develops optimal confidence intervals and median-unbiased estimators that
    are valid conditional on the target selected and so overcome this winner’s curse.
    If one requires validity only on average over targets that might have been selected,
    we develop hybrid procedures that combine conditional and projection confidence
    intervals to offer further performance gains relative to existing alternatives.
  season: summer-2021
- id: ocis-2021-06-29-sam-pimentel
  url: https://youtu.be/eCafnLGnYEM
  title: Optimal tradeoffs in matched designs comparing US-trained and internationally-trained
    surgeons.
  speaker: Sam Pimentel
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-06-29'
  topic: causal_inference
  language: en
  discussant: Magdalena Bennett
  slides: https://www.stat.berkeley.edu/~spi/optimal_tradeoffs_unblinded.pdf
  abstract: Does receiving a medical education outside the United States impact a
    surgeon's performance? We study this question by matching operations performed
    by internationally-trained surgeons to those performed by US-trained surgeons
    in reanalysis of a large health outcomes study. An effective matched design must
    achieve several goals, including balancing covariate distributions marginally,
    ensuring units within individual pairs have similar values on key covariates,
    and using a sufficiently large sample from the raw data. Yet in our study, optimizing
    some of these goals forces less desirable results on others. We address such tradeoffs
    from a multi-objective optimization perspective by creating matched designs that
    are Pareto optimal with respect to two goals. We provide general tools for generating
    representative subsets of Pareto optimal solution sets and articulate how they
    can be used to improve decision-making in observational study design. In the motivating
    surgical outcomes study, formulating a multi-objective version of the problem
    helps us balance an important variable without sacrificing two other design goals,
    average closeness of matched pairs on a multivariate distance and size of the
    final matched sample.
  season: summer-2021
- id: ocis-2021-06-22-stefan-wager
  url: https://youtu.be/MW4Kmx9wYmw
  title: Treatment Effects in Market Equilibrium (joint work with Evan Munro and Kuang
    Xu)
  speaker: Stefan Wager
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-06-22'
  topic: causal_inference
  language: en
  discussant: Fredrik Sävje
  slides: https://drive.google.com/file/d/1KdMDPdMhVsREu0Sf6KorG6CaAMAXgiiC/view?usp=sharing
- id: ocis-2021-06-15-guido-imbens
  url: https://youtu.be/5qs2UV_u2vw
  title: Using Experiments to Correct for Selection in Observational Studies
  speaker: Guido Imbens
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-06-15'
  topic: causal_inference
  language: en
  discussant: Nathan Kallus
  slides: https://drive.google.com/file/d/1e-72waq998DcFGFaV1sMDBDCy_lt7wz_/view?usp=sharing
  abstract: In the social sciences there has been an increase in interest in randomized
    experiments to estimate causal effects, partly because their internal validity
    tends to be high, but they are often small and contain information on only a few
    variables. At the same time, as part of the big data revolution, large, detailed,
    and representative, administrative data sets have become more widely available.
    However, the credibility of estimates of causal effects based on such data sets
    alone can be low. In this paper, we develop statistical methods for systematically
    combining experimental and observational data to improve the credibility of estimates
    of the causal effects. We focus on a setting with a binary treatment where we
    are interested in the effect on a primary outcome that we only observe in the
    observational sample. Both the observational and experimental samples contain
    data about a treatment, observable individual characteristics, and a secondary
    (often short term) outcome. To estimate the effect of a treatment on the primary
    outcome, while accounting for the potential confounding in the observational sample,
    we propose a method that makes use of estimates of the relationship between the
    treatment and the secondary outcome from the experimental sample. We interpret
    differences in the estimated causal effects on the secondary outcome between the
    two samples as evidence of unobserved confounders in the observational sample,
    and develop control function methods for using those differences to adjust the
    estimates of the treatment effects on the primary outcome. We illustrate these
    ideas by combining data on class size and third grade test scores from the Project
    STAR experiment with observational data on class size and both third and eighth
    grade test scores from the New York school system.
  season: summer-2021
- id: ocis-2021-06-08-leon-bottou
  url: https://youtu.be/Rewr4GmkYEk
  title: Learning Representations Using Causal Invariance
  speaker: Leon Bottou
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-06-08'
  topic: causal_inference
  language: en
  discussant: Dominik Rothenhäusler
  abstract: Learning algorithms often capture spurious correlations present in the
    training data distribution instead of addressing the task of interest. Such spurious
    correlations occur because the data collection process is subject to uncontrolled
    confounding biases. Suppose however that we have access to a few distinct datasets
    exemplifying the same concept but whose distributions exhibit different biases.
    Can we learn something that is common across all these distributions, while ignoring
    the spurious ways in which they differ? Can we go beyond setting this problem
    as a multi-criterion optimization problem and learn something that not only works
    well for our datasets, but also works all distributions that exercises the same
    biases in possibly more extreme form? One way to achieve this goal consists of
    projecting the data into a representation space in which training on any of our
    datasets leads to exactly the same solution. This idea differs in important ways
    from previous work on statistical robustness or adversarial objectives. Similar
    to recent work on invariant feature selection, this is about discovering the actual
    mechanism underlying the data instead of modeling its superficial statistics.
    The presentation provides some evidence that this can work and also discusses
    some of the current problems with this approach.
  season: spring-2021
- id: ocis-2021-06-01-niklas-pfister
  url: https://youtu.be/ZrIivZDygmo
  title: Statistical Testing under Distributional Shifts
  speaker: Niklas Pfister
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-06-01'
  topic: causal_inference
  language: en
  papers:
  - '2105.10821'
  discussant: Thomas Berrett
  slides: https://drive.google.com/file/d/17VKr_I2OqewBk2W6b1Gn4dHV_QcgPrOs/view?usp=sharing
  abstract: Statistical hypothesis testing is a central problem in empirical inference.
    Observing data from a distribution P, one is interested in testing whether P lies
    in a given null hypothesis while controlling the probability of false rejections.
    In this talk, we will introduce a framework for statistical testing under distributional
    shifts. Our goal will be to test a target hypothesis P in H0 using observed data
    from a distribution Q, where we assume that P is related to Q through a known
    distributional shift. We propose a general testing procedure that first resamples
    from the observed data to construct an auxiliary data set (mimicking properties
    of P) and then applies an existing test in the target domain. We prove that this
    procedure holds pointwise asymptotic level if the target test holds pointwise
    asymptotic level, the size of the resample is at most of order square root n,
    and the resampling weights are well-behaved. We will see that testing under distributional
    shifts allows us to tackle a diverse set of problems, such as problems in reinforcement
    learning, causal inference and conditional independence testing. The talk is based
    on joint work with Nikolaj Thams, Sorawit Saengkyongam and Jonas Peters.
  season: spring-2021
- id: ocis-2021-05-25-razieh-nabi
  url: https://youtu.be/hNOXL4qHP8c
  title: Semiparametric inference for causal effects in graphical models with hidden
    variables
  speaker: Razieh Nabi
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-05-25'
  topic: causal_inference
  language: en
  discussant: Eric Tchetgen Tchetgen
  slides: https://drive.google.com/file/d/11mp9BrtXUvX1p9ljA4Dm_PdWAbdOuVh-/view?usp=sharing
  abstract: There exist sound and complete algorithms for identifying causal effects
    in causal graphical models with unmeasured confounders. However, these algorithms
    remain underused due to the complexity of estimating the identifying functionals
    that they output. In this work, we bridge the gap between identification and estimation
    of population-level causal effects involving a single treatment and a single outcome.
    The majority of the talk focuses on semiparametric estimation of effects that
    are identified in a large class of causal graphical models with unmeasured confounders,
    where the treatment satisfies a simple graphical criterion that we call primal
    fixability. This class includes the adjustment and front-door functionals as special
    cases. We derive several types of estimators including the influence function-based
    doubly robust estimators. Such estimators allow us to incorporate flexible ML
    methods into the causal inference pipeline in a variety of settings where the
    standard, but often unreasonable, assumption of conditional ignorability does
    not hold. We also provide necessary and sufficient conditions under which the
    underlying statistical models are non-parametrically saturated and discuss the
    efficiency bounds. Finally, we provide a sound and complete identification algorithm
    that directly yields a weighting-based estimation strategy for any identifiable
    effect, even if the treatment is not primal fixable.
  season: spring-2021
- id: ocis-2021-05-18-ramesh-johari
  url: https://youtu.be/NDWuhbHtzMI
  title: 'Experimental design in two-sided platforms: an analysis of bias'
  speaker: Ramesh Johari
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-05-18'
  topic: causal_inference
  language: en
  papers:
  - '2002.05670'
  discussant: Panos Toulis
  slides: https://drive.google.com/file/d/1oVJMLNJOIujfRI4phnBQJbZ_mk4ydNVL/view?usp=sharing
  abstract: 'We develop an analytical framework to study experimental design in two-sided
    marketplaces. Many of these experiments exhibit interference, where an intervention
    applied to one market participant influences the behavior of another participant.
    This interference leads to biased estimates of the treatment effect of the intervention.
    We develop a stochastic market model and associated mean field limit to capture
    dynamics in such experiments, and use our model to investigate how the performance
    of different designs and estimators is affected by marketplace interference effects.
    Platforms typically use two common experimental designs: demand-side ("customer")
    randomization (CR) and supply-side ("listing") randomization (LR), along with
    their associated estimators. We show that good experimental design depends on
    market balance: in highly demand-constrained markets, CR is unbiased, while LR
    is biased; conversely, in highly supply-constrained markets, LR is unbiased, while
    CR is biased. We also introduce and study a novel experimental design based on
    two-sided randomization (TSR) where both customers and listings are randomized
    to treatment and control. We show that appropriate choices of TSR designs can
    be unbiased in both extremes of market balance, while yielding relatively low
    bias in intermediate regimes of market balance.'
  season: spring-2021
- id: ocis-2021-05-11-corwin-zigler
  url: https://youtu.be/PiiWu-YtIXs
  title: 'Bipartite inference and air pollution transport: estimating health effects
    of power plant interventions'
  speaker: Corwin Zigler
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-05-11'
  topic: causal_inference
  language: en
  papers:
  - '2012.04831'
  discussant: Forrest Crawford
  slides: https://drive.google.com/file/d/1VAK3oqJz4L_ROOGDn07hU22Jsinhi7rP/view?usp=sharing
  abstract: 'Evaluating air quality interventions is confronted with the challenge
    of interference since interventions at a particular pollution source likely impact
    air quality and health at distant locations and air quality and health at any
    given location are likely impacted by interventions at many sources. The structure
    of interference in this context is dictated by complex atmospheric processes governing
    how pollution emitted from a particular source is transformed and transported
    across space, and can be cast with a bipartite structure reflecting the two distinct
    types of units: 1) interventional units on which treatments are applied or withheld
    to change pollution emissions; and 2) outcome units on which outcomes of primary
    interest are measured. We propose new estimands for bipartite causal inference
    with interference that construe two components of treatment: a "key-associated"
    (or "individual") treatment and an "upwind" (or "neighborhood") treatment. Estimation
    is carried out using a semi-parametric adjustment approach based on joint propensity
    scores. A reduced-complexity atmospheric model is deployed to characterize the
    structure of the interference network by modeling the movement of air parcels
    through time and space. The new methods are deployed to evaluate the effectiveness
    of installing flue-gas desulfurization scrubbers on 472 coal-burning power plants
    (the interventional units) in reducing Medicare hospitalizations among 22,603,597
    Medicare beneficiaries residing across 23,675 ZIP codes in the United States (the
    outcome units).'
  season: spring-2021
- id: ocis-2021-05-04-sara-magliacane
  url: https://youtu.be/z748Lf4QTlE
  title: Domain adaptation by using causal inference to predict invariant conditional
    distributions
  speaker: Sara Magliacane
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-05-04'
  topic: causal_inference
  language: en
  papers:
  - '1707.06422'
  discussant: Dominik Rothenhäusler
  slides: https://drive.google.com/file/d/1UHU9qZGCyZNQmQ_sGqjk53Il9w9PhZNx/view?usp=sharing
  abstract: An important goal common to domain adaptation and causal inference is
    to make accurate predictions when the distributions for the source (or training)
    domain(s) and target (or test) domain(s) differ. In many cases, these different
    distributions can be modeled as different contexts of a single underlying system,
    in which each distribution corresponds to a different perturbation of the system,
    or in causal terms, an intervention. We focus on a class of such causal domain
    adaptation problems, where data for one or more source domains are given, and
    the task is to predict the distribution of a certain target variable from measurements
    of other variables in one or more target domains. We propose an approach for solving
    these problems that exploits causal inference and does not rely on prior knowledge
    of the causal graph, the type of interventions or the intervention targets. We
    demonstrate our approach by evaluating a possible implementation on simulated
    and real world data.
  season: spring-2021
- id: ocis-2021-04-20-alberto-abadie
  url: https://youtu.be/I7AVRmadkU4
  title: A Penalized Synthetic Control Estimator for Disaggregated Data
  speaker: Alberto Abadie
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-04-20'
  topic: causal_inference
  language: en
  discussant: Stefan Wager
  slides: https://drive.google.com/file/d/1tzOYj7kO-_DxPGjQyl62SQuPODW9AOWg/view?usp=sharing
  abstract: Synthetic control methods are commonly applied in empirical research to
    estimate the effects of treatments or interventions on aggregate outcomes. A synthetic
    control estimator compares the outcome of a treated unit to the outcome of a weighted
    average of untreated units that best resembles the characteristics of the treated
    unit before the intervention. When disaggregated data are available, constructing
    separate synthetic controls for each treated unit may help avoid interpolation
    biases. However, the problem of finding a synthetic control that best reproduces
    the characteristics of a treated unit may not have a unique solution. Multiplicity
    of solutions is a particularly daunting challenge when the data includes many
    treated and untreated units. To address this challenge, we propose a synthetic
    control estimator that penalizes the pairwise discrepancies between the characteristics
    of the treated units and the characteristics of the units that contribute to their
    synthetic controls. The penalization parameter trades off pairwise matching discrepancies
    with respect to the characteristics of each unit in the synthetic control against
    matching discrepancies with respect to the characteristics of the synthetic control
    unit as a whole. We study the properties of this estimator and propose data-driven
    choices of the penalization parameter. This is joint work with Jérémy L'Hour.
  season: spring-2021
- id: ocis-2021-04-13-andrea-rotnitzky
  url: https://youtu.be/VBfMhMaIE-8
  title: Optimal adjustment sets in non-parametric graphical models
  speaker: Andrea Rotnitzky
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-04-13'
  topic: causal_inference
  language: en
  discussant: Ema Perkovi c
  slides: https://drive.google.com/file/d/1WDfsU2dyaVrodyYi91nljBiwQogd1uAZ/view?usp=sharing
  abstract: We consider the selection of potential confounding variables at the stage
    of the design of a planned observational study. Given a tentative non-parametric
    graphical causal model, possibly including unobservable variables, the aim is
    to select the set of observable covariates that both suffices to control for confounding
    under the model and yields a non-parametric estimator of the causal contrast of
    interest with smallest variance. For studies without unobservables aimed at assessing
    the effect of a static point exposure we show that graphical rules recently derived
    for identifying optimal covariate adjustment sets in linear causal graphical models
    and treatment effects estimated via ordinary least squares also apply in the non-parametric
    setting. Moreover, we show that, in graphs with unobservable variables, but with
    at least one adjustment set fully observable, there exist adjustment sets that
    are optimal minimal (minimum), yielding non-parametric estimators with the smallest
    variance among those that control for observable adjustment sets that are minimal
    (of minimum cardinality). In addition, although a globally optimal adjustment
    set among observable adjustment sets does not always exist, we provide a sufficient
    condition for its existence. We provide polynomial time algorithms to compute
    the observable globally optimal (when it exists), optimal minimal, and optimal
    minimum adjustment sets. For studies aimed at assessing the effects of interventions
    at multiple time points, static or dynamic, we derive graphical rules for comparing
    certain pairs of time dependent adjustment sets but we show that no global graphical
    rule is possible for determining optimal time dependent adjustment sets, even
    in graphs without unobservables. Finally, for graphs without unobservables and
    point interventions, we provide a sound and complete graphical criterion for determining
    when a non-parametric optimally adjusted estimator of the population average causal
    effect contrast is semiparametric efficient under the non-parametric causal graphical
    model. Joint work with Ezequiel Smucler and Facundo Sapienza.
  season: spring-2021
- id: ocis-2021-04-06-richard-berk
  url: https://youtu.be/5TS9M3fXgjE
  title: 'Firearm Sales in California Through the Myopic Vision of an Interrupted
    Time Series Causal Analysis Discus sant: John Donohue (Stanford)'
  speaker: Richard Berk
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-04-06'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/1Ah59Po0F5lhTXoqLhBE4pl9y5z0hLB9M/view?usp=sharing
  abstract: There have been many claims in the media and a bit respectable research
    about the causes of variation in firearm sales. The challenges for causal inference
    can be quite daunting. In this talk, I report on an analysis of daily firearm
    sales in California from 1996 through most of 2018 using an interrupted time series
    design and analysis. The design was introduced to social scientists in 1963 by
    Campbell and Stanley, analysis methods were proposed by Box and Tiao in 1975,
    and more recent treatments are easily found (Box et al., 2016). But this approach
    to causal inference can be badly overmatched by the data on firearm sales, especially
    when the causal effects of gun control measures are estimated. For example, there
    can be dramatic responses to a wide variety of abrupt “shocks” to the sales data
    that can introduce serious and unanticipated confounding (e.g., the mass shooting
    in Las Vegas in 2017). Perhaps more important for this online gathering are fundamental
    oversights in the standard statistical methods employed. Test multiplicity problems
    are introduced by adaptive model selection built into recommended practice. The
    challenges are computational and conceptual. Some progress is made on both problems
    that arguably improves on past research, but the take-home message may be to reduce
    aspirations about what can be learned.
  season: spring-2021
- id: ocis-2021-03-16-kun-zhang
  url: https://youtu.be/_MVi6XzOdD0
  title: Learning and Using Causal Representations
  speaker: Kun Zhang
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-03-16'
  topic: causal_inference
  language: en
  discussant: 'C osma Shalizi Abstrac t: When do we have to make use of causal knowledge,
    and when does associational information suffice for machine learning? Can we find
    the causal direction between two variables by analyzing their observed values?
    Can we figure out where latent causal variables should be and how they are related?
    For the purpose of understanding and manipulating systems properly, people often
    attempt to answer such causal questions. Furthermore, we are often concerned with
    artificial intelligence in complex environments. For instance, how can we do transfer
    learning in a principled way? How can machines deal with adversarial attacks?
    Interestingly, it has recently been shown that causal information can facilitate
    understanding and solving various AI problems. This talk focused on how to learn
    causal representations from observation data and why and how the causal perspective
    allows adaptive prediction and a potentially higher level of artificial intelligence.'
  slides: https://drive.google.com/file/d/172ikPRXvnPD_T1JDEdLYzkJdB1VKrCiY/view?usp=sharing
  season: winter-2021
- id: ocis-2021-03-09-luke-keele
  url: https://youtu.be/dErj2RsHm5Y
  title: Hospital Quality Risk Standardization via Approximate Balancing Weights
  speaker: Luke Keele
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-03-09'
  topic: causal_inference
  language: en
  papers:
  - '1911.03071'
  discussant: Sam Pimentel
  slides: https://drive.google.com/file/d/1Th02gZrFyDFGn0Uq1JlTucagbOBuEtc4/view?usp=sharing
  abstract: Comparing outcomes across hospitals, often to identify underperforming
    hospitals, is a critical task in health services research. However, naive comparisons
    of average outcomes, such as surgery complication rates, can be misleading because
    hospital case mixes differ — a hospital’s overall complication rate may be lower
    due to more effective treatments or simply because the hospital serves a healthier
    population overall. In this paper, we develop a method of “direct standardization”
    where we re-weight each hospital patient population to be representative of the
    overall population and then compare the weighted averages across hospitals. Adapting
    methods from survey sampling and causal inference, we find weights that directly
    control for imbalance between the hospital patient mix and the target population,
    even across many patient attributes. Critically, these balancing weights can also
    be tuned to preserve sample size for more precise estimates. We also derive principled
    measures of statistical precision, and use outcome modeling and Bayesian shrinkage
    to increase precision and account for variation in hospital size. We demonstrate
    these methods using claims data from Pennsylvania, Florida, and New York, estimating
    standardized hospital complication rates for general surgery patients. We conclude
    with a discussion of how to detect low performing hospitals.
  season: winter-2021
- id: ocis-2021-02-23-fan-li
  url: https://youtu.be/l1C3DPf9eZw
  title: Causal Mediation Analysis for Sparse and Irregular Longitudinal Data
  speaker: Fan Li
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-02-23'
  topic: causal_inference
  language: en
  discussant: Georgia Papadogeorgou
  slides: https://drive.google.com/file/d/1B_ptIK4B6FeyIkOW7J6ACh7bNqR82tbb/view?usp=sharing
  abstract: Causal mediation analysis seeks to investigate how the treatment effect
    of an exposure on outcomes is mediated through intermediate variables. Although
    many applications involve longitudinal data, the existing methods are not directly
    applicable to settings where the mediator and outcome are measured on sparse and
    irregular time grids. We extend the existing causal mediation framework from a
    functional data analysis perspective, viewing the sparse and irregular longitudinal
    data as realizations of underlying smooth stochastic processes. We define causal
    estimands of direct and indirect effects accordingly and provide corresponding
    identification assumptions. For estimation and inference, we employ a functional
    principal component analysis approach for dimension reduction and use the first
    few functional principal components instead of the whole trajectories in the structural
    equation models. We adopt the Bayesian paradigm to accurately quantify the uncertainties.
    The operating characteristics of the proposed methods are examined via simulations.
    We apply the proposed methods to a longitudinal data set from a wild baboon population
    in Kenya to investigate the causal relationships between early adversity, strength
    of social bonds between animals, and adult glucocorticoid hormone concentrations.
    I will focus on main ideas and try to avoid complex notations (common in mediation
    analysis) as much as I can, and will also invite discussion on the limitations
    and limits of current causal mediation analysis. This is a joint work with Shuxi
    Zeng at Duke University.
  season: winter-2021
- id: ocis-2021-02-16-donald-green
  url: https://youtu.be/qD5Ed9CF7f8
  title: 'Using Placebo-Controlled Designs to Detect Edutainment Effects and Spillovers:
    Results from Two Large-Scale Experiments in Uganda'
  speaker: Donald Green
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-02-16'
  topic: causal_inference
  language: en
  discussant: Molly Offer-Westort
  slides: https://drive.google.com/file/d/1wizN17wB83E79K-b1T2af-O4SDDwzJ3U/view?usp=sharing
  abstract: Education–entertainment refers to dramatizations designed to convey information
    and to change attitudes. Buoyed by observational studies suggesting that education–entertainment
    strongly influences beliefs, attitudes and behaviours, scholars have recently
    assessed education–entertainment by using rigorous experimental designs in field
    settings. Studies conducted in developing countries have repeatedly shown the
    effectiveness of radio and film dramatizations on outcomes ranging from health
    to group conflict. One important gap in the literature is estimation of social
    spillover effects from those exposed to the dramatizations to others in the audience
    members’ social network. In theory, the social diffusion of media effects could
    greatly amplify their policy impact. The current study uses a novel placebo‐controlled
    design that gauges both the direct effects of the treatment on audience members
    as well as the indirect effects of the treatment on others in their family and
    in the community. We implement this design in two large cluster‐randomized experiments
    set in rural Uganda using video dramatizations on the topics of violence against
    women, teacher absenteeism and abortion stigma. We find several instances of sizable
    and highly significant direct effects on the attitudes of audience members, but
    we find little evidence that these effects diffused to others in the villages
    where the videos were aired.
  season: winter-2021
- id: ocis-2021-02-02-interview-with-james-robins
  url: https://youtu.be/j26nYFxRJr0
  speaker: Interview with James Robins
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-02-02'
  topic: causal_inference
  language: en
  season: winter-2021
- id: ocis-2021-01-26-stephen-bates
  url: https://youtu.be/FLDT6T52Kcc
  title: Causal Inference in Genetic Trio studies
  speaker: Stephen Bates
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-01-26'
  topic: causal_inference
  language: en
  discussant: Qingyuan Zhao
  slides: https://drive.google.com/file/d/13E4hwS93QZmqTzGwCKxH5isjaGbEoTtE/view?usp=sharing
  abstract: This work introduces a randomization test using high-dimensional genotypes
    to identify causal relationships between regions of the genome and outcomes (e.g.,
    presence or absence of asthma). The proposed method is immune to the confounding
    factors typically encountered in genetic association studies because inference
    relies only on the randomness in the process of inheritance, a source of plausibly
    independent variation. As a randomization test, the proposed method can leverage
    black-box machine learning algorithms as part of the test statistic, which we
    show leads to improved power.
  season: winter-2021
- id: ocis-2021-01-19-mark-van-der-laan
  url: https://www.youtube.com/watch?v=2jumfnRQpxs
  title: Higher order Targeted Maximum Likelihood Estimation
  speaker: Mark van der Laan
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-01-19'
  topic: causal_inference
  language: en
  discussant: Alex Luedtke
  slides: https://drive.google.com/file/d/1DfsoZUjgf3L8ly_wO3ye_U45-LNWMwfX/view?usp=sharing
  abstract: Asymptotic linearity and efficiency of targeted maximum likelihood estimators
    (TMLE) of target features of the data distribution relies on a a second order
    remainder being asymptotically negligible. However, in finite samples, the second
    order remainder can dominate the sampling distribution so that inference based
    on asymptotic normality would be anti-conservative. We propose a new higher order
    (say k-th order) TMLE, generalizing the regular (first order) TMLE. We prove that
    it satisfies an exact linear expansion, in terms of efficient influence functions
    of sequentially defined higher order fluctuations of the target parameter, with
    a remainder that is a k+1-th order remainder. As a consequence, this k-th order
    TMLE allows statistical inference only relying on the k+1-th order remainder being
    negligible. We present the theoretical result as well as simulations for the second
    order TMLE for nonparametric estimation of the ATE, and of the integrated squared
    density.
  season: winter-2021
- id: ocis-2021-01-12-susan-athey
  url: https://www.youtube.com/watch?v=r2DzGAigTl4&feature=youtu.be
  title: Synthetic Difference in Differences
  speaker: Susan Athey
  venue: OCIS (Online Causal Inference Seminar)
  date: '2021-01-12'
  topic: causal_inference
  language: en
  papers:
  - '1812.09970'
  slides: https://drive.google.com/file/d/1gRHwttUSBKq6nf-10Ta9ut5V1TPnD8CS/view?usp=sharing
  abstract: We present a new estimator for causal effects with panel data that builds
    on insights behind the widely used difference in differences and synthetic control
    methods. Relative to these methods, we find, both theoretically and empirically,
    that the proposed ``synthetic difference in differences'' estimator has desirable
    robustness properties, and that it performs well in settings where the conventional
    estimators are commonly used in practice. We study the asymptotic behavior of
    the estimator when the systematic part of the outcome model includes latent unit
    factors interacted with latent time factors, and we present conditions for consistency
    and asymptotic normality. Joint with Dmitry Arkhangelsky, David A. Hirshberg,
    Guido Imbens, Stefan Wager .
  season: winter-2021
- id: ocis-2020-12-15-luke-miratrix
  url: https://www.youtube.com/watch?v=n0r8HB-uhao&feature=youtu.be
  title: Using national data and meta-analysis techniques to get a handle on how bad
    some biases might be in practice
  speaker: Luke Miratrix
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-12-15'
  topic: causal_inference
  language: en
  discussant: Elizabeth Tipton
  slides: https://drive.google.com/file/d/1WB-5YKw5mCqGrlr8u3O4aIkJlun3-qwB/view?usp=sharing
  abstract: 'Different designs come with different risks for bias and researchers
    and funding agencies have limited data on the magnitude of these different biases.
    How much do unobserved factors bias quasi-experimental designs in education evaluations?
    How problematic is attrition bias in randomized experiments? Across two projects
    we make use of a unique administrative dataset in England, linked to a large archive
    of RCTs. This allows us to complete two types of “within study comparison” analyses,
    one to see how well we can remove selection bias, and one to see how different
    attriters are from nonattriters. We then use tools from meta analysis to explore
    the magnitude of these biases in practice. Overall we find, for our context at
    least, somewhat reassuring news: quasi-experimental designs do tend to produce
    meaningful causal estimates with biases of around 0.03σ (effect size units), and
    attrition also tends to not be a massive concern, averaging at around 0.02σ. That
    being said, both concerns are nontrivial, especially for researchers and policymakers
    interested in low-cost interventions with smaller effects. We therefore discuss
    simple ways to revise uncertainty estimates in light of these findings. Joint
    work with Ben Weidmann , Harvard Graduate School of Education'
  season: fall-2020
- id: ocis-2020-12-08-qingyuan-zhao
  url: https://www.youtube.com/watch?v=xfaMej1NSa4
  title: Selection bias in 2020
  speaker: Qingyuan Zhao
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-12-08'
  topic: causal_inference
  language: en
  discussant: Louisa Smith
  slides: https://drive.google.com/file/d/1AJZQujd43edkCITWeBpXRvtlSYtTf98i/view?usp=sharing
  abstract: This talk will examine the selection bias that occurred in studying some
    most contentious problems in 2020. In the first case study, we will look at the
    estimation of the growth rate and incubation period of COVID-19 and demonstrate
    how early studies drastically misestimated them. In the second case study, we
    will review and hopefully clarify a recent debate on post-treatment selection
    in studying racial discrimination in policing. In the era of data, causal inference
    researchers are uniquely positioned to recognize selection bias, but the cost
    of no or slow action is high.
  season: fall-2020
- id: ocis-2020-12-01-vanessa-didelez
  url: https://www.youtube.com/watch?v=5dMdNGZGVR8&feature=youtu.be
  title: Causal reasoning in survival and time-to-event analyses
  speaker: Vanessa Didelez
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-12-01'
  topic: causal_inference
  language: en
  discussant: Els Goetghebeur
  slides: https://drive.google.com/file/d/1uLGzs2I_MYJbpRTBZfkGchkRoTMnhgMv/view?usp=sharing
  abstract: In this talk I will discuss why causal inference should pay special attention
    to survival and time-to-event settings. Even in an apparently simple case of a
    randomized point-treatment it is common that events other than the event of interest
    occur, sometimes called intercurrent events such as (semi-)competing events or
    time-varying mediators, and of course censoring. The choice of causal estimand
    in such situations should anticipate these issues and suitably represent the research
    question. Recently, we have proposed so-called ''separable effects'', which focus
    on contrasts relating to different components of treatment (or exposure) that
    can be manipulated separately. This approach provides practically relevant estimands
    for various applications faced with time-varying mediation or competing events.
    Mostly, however, in time-to-event settings, treatments or exposures themselves
    are time-dependent (start / stop / switch treatment etc.); or we may, more generally,
    be interested in the causal relations among various types of events or processes.
    This entails potential sources of time-related biases such as time-dependent confounding
    or self-inflicted biases such as immortal-time bias. I will discuss a class of
    graphical models representing dynamic relations between processes which can help
    with causal reasoning in time-to-event settings and shed light onto some of the
    issues. Examples from the field of cancer research will be given. The presentation
    will focus on basic principles and concepts rather than technical details.
  season: fall-2020
- id: ocis-2020-11-24-fan-li
  url: https://www.youtube.com/watch?v=FIyp8Fmr6KA
  title: Propensity score weighting for covariate adjustment in randomized clinical
    trials
  speaker: Fan Li
  venue: OCIS (Online Causal Inference Seminar)
  date: '2020-11-24'
  topic: causal_inference
  language: en
  papers:
  - '2004.10075'
  discussant: Kari Lock Morgan
  slides: https://drive.google.com/file/d/1J5BfhM4jyyrjqR3SMvBFxHZGrzNwurz8/view?usp=sharing
  abstract: Chance imbalance in baseline characteristics is common in randomized clinical
    trials. Regression adjustment such as the analysis of covariance (ANCOVA) is often
    used to account for imbalance and increase precision of the treatment effect estimate.
    An objective alternative is through inverse probability weighting (IPW) of the
    propensity scores. Although IPW and ANCOVA are asymptotically equivalent, the
    former may demonstrate inferior performance in finite samples. In this article,
    we point out that IPW is a special case of the general class of balancing weights,
    and advocate to use overlap weighting (OW) for covariate adjustment. The OW method
    has a unique advantage of completely removing chance imbalance when the propensity
    score is estimated by logistic regression. We show that the OW estimator attains
    the same semiparametric variance lower bound as the most efficient ANCOVA estimator
    and the IPW estimator for a continuous outcome, and derive closed-form variance
    estimators for OW when estimating additive and ratio estimands. Through extensive
    simulations, we demonstrate OW consistently outperforms IPW in finite samples
    and improves the efficiency over ANCOVA and augmented IPW when the degree of treatment
    effect heterogeneity is moderate or when the outcome model is incorrectly specified.
    We apply the proposed OW estimator to the Best Apnea Interventions for Research
    (BestAIR) randomized trial to evaluate the effect of continuous positive airway
    pressure on patient health outcomes. All the discussed propensity score weighting
    methods are implemented in the R package PSweight.
  season: fall-2020
