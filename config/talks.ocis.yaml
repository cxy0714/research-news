- id: ocis-2022-10-11-fan-li
  url: https://youtu.be/9pZtsVA6o4o
  title: A tutorial on Bayesian causal inference
  speaker: Fan Li
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-10-11'
  topic: causal_inference
  language: en
  slides: https://drive.google.com/file/d/13D00lx83aqcYaLaNsbpdEdzqS7JGtf36/view?usp=sharing
  abstract: 'This paper provides a critical review of the Bayesian perspective of
    causal inference based on the potential outcomes framework. We review the causal
    estimands, identification assumptions, and general structure of Bayesian inference
    of causal effects. We highlight issues that are unique to Bayesian causal inference,
    including the role of the propensity score, definition of identifiability, and
    choice of priors in both low and high dimensional regimes. We point out the central
    role of covariate overlap and more generally the design stage in Bayesian causal
    inference. We extend the discussion to two complex assignment mechanisms: instrumental
    variable and time-varying treatments. Throughout, we illustrate the key concepts
    via examples.'
  season: fall-2022
- id: ocis-2022-10-04-lihua-lei
  url: https://youtu.be/z4MXrYFDlQg
  title: Double-Robust Two-Way-Fixed-Effects Regression For Panel Data
  speaker: Lihua Lei
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-10-04'
  topic: causal_inference
  language: en
  papers:
  - '2107.13737'
  discussant: Jeffrey Wooldridge
  slides: https://drive.google.com/file/d/1jTKODJCbXncrvTXKKkBMqU30BlKdwOTB/view?usp=sharing
  abstract: 'We propose a new estimator for the average causal effects of a binary
    treatment with panel data in settings with general treatment patterns. Our approach
    augments the two-way-fixed-effects specification with the unit-specific weights
    that arise from a model for the assignment mechanism. We show how to construct
    these weights in various settings, including situations where units opt into the
    treatment sequentially. The resulting estimator converges to an average (over
    units and time) treatment effect under the correct specification of the assignment
    model. We show that our estimator is more robust than the conventional two-way
    estimator: it remains consistent if either the assignment mechanism or the two-way
    regression model is correctly specified and performs better than the two-way-fixed-effect
    estimator if both are locally misspecified. This strong double robustness property
    quantifies the benefits from modeling the assignment process and motivates using
    our estimator in practice.'
  season: fall-2022
- id: ocis-2022-09-27-vasilis-syrgkanis
  url: https://youtu.be/RYN094Ql2Wg
  title: Automatic Debiased Machine Learning for Dynamic Treatment Effects and General
    Nested Functionals
  speaker: Vasilis Syrgkanis
  venue: OCIS (Online Causal Inference Seminar)
  date: '2022-09-27'
  topic: causal_inference
  language: en
  papers:
  - '2203.13887'
  discussant: Eric Tchetgen Tchetgen
  abstract: We extend the idea of automated debiased machine learning to the dynamic
    treatment regime and more generally to nested functionals. We show that the multiply
    robust formula for the dynamic treatment regime with discrete treatments can be
    re-stated in terms of a recursive Riesz representer characterization of nested
    mean regressions. We then apply a recursive Riesz representer estimation learning
    algorithm that estimates de-biasing corrections without the need to characterize
    how the correction terms look like, such as for instance, products of inverse
    probability weighting terms, as is done in prior work on doubly robust estimation
    in the dynamic regime. Our approach defines a sequence of loss minimization problems,
    whose minimizers are the mulitpliers of the de-biasing correction, hence circumventing
    the need for solving auxiliary propensity models and directly optimizing for the
    mean squared error of the target de-biasing correction. We provide further applications
    of our approach to estimation of dynamic discrete choice models.
  season: fall-2022
- id: ocis-2022-09-20-dominik-janzing
