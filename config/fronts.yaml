# 研究战线定义 — 提案的分组单位。
# 由 `python -m research_news.proposals --build-fronts` 生成，之后可手改：
#   - keywords 决定哪些论文进这条战线（对标题 + key_techniques 做小写子串匹配）
#   - 想砍掉一条战线，直接删掉它，或把 keywords 清空
#   - 想新开一条，照抄格式手写一条即可（key 必须唯一）
# 重新生成会覆盖手改，改完记得提交。

fronts:
- key: causal_inference_proximal_causal_inference
  label: 近端因果推断/负对照变量
  scope: 利用负对照暴露和负对照结果（negative control variables）作为代理变量，在存在未测量混杂时识别和估计因果效应（如直接效应、路径效应、剂量反应函数），核心数学对象为桥函数（bridge
    function）和影响函数。
  topic: causal_inference
  keywords:
  - proximal causal inference
  - negative control
  - bridge function
  - proximal mediation
  - proximal dose-response
  - proximal survival
  - hidden outcomes
  - path-specific effect
  - confounding bridge
  - multiply robust
  - efficient influence function
  - proximal debiased machine learning
  techniques: []
- key: causal_inference_doubly_robust_efficiency
  label: 双稳健估计与半参效率理论
  scope: 发展双稳健（doubly robust）估计量及其影响函数（influence function），推导半参数效率界（semiparametric efficiency bound），并应用于ATE、CATE、分位数效应、剂量反应函数等因果参数的推断。
  topic: causal_inference
  keywords:
  - doubly robust estimation
  - efficient influence function
  - semiparametric efficiency bound
  - cross-fitting
  - influence function
  - double machine learning
  - neyman orthogonality
  - one-step estimator
  - targeted maximum likelihood
  - tmle
  - von mises expansion
  - rate double robustness
  techniques: []
- key: causal_inference_sensitivity_analysis_unmeasured_confounding
  label: 未测量混杂的敏感性分析
  scope: 通过参数化偏离无混杂假设（如边际敏感性模型、校准敏感性分析、混淆函数），推导ATE或分位数效应的部分识别界（sharp bounds），并构建置信区间。
  topic: causal_inference
  keywords:
  - sensitivity analysis
  - unmeasured confounding
  - marginal sensitivity model
  - calibrated sensitivity
  - sharp bounds
  - partial identification
  - confounding function
  - benchmark calibration
  - design sensitivity
  - doubly robust sensitivity
  - e-value
  - cornfield
  techniques: []
- key: causal_inference_instrumental_variables_weak_invalid
  label: 工具变量：弱工具与无效工具
  scope: 在存在弱工具变量（weak instruments）或无效工具变量（invalid instruments）时，进行因果效应的识别、估计和推断，包括孟德尔随机化（Mendelian randomization）中的多工具变量方法。
  topic: causal_inference
  keywords:
  - instrumental variable
  - weak instruments
  - invalid instruments
  - mendelian randomization
  - many weak instruments
  - two-sample iv
  - local average treatment effect
  - overidentification test
  - g-estimation
  - structural mean model
  - continuous iv
  - conditional average treatment effect
  techniques: []
- key: causal_inference_difference_in_differences_panel
  label: 双重差分与面板数据因果推断
  scope: 在双重差分（DID）和面板数据设定下，放宽或检验平行趋势假设（如高阶平行趋势、条件平行趋势），处理交错采纳（staggered adoption）设计，并估计处理效应。
  topic: causal_inference
  keywords:
  - difference-in-differences
  - parallel trends
  - staggered adoption
  - synthetic control
  - panel data
  - conditional parallel trends
  - group-time average treatment effect
