- key: causal_inference_interference_network_spillover
  label: 网络干扰与溢出效应
  scope: 在存在个体间干扰（interference）或网络溢出效应（spillover effects）时，定义和估计因果效应，包括暴露映射（exposure mapping）的误设、部分干扰假设下的有效估计。
