# Institution green-light for deep reads.
#
# Any paper with an author affiliated to one of these institutions is sent to
# deep-read REGARDLESS of its relevance score (it still gets summarized first).
# Affiliations come from OpenAlex (looked up by arXiv id / DOI at run time) and
# from whatever the scrapers captured. Matching is case-insensitive substring
# against normalized affiliation strings, so the canonical names below catch
# "Dept. of Statistics, Stanford University, CA" etc.
#
# Two groups below, merged into one match list:
#   1. US News 2024 Best National Universities — Top 50.
#   2. Strong international statistics / math / econ departments (curated, NOT a
#      strict ranking) — the National list is US-only and would miss Oxbridge,
#      ETH, Toronto, the Asian powerhouses, etc. Trim or extend freely.

ranking_note: "US News 2024 National Top 50 + curated international stats/math departments"

