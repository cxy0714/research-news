# AI evaluation / benchmark track — scoring & summary rubric.
#
# This is a SECOND interest profile, independent of config/interests.yaml.
# The stats track's thresholds are tuned for ~100-200 papers/day; benchmark
# venues dump thousands at once and are scored on measurement quality rather
# than statistical-method overlap, so they get their own file.

researcher: "陈星宇 (Chen Xingyu)"

positioning: |
  「AI 评测 / benchmark」对本人的定位是**方法学兴趣**，不是榜单围观：
  - 关心的是测量本身：benchmark 怎么构造、覆盖了什么构念（construct）、
    难度如何校准、污染如何控制、人类基线是否可靠、LLM-as-judge 与人类
    评分的一致性、榜单分数的统计可靠性；
  - 也用评测结果判断"这个方向到底进展到哪了"，但不追 SOTA 名次；
  - 与统计的连接点：抽样与选择偏差、测量误差、信度/效度、多重比较、
    项目反应理论（IRT）、排序与配对比较、meta-analysis。

primary_interests:
  - benchmark construction and validation (task design, item difficulty, human baselines)
  - evaluation methodology and meta-evaluation (what benchmarks actually measure)
  - contamination / leakage detection and benchmark saturation
  - LLM-as-judge: validation, agreement with humans, bias, prompt sensitivity
  - statistical reliability of evaluation (variance, seeds, confidence intervals, ranking)
  - measurement validity: construct coverage, coverage gaps, shortcut/adversarial items
  - evaluation of agents / long-horizon tasks / tool use
  - evaluation of factuality, hallucination, safety, robustness

secondary_interests:
  - domain benchmarks (code, math, science, medicine, law, finance, education)
  - multimodal benchmarks (vision / audio / video / GUI)
  - RAG and long-context evaluation
  - efficiency / cost / latency evaluation
  - leaderboard dynamics and benchmark adoption

out_of_scope:
  - pure model capability papers that merely report benchmark numbers
  - 'we trained a model and it beats X on Y, with no evaluation methodology'
  - benchmark-flavoured small datasets with no validation or reuse value
  - application papers whose evaluation is an afterthought

summary_style: |
  - 4-6 句中文：先写测什么、怎么构造（任务 / 数据来源 / 规模 / 标注），
    再写关键结果或方法学贡献（污染检查、人类基线、难度校准、judge 验证）。
  - 给出可核对的数字（题目数、模型数、语言数、标注人数、成本）。
  - 末尾一句"为什么值得看"：具体到评测方法学，不要只说"与 AI 评测相关"。

# Display / ingest thresholds for this track.
score_threshold_show: 4
score_threshold_highlight: 8
# Deep reads are opt-in for this track (manual favourites / top papers only).
score_threshold_deepread: 9

# Journal-like rendering: summarize the top N per venue, list the rest compactly.
max_summaries_per_venue: 90
page_size: 40
